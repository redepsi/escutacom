<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto Escuta Comunitária</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .card {
      width: min(90%, 500px);
      padding: 40px;
      background: white;
      border: 1px solid #e5e9ef;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.05);
    }

    h1 {
      margin-bottom: 10px;
      color: #315c8c;
    }

    p {
      color: #667085;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Projeto Escuta Comunitária</h1>
    <p>O sistema está sendo preparado.</p>
  </div>

</body>
</html>
