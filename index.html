      <div class="toolbar">
        <div><h2>Pacientes</h2><div class="muted">Cadastro, disponibilidade e situação dos pacientes.</div></div>
        <button id="newPatientBtn" class="action">+ Novo paciente</button>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:14px">
        <button class="action secondary situation-filter" data-v="ativos">Ativos</button>
        <button class="action secondary situation-filter" data-v="agendado">Agendados</button>
        <button class="action secondary situation-filter" data-v="espera">Na espera</button>
        <button class="action secondary situation-filter" data-v="inativos">Inativos</button>
      </div>
      <div id="patientListWrap"><div class="placeholder">Carregando...</div></div>
    </section>

    <section id="patientFormPanel" class="panel" style="display:none">
      <div class="toolbar"><h2 id="patientFormTitle">Novo paciente</h2></div>
      <div id="patientFormMsg" class="message"></div>
      <div class="field"><label>Número de inscrição</label><input id="pReg" readonly style="background:#f3f4f6;color:#667085"></div>
      <div class="field"><label>Nome (opcional)</label><input id="pName" placeholder="Nome completo"></div>
      <div class="field"><label>Idade (opcional)</label><input id="pAge" type="number" min="0"></div>
      <div class="field"><label>Gênero (opcional)</label>
        <select id="pGender">
          <option value="">Não informado</option>
          ${GENDER_OPTIONS.map(g => `<option value="${g}">${g}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Status</label>
        <select id="pStatus"><option value="ativo">Ativo</option><option value="inativo">Inativo</option></select>
      </div>

      <div style="margin-top:20px;padding-top:16px;border-top:1px solid #e5e9ef">
        <div style="font-weight:700;margin-bottom:4px">Disponibilidade semanal (opcional)</div>
        <div class="muted" style="margin-bottom:12px">Marque os horários em que o paciente pode comparecer. Se nenhum horário for marcado, o paciente é considerado disponível em qualquer horário liberado.</div>
        <div id="patientAvailGrid"><div class="placeholder">Carregando grade...</div></div>
      </div>

      <div style="display:flex;gap:10px;margin-top:20px">
        <button id="savePatientBtn" class="action">Salvar paciente</button>
        <button id="cancelPatientBtn" class="action secondary">Cancelar</button>
      </div>
    </section>`;

  const wrap = document.getElementById('patientListWrap');
  const panel = document.getElementById('patientFormPanel');
  const formTitle = document.getElementById('patientFormTitle');
  const msg = document.getElementById('patientFormMsg');
  const availGridEl = document.getElementById('patientAvailGrid');
  let editingId = null;
  let originalStatus = null;
  let patientsCache = [];
  let clinicSlotsCache = [];

  const { data: clinicSlots } = await db.from('clinic_schedule_slots').select('*').eq('enabled', true);
  clinicSlotsCache = clinicSlots || [];

  let situationFilter = 'ativos';

  async function loadList() {
    const { data, error } = await db.from('patients').select('*').order('created_at', { ascending: false });
    if (error) {
      wrap.innerHTML = `<div class="message error" style="display:block">Erro: ${escapeHtml(error.message)}</div>`;
      return;
    }
    patientsCache = data || [];

    if (patientsCache.length === 0) {
      wrap.innerHTML = `<div class="placeholder">Nenhum paciente cadastrado.</div>`;
      return;
    }

    const patientIds = patientsCache.map(p => p.id);
    const [{ data: allAvail }, { data: activeSeries }] = await Promise.all([
      db.from('patient_availability').select('patient_id, weekday, start_time'),
      db.from('appointment_series').select('patient_id').in('patient_id', patientIds).eq('status', 'ativa')
    ]);

    const availByPatient = {};
    (allAvail || []).forEach(a => {
      if (!availByPatient[a.patient_id]) availByPatient[a.patient_id] = [];
      availByPatient[a.patient_id].push(a);
    });

    const scheduledSet = new Set((activeSeries || []).map(s => s.patient_id));

    const filtered = patientsCache.filter(p => {
      if (situationFilter === 'inativos') return p.status === 'inativo';
      if (p.status === 'inativo') return false; // inativos nunca entram nas outras abas
      if (situationFilter === 'agendado') return scheduledSet.has(p.id);
      if (situationFilter === 'espera') return !scheduledSet.has(p.id);
      return true; // ativos
    });

    if (filtered.length === 0) {
      wrap.innerHTML = `<div class="placeholder">Nenhum paciente nesta situação.</div>`;
      return;
    }

    const rows = filtered.map(p => {
      const statusBadge = p.status === 'ativo'
        ? `<span style="color:#2f855a;font-weight:700">Ativo</span>`
        : `<span style="color:#b42318;font-weight:700">Inativo</span>`;
      const situacao = p.status === 'inativo'
        ? `<span class="muted">Fora da clínica</span>`
        : scheduledSet.has(p.id)
          ? `<span style="color:#2f855a;font-weight:700">Agendado</span>`
          : `<span style="color:#9a6700;font-weight:700">Na espera há ${daysSince(p.created_at)} dia(s)</span>`;
      return `<tr>
        <td><strong>${escapeHtml(p.registration_number)}</strong></td>
        <td>${escapeHtml(p.full_name || '—')}</td>
        <td>${p.age ?? '—'}</td>
        <td>${escapeHtml(p.gender || '—')}</td>
        <td>${formatAvailabilityBadges(availByPatient[p.id])}</td>
        <td>${situacao}</td>
        <td>${statusBadge}</td>
        <td>
          <button class="action secondary edit-patient" data-id="${p.id}" style="padding:6px 10px">Editar</button>
          <button class="action secondary view-ficha" data-id="${p.id}" style="padding:6px 10px">Ficha</button>
          ${p.status === 'inativo' ? `<button class="action secondary delete-patient" data-id="${p.id}" style="padding:6px 10px;color:#b42318">Excluir</button>` : ''}
        </td>
      </tr>`;
    }).join('');

    wrap.innerHTML = `<div style="overflow:auto;font-size:13px"><table style="width:100%;border-collapse:collapse;font-size:13px">
      <tr style="text-align:left;font-size:12px;color:#667085">
        <th style="padding:10px 8px">Inscrição</th><th>Nome</th><th>Idade</th><th>Gênero</th><th>Disponibilidade</th><th>Situação</th><th>Status</th><th>Ações</th>
      </tr>${rows}</table></div>`;

    wrap.querySelectorAll('.edit-patient').forEach(btn => {
      btn.addEventListener('click', () => openForm(patientsCache.find(p => p.id === btn.dataset.id)));
    });
    wrap.querySelectorAll('.view-ficha').forEach(btn => {
      btn.addEventListener('click', () => renderPatientFicha(btn.dataset.id, 'pacientes'));
    });
    wrap.querySelectorAll('.delete-patient').forEach(btn => {
      btn.addEventListener('click', async () => {
        const { count } = await db.from('appointments').select('id', { count: 'exact', head: true }).eq('patient_id', btn.dataset.id);
        if (count && count > 0) {
          alert('Não é possível excluir: este paciente já teve atendimentos registrados. Mantenha-o inativo para preservar o histórico.');
          return;
        }
        if (!confirm('Excluir este paciente definitivamente? Esta ação não pode ser desfeita.')) return;
        await db.from('patient_availability').delete().eq('patient_id', btn.dataset.id);
        const { error } = await db.from('patients').delete().eq('id', btn.dataset.id);
        if (error) alert('Erro ao excluir: ' + error.message); else loadList();
      });
    });
  }

  document.querySelectorAll('.situation-filter').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.v === situationFilter);
    btn.addEventListener('click', () => {
      situationFilter = btn.dataset.v;
      document.querySelectorAll('.situation-filter').forEach(b => b.classList.toggle('active', b.dataset.v === situationFilter));
      loadList();
    });
  });

  function resetForm() {
    editingId = null;
    originalStatus = null;
    formTitle.textContent = 'Novo paciente';
    msg.style.display = 'none';
    document.getElementById('pReg').value = 'Gerado automaticamente ao salvar';
    document.getElementById('pName').value = '';
    document.getElementById('pAge').value = '';
    document.getElementById('pGender').value = '';
    document.getElementById('pStatus').value = 'ativo';
    availGridEl.innerHTML = buildAvailabilityGrid(clinicSlotsCache, []);
    bindAvailabilityToggles(availGridEl);
  }

  async function openForm(patient) {
    resetForm();
    if (patient) {
      editingId = patient.id;
      originalStatus = patient.status;
      formTitle.textContent = 'Editar paciente';
      document.getElementById('pReg').value = patient.registration_number || '';
      document.getElementById('pName').value = patient.full_name || '';
      document.getElementById('pAge').value = patient.age ?? '';
      document.getElementById('pGender').value = patient.gender || '';
      document.getElementById('pStatus').value = patient.status || 'ativo';

      const { data: pAvail } = await db.from('patient_availability').select('*').eq('patient_id', patient.id);
      availGridEl.innerHTML = buildAvailabilityGrid(clinicSlotsCache, pAvail || []);
      bindAvailabilityToggles(availGridEl);
    }
    panel.style.display = 'block';
    panel.scrollIntoView({ behavior: 'smooth' });
  }

  document.getElementById('newPatientBtn').addEventListener('click', () => openForm(null));
  document.getElementById('cancelPatientBtn').addEventListener('click', () => { panel.style.display = 'none'; });

  document.getElementById('savePatientBtn').addEventListener('click', async () => {
    const btn = document.getElementById('savePatientBtn');
    msg.style.display = 'none';

    const fullName = document.getElementById('pName').value.trim() || null;
    const ageVal = document.getElementById('pAge').value;
    const age = ageVal ? parseInt(ageVal) : null;
    const gender = document.getElementById('pGender').value || null;
    const status = document.getElementById('pStatus').value;

    btn.disabled = true; btn.textContent = 'Salvando...';

    let registration = editingId ? document.getElementById('pReg').value.trim() : null;

    if (!editingId) {
      const { data: generatedNumber, error: genError } = await db.rpc('next_patient_registration_number');
      if (genError || !generatedNumber) {
        msg.textContent = 'Erro ao gerar número de inscrição: ' + (genError ? genError.message : 'tente novamente.');
        msg.className = 'message error'; msg.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Salvar paciente';
        return;
      }
      registration = generatedNumber;
    }

    const payload = { registration_number: registration, full_name: fullName, age, gender, status };

    const result = editingId
      ? await db.from('patients').update(payload).eq('id', editingId).select().single()
      : await db.from('patients').insert([payload]).select().single();

    if (result.error) {
      msg.textContent = 'Erro ao salvar: ' + result.error.message;
      msg.className = 'message error'; msg.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Salvar paciente';
      return;
    }

    const savedId = result.data.id;
    const selectedSlots = readSelectedSlots(availGridEl).map(s => ({ ...s, patient_id: savedId }));

    await db.from('patient_availability').delete().eq('patient_id', savedId);
    if (selectedSlots.length > 0) await db.from('patient_availability').insert(selectedSlots);

    // Se o paciente acabou de ser inativado, oferece cancelar os atendimentos futuros
    if (editingId && originalStatus === 'ativo' && status === 'inativo') {
      const confirmCancel = confirm('Este paciente foi marcado como inativo. Deseja cancelar todos os atendimentos futuros dele agora?');
      if (confirmCancel) {
        const { error: rpcError } = await db.rpc('cancelar_atendimentos_futuros_paciente', { p_patient_id: savedId });
        if (rpcError) alert('Erro ao cancelar atendimentos futuros: ' + rpcError.message);
      }
    }

    panel.style.display = 'none';
    await loadList();
    btn.disabled = false; btn.textContent = 'Salvar paciente';
  });

  resetForm();
  await loadList();
}

// ---------------------------------------------------------------------------
// FICHA DO PACIENTE (histórico completo)
// ---------------------------------------------------------------------------
async function renderPatientFicha(patientId, returnPage = 'pacientes') {
  content.innerHTML = `<div class="placeholder">Carregando ficha...</div>`;

  const { data: patient, error: patErr } = await db.from('patients').select('*').eq('id', patientId).single();
  if (patErr) { content.innerHTML = `<div class="message error" style="display:block">Erro: ${escapeHtml(patErr.message)}</div>`; return; }

  const { data: appts } = await db.from('appointments')
    .select('*').eq('patient_id', patientId).order('appointment_date', { ascending: false });

  const internIds = [...new Set((appts || []).map(a => a.intern_id))];
  const { data: profiles } = internIds.length
    ? await db.from('profiles').select('id, full_name').in('id', internIds)
    : { data: [] };
  const nameById = {};
  (profiles || []).forEach(p => { nameById[p.id] = p.full_name; });

  const all = appts || [];
  const totalAgendado = all.filter(a => a.status === 'agendado').length;
  const presentes = all.filter(a => a.attendance_status === 'presente').length;
  const ausentes = all.filter(a => a.attendance_status === 'ausente').length;
  const cancelados = all.filter(a => a.status === 'cancelado').length;

  const rows = all.map(a => {
    const isCancelled = a.status === 'cancelado';
    const attLabel = { pendente: 'Pendente', presente: 'Presente', ausente: 'Ausente', cancelado: 'Cancelado' }[a.attendance_status];
    const reason = a.cancellation_reason ? CANCELLATION_REASON_LABELS[a.cancellation_reason] || a.cancellation_reason : '';
    return `<tr style="${isCancelled ? 'opacity:.6' : ''}">
      <td style="padding:6px 8px">${fmtBr(a.appointment_date)}</td>
      <td>${a.start_time.slice(0,5)}–${a.end_time.slice(0,5)}</td>
      <td>${escapeHtml(nameById[a.intern_id] || '?')}</td>
      <td>${isCancelled ? '<span style="color:#b42318;font-weight:700">Cancelado</span>' : attLabel}</td>
      <td style="font-size:12px">${isCancelled ? `${a.cancelled_by || ''}${reason ? ' — ' + reason : ''}` : ''}</td>
    </tr>`;
  }).join('');

  content.innerHTML = `
    <section class="panel">
      <button id="backFromFicha" class="action secondary" style="margin-bottom:14px">← Voltar</button>
      <h2 style="margin-top:0">Ficha do paciente #${escapeHtml(patient.registration_number)}</h2>
      <div class="muted" style="margin-bottom:16px">${escapeHtml(patient.full_name || 'Nome não informado')} ${patient.age ? '· ' + patient.age + ' anos' : ''} ${patient.gender ? '· ' + escapeHtml(patient.gender) : ''}</div>

      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">
        <div class="panel" style="margin-bottom:0;padding:14px"><div class="muted" style="font-size:12px">Agendados (futuros)</div><strong style="font-size:22px">${totalAgendado}</strong></div>
        <div class="panel" style="margin-bottom:0;padding:14px"><div class="muted" style="font-size:12px">Presenças</div><strong style="font-size:22px;color:#2f855a">${presentes}</strong></div>
        <div class="panel" style="margin-bottom:0;padding:14px"><div class="muted" style="font-size:12px">Faltas</div><strong style="font-size:22px;color:#b42318">${ausentes}</strong></div>
        <div class="panel" style="margin-bottom:0;padding:14px"><div class="muted" style="font-size:12px">Cancelados</div><strong style="font-size:22px;color:#9a6700">${cancelados}</strong></div>
      </div>

      ${all.length === 0 ? '<div class="placeholder">Nenhum atendimento registrado para este paciente ainda.</div>' : `
      <div style="overflow:auto">
        <table style="width:100%;border-collapse:collapse">
          <tr style="text-align:left;font-size:12px;color:#667085">
            <th style="padding:6px 8px">Data</th><th>Horário</th><th>Estagiário</th><th>Situação</th><th>Detalhe do cancelamento</th>
          </tr>${rows}
        </table>
      </div>`}
    </section>`;

  document.getElementById('backFromFicha').addEventListener('click', () => { currentPage = returnPage; render(); });
}

// ---------------------------------------------------------------------------
// PÁGINA: MINHA AGENDA (estagiário) — confirmação e registro de presença
// ---------------------------------------------------------------------------
let internAgendaView = 'semana';
let internAgendaAnchor = new Date();

async function renderMinhaAgenda() {
  if (!currentIntern) {
    content.innerHTML = `<section class="panel"><div class="placeholder">Você não possui um cadastro de estagiário vinculado a este login.</div></section>`;
    return;
  }

  content.innerHTML = `
    <div id="inicioCards" style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px">
      <div class="placeholder">Carregando...</div>
    </div>
    <section class="panel"><h2>Ações necessárias</h2><div id="acoesWrap" class="placeholder">Carregando...</div></section>

    <section class="panel">
      <div class="toolbar"><div><h2>Minha agenda</h2><div class="muted">Confirme seus atendimentos e registre a presença após o horário.</div></div></div>

      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px">
        <div style="display:flex;gap:4px">
          <button class="action secondary iview-btn" data-v="dia">Dia</button>
          <button class="action secondary iview-btn" data-v="semana">Semana</button>
          <button class="action secondary iview-btn" data-v="mes">Mês</button>
        </div>
        <button id="iPrevPeriod" class="action secondary">◀</button>
        <div id="iPeriodLabel" style="font-weight:700;min-width:160px;text-align:center"></div>
        <button id="iNextPeriod" class="action secondary">▶</button>
        <button id="iTodayBtn" class="action secondary">Hoje</button>
      </div>

      <div id="myAgendaListWrap"><div class="placeholder">Carregando...</div></div>
    </section>`;

  await loadInternStatsAndActions();

  const listWrap = document.getElementById('myAgendaListWrap');

  document.querySelectorAll('.iview-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.v === internAgendaView);
    btn.addEventListener('click', () => {
      internAgendaView = btn.dataset.v;
      document.querySelectorAll('.iview-btn').forEach(b => b.classList.toggle('active', b.dataset.v === internAgendaView));
      loadMyAppointments();
    });
  });

  document.getElementById('iPrevPeriod').addEventListener('click', () => { shiftInternAnchor(-1); loadMyAppointments(); });
  document.getElementById('iNextPeriod').addEventListener('click', () => { shiftInternAnchor(1); loadMyAppointments(); });
  document.getElementById('iTodayBtn').addEventListener('click', () => { internAgendaAnchor = new Date(); loadMyAppointments(); });

  function shiftInternAnchor(dir) {
    const a = new Date(internAgendaAnchor);
    if (internAgendaView === 'dia') a.setDate(a.getDate() + dir);
    else if (internAgendaView === 'semana') a.setDate(a.getDate() + dir * 7);
    else a.setMonth(a.getMonth() + dir);
    internAgendaAnchor = a;
  }

  async function loadMyAppointments() {
    const range = getDateRange(internAgendaView, internAgendaAnchor);
    document.getElementById('iPeriodLabel').textContent = periodLabel(internAgendaView, range);

    const { data: appts, error } = await db.from('appointments')
      .select('id, appointment_date, start_time, end_time, status, intern_confirmation, patient_confirmation, attendance_status, patient_id, patients(registration_number, full_name)')
      .eq('intern_id', currentIntern.id)
      .gte('appointment_date', toDateStr(range.start))
      .lte('appointment_date', toDateStr(range.end))
      .order('appointment_date').order('start_time');

    if (error) { listWrap.innerHTML = `<div class="message error" style="display:block">Erro: ${escapeHtml(error.message)}</div>`; return; }
    if (!appts || appts.length === 0) { listWrap.innerHTML = `<div class="placeholder">Nenhum atendimento neste período.</div>`; return; }

    const todayStr = toDateStr(new Date());
    const byDate = {};
    appts.forEach(a => { (byDate[a.appointment_date] = byDate[a.appointment_date] || []).push(a); });

    let html = '';
    Object.keys(byDate).sort().forEach(date => {
      const d = new Date(date + 'T00:00:00');
      const weekdayLabel = d.toLocaleDateString('pt-BR', { weekday: 'long' });
      html += `<div style="margin:16px 0 6px;font-weight:700;text-transform:capitalize">${weekdayLabel}, ${fmtBr(date)}</div>
        <table style="width:100%;border-collapse:collapse;font-size:13px">
        <tr style="text-align:left;font-size:12px;color:#667085">
          <th style="padding:6px 8px">Horário</th><th style="text-align:left">Paciente</th><th>Minha confirmação</th><th>Presença do paciente</th><th>Ficha</th>
        </tr>`;

      byDate[date].forEach(a => {
        const patLabel = a.patients ? `#${a.patients.registration_number} ${a.patients.full_name || ''}` : '—';
        const isCancelled = a.status === 'cancelado';
        const isPast = date <= todayStr;

        const pc = a.patient_confirmation;
        const pcColor = pc === 'confirmado' ? '#2f855a' : pc === 'nao_confirmado' ? '#b42318' : '#9a6700';
        const pcLabel = { aguardando: 'Aguardando', confirmado: 'Confirmado', nao_confirmado: 'Não confirmado' }[pc];
        const patCell = `${escapeHtml(patLabel)}${isCancelled ? '' : `<br><span style="font-size:11px;color:${pcColor}">Paciente: ${pcLabel}</span>`}`;

        let confCell, presCell;

        if (isCancelled) {
          confCell = `<span style="color:#b42318;font-weight:700">Cancelado</span>`;
          presCell = '—';
        } else {
          // Confirmação: editável antes do dia do atendimento; só leitura depois
          const conf = a.intern_confirmation;
          const confColor = conf === 'confirmado' ? '#176b36' : conf === 'nao_confirmado' ? '#b42318' : '#475467';
          const confLabelRead = { aguardando: 'Aguardando', confirmado: '✓ Confirmado', nao_confirmado: '✗ Não confirmado' }[conf];
          if (!isPast) {
            let style, label;
            if (conf === 'confirmado') { style = 'background:#e9f7ef;color:#176b36;border:1px solid #bce3cc'; label = '✓ Confirmado'; }
            else if (conf === 'nao_confirmado') { style = 'background:#fdecec;color:#b42318;border:1px solid #f3c6c6'; label = '✗ Não poderei comparecer'; }
            else { style = 'background:#f3f4f6;color:#475467;border:1px solid #e5e7eb'; label = 'Confirmar atendimento'; }
            confCell = `<button class="toggle-confirm" data-id="${a.id}" data-current="${conf}"
              style="${style};font-weight:700;padding:7px 12px;border-radius:8px;font-size:12px;cursor:pointer;border-width:1px;border-style:solid">${label}</button>`;
          } else {
            confCell = `<span style="color:${confColor};font-weight:700;font-size:12px">${confLabelRead}</span>`;
          }

          // Presença: só fica ativa a partir do dia do atendimento
          const att = a.attendance_status;
          if (!isPast) {
            presCell = `<span class="muted" style="font-size:12px">Disponível no dia</span>`;
          } else {
            let style, label;
            if (att === 'presente') { style = 'background:#e9f7ef;color:#176b36;border:1px solid #bce3cc'; label = '✓ Compareceu'; }
            else if (att === 'ausente') { style = 'background:#fdecec;color:#b42318;border:1px solid #f3c6c6'; label = '✗ Não compareceu'; }
            else { style = 'background:#f3f4f6;color:#475467;border:1px solid #e5e7eb'; label = 'Marcar presença'; }
            presCell = `<button class="toggle-presence" data-id="${a.id}" data-current="${att}"
              style="${style};font-weight:700;padding:7px 12px;border-radius:8px;font-size:12px;cursor:pointer;border-width:1px;border-style:solid">${label}</button>`;
          }
        }

        html += `<tr style="${isCancelled ? 'opacity:.5;text-decoration:line-through' : ''}">
          <td style="padding:6px 8px">${a.start_time.slice(0,5)}–${a.end_time.slice(0,5)}</td>
          <td style="text-align:left">${patCell}</td>
          <td>${confCell}</td>
          <td>${presCell}</td>

let agendaView = 'semana';    // 'dia' | 'semana' | 'mes'

function getDateRange(view, anchor) {
  const a = new Date(anchor.getFullYear(), anchor.getMonth(), anchor.getDate());
  if (view === 'dia') return { start: new Date(a), end: new Date(a) };
  if (view === 'semana') {
    const day = a.getDay();
    const diffToMonday = day === 0 ? -6 : 1 - day;
    const monday = new Date(a); monday.setDate(a.getDate() + diffToMonday);
    const saturday = new Date(monday); saturday.setDate(monday.getDate() + 5);
    return { start: monday, end: saturday };
  }
  const first = new Date(a.getFullYear(), a.getMonth(), 1);
  const last = new Date(a.getFullYear(), a.getMonth() + 1, 0);
  return { start: first, end: last };
}

function toDateStr(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function fmtBr(dateStr) { return dateStr.split('-').reverse().join('/'); }

function periodLabel(view, range) {
  if (view === 'dia') return fmtBr(toDateStr(range.start));
  if (view === 'semana') return `${fmtBr(toDateStr(range.start))} a ${fmtBr(toDateStr(range.end))}`;
  return range.start.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
}

    const isPast = a.appointment_date <= todayStrForRows;

    let patCell, internCell, presCell;

    if (isCancelled) {
      patCell = `<div style="text-align:left">${escapeHtml(patLabel)}</div>`;
      internCell = `<div style="text-align:left">${escapeHtml(internName)}</div>`;
      presCell = '—';
    } else {
      const cp = a.patient_confirmation;
      let cpStyle, cpLabel;
      if (cp === 'confirmado') { cpStyle = 'background:#e9f7ef;color:#176b36;border:1px solid #bce3cc'; cpLabel = '✓ Confirmado'; }
      else if (cp === 'nao_confirmado') { cpStyle = 'background:#fdecec;color:#b42318;border:1px solid #f3c6c6'; cpLabel = '✗ Não confirmado'; }
      else { cpStyle = 'background:#f3f4f6;color:#475467;border:1px solid #e5e7eb'; cpLabel = 'Confirmar'; }
      patCell = `<div style="text-align:left">${escapeHtml(patLabel)}</div>
        <button class="toggle-conf-patient" data-id="${a.id}" data-current="${cp}"
          style="${cpStyle};font-weight:700;padding:4px 9px;border-radius:8px;font-size:11px;cursor:pointer;margin-top:4px">${cpLabel}</button>`;

      const ci = a.intern_confirmation;
      let ciStyle, ciLabel;
      if (ci === 'confirmado') { ciStyle = 'background:#e9f7ef;color:#176b36;border:1px solid #bce3cc'; ciLabel = '✓ Confirmado'; }
      else if (ci === 'nao_confirmado') { ciStyle = 'background:#fdecec;color:#b42318;border:1px solid #f3c6c6'; ciLabel = '✗ Não confirmado'; }
      else { ciStyle = 'background:#f3f4f6;color:#475467;border:1px solid #e5e7eb'; ciLabel = 'Confirmar'; }
      internCell = `<div style="text-align:left">${escapeHtml(internName)}</div>
        <button class="toggle-conf-intern" data-id="${a.id}" data-current="${ci}"
          style="${ciStyle};font-weight:700;padding:4px 9px;border-radius:8px;font-size:11px;cursor:pointer;margin-top:4px">${ciLabel}</button>`;

      if (!isPast) {
        presCell = `<span class="muted" style="font-size:12px">Disponível no dia</span>`;
      } else {
        const att = a.attendance_status;
        let attStyle, attLabel2;
        if (att === 'presente') { attStyle = 'background:#e9f7ef;color:#176b36;border:1px solid #bce3cc'; attLabel2 = '✓ Compareceu'; }
        else if (att === 'ausente') { attStyle = 'background:#fdecec;color:#b42318;border:1px solid #f3c6c6'; attLabel2 = '✗ Não compareceu'; }
        else { attStyle = 'background:#f3f4f6;color:#475467;border:1px solid #e5e7eb'; attLabel2 = 'Marcar presença'; }
        presCell = `<button class="toggle-presence" data-id="${a.id}" data-current="${att}"
          style="${attStyle};font-weight:700;padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer">${attLabel2}</button>`;
      }
    }

    const whoCancelledLabel = { paciente: 'Paciente', estagiario: 'Estagiário', coordenacao: 'Coordenação' }[a.cancelled_by] || '';
    const reasonLabel = a.cancellation_reason ? CANCELLATION_REASON_LABELS[a.cancellation_reason] || '' : '';
    const acaoCell = isCancelled
      ? `<span title="${escapeHtml(reasonLabel)}" style="font-size:12px;color:#9a6700;font-weight:700">Cancelado por ${whoCancelledLabel}</span>
         <button class="action secondary uncancel-appt" data-id="${a.id}" style="padding:3px 8px;font-size:11px;margin-left:6px">Reativar</button>`
      : `<button class="action secondary edit-series-btn" data-series-id="${a.series_id}" style="padding:4px 8px;font-size:12px">Editar</button>
         <button class="action secondary cancel-appt" data-id="${a.id}" style="padding:4px 8px;font-size:12px;color:#b42318">Cancelar</button>`;

    return `<tr style="${isCancelled ? 'opacity:.6' : ''}">
      <td style="padding:6px 8px">${a.start_time.slice(0,5)}–${a.end_time.slice(0,5)}</td>
      <td>${patCell}</td>
      <td>${internCell}</td>
      <td>${presCell}</td>
      <td>${acaoCell}</td>
    </tr>`;
  }

  function renderDateGroups(list) {
    if (list.length === 0) return '';
    const byDate = {};
    list.forEach(a => { (byDate[a.appointment_date] = byDate[a.appointment_date] || []).push(a); });

    return Object.keys(byDate).sort().map(date => {
      const d = new Date(date + 'T00:00:00');
      const weekdayLabel = d.toLocaleDateString('pt-BR', { weekday: 'long' });
      const rows = byDate[date].map(renderApptRow).join('');
      return `<div style="margin:16px 0 6px;font-weight:700;text-transform:capitalize">${weekdayLabel}, ${fmtBr(date)}</div>
        <table style="width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed">
        <colgroup>
          <col style="width:12%"><col style="width:27%"><col style="width:27%"><col style="width:18%"><col style="width:16%">
        </colgroup>
        <tr style="text-align:left;font-size:12px;color:#667085">
          <th style="padding:6px 8px">Horário</th><th style="text-align:left">Paciente</th><th style="text-align:left">Estagiário</th><th>Presença</th><th>Ações</th>
        </tr>${rows}</table>`;
    }).join('');
  }

  async function loadAppointments() {
    const range = getDateRange(agendaView, agendaAnchor);
    document.getElementById('periodLabel').textContent = periodLabel(agendaView, range);

    let query = db.from('appointments')
      .select('id, series_id, appointment_date, start_time, end_time, status, intern_confirmation, patient_confirmation, attendance_status, cancelled_by, cancellation_reason, patient_id, intern_id, patients(registration_number, full_name)')
      .gte('appointment_date', toDateStr(range.start))
      .lte('appointment_date', toDateStr(range.end))
      .order('appointment_date').order('start_time');

    if (agendaInternFilter !== 'todos') query = query.eq('intern_id', agendaInternFilter);
    if (agendaPatientFilter !== 'todos') query = query.eq('patient_id', agendaPatientFilter);

    const { data: appts, error } = await query;
    if (error) { listWrap.innerHTML = `<div class="message error" style="display:block">Erro: ${escapeHtml(error.message)}</div>`; return; }

    if (!appts || appts.length === 0) {
      listWrap.innerHTML = `<div class="placeholder">Nenhum atendimento neste período.</div>`;
      return;
    }

    const nowDateStr = toDateStr(new Date());
    const nowTimeStr = new Date().toTimeString().slice(0, 8);
    const isUpcoming = a => a.status === 'agendado'
      && (a.appointment_date > nowDateStr || (a.appointment_date === nowDateStr && a.start_time > nowTimeStr));

    const upcoming = appts.filter(isUpcoming);
    const concluded = appts.filter(a => !isUpcoming(a));

    let html = renderDateGroups(upcoming);
    if (concluded.length > 0) {
      html += `<div style="margin:28px 0 8px;font-weight:700;color:#98a2b3">— Já concluídos —</div>`;
      html += renderDateGroups(concluded);
    }
    if (!html) html = `<div class="placeholder">Nenhum atendimento neste período.</div>`;

    listWrap.innerHTML = html;

    listWrap.querySelectorAll('.toggle-conf-intern').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Confirmar o atendimento é tarefa do estagiário. Deseja mesmo alterar isso agora?')) return;
        const next = btn.dataset.current === 'confirmado' ? 'nao_confirmado' : 'confirmado';
        const { error } = await db.rpc('confirmar_atendimento', { p_appointment_id: btn.dataset.id, p_confirmacao: next });
        if (error) alert('Erro: ' + error.message); else loadAppointments();
      });
    });

    listWrap.querySelectorAll('.toggle-conf-patient').forEach(btn => {
      btn.addEventListener('click', async () => {
        const next = btn.dataset.current === 'confirmado' ? 'nao_confirmado' : 'confirmado';
        const { error } = await db.from('appointments').update({ patient_confirmation: next }).eq('id', btn.dataset.id);
        if (error) alert('Erro: ' + error.message); else loadAppointments();
      });
    });

    listWrap.querySelectorAll('.toggle-presence').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Marcar a presença é tarefa do estagiário. Deseja mesmo alterar isso agora?')) return;
        const next = btn.dataset.current === 'presente' ? 'ausente' : 'presente';
        const { error } = await db.rpc('registrar_atendimento', { p_appointment_id: btn.dataset.id, p_status: next, p_cancelado_por: null });
        if (error) alert('Erro: ' + error.message); else loadAppointments();
      });
    });

    listWrap.querySelectorAll('.uncancel-appt').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Reativar este atendimento? Ele voltará para o status agendado.')) return;
        const { error } = await db.from('appointments').update({
          status: 'agendado', cancelled_by: null, cancelled_at: null, cancellation_reason: null
        }).eq('id', btn.dataset.id);
        if (error) alert('Erro: ' + error.message); else loadAppointments();
      });
    });

    const cancelModal = document.getElementById('cancelReasonModal');
    let cancelTargetId = null;

    listWrap.querySelectorAll('.cancel-appt').forEach(btn => {
      btn.addEventListener('click', () => {
        cancelTargetId = btn.dataset.id;
        document.getElementById('cancelReasonSelect').value = 'paciente_nao_respondeu';
        cancelModal.style.display = 'flex';
      });
    });

    document.getElementById('closeCancelModalBtn').onclick = () => { cancelModal.style.display = 'none'; cancelTargetId = null; };
    document.getElementById('confirmCancelReasonBtn').onclick = async () => {
      if (!cancelTargetId) return;
      const reason = document.getElementById('cancelReasonSelect').value;
      await db.from('appointments').update({
        status: 'cancelado', cancelled_by: 'coordenacao', cancelled_at: new Date().toISOString(),
        cancellation_reason: reason
      }).eq('id', cancelTargetId);
      cancelModal.style.display = 'none';
      cancelTargetId = null;
      loadAppointments();
    };

    // ---- Editar série (agendamento) ----
    const editModal = document.getElementById('editSeriesModal');
    const editSlotSelect = document.getElementById('editSeriesSlot');
    const editEndDate = document.getElementById('editSeriesEndDate');
    const editInfo = document.getElementById('editSeriesInfo');
    const editMsg = document.getElementById('editSeriesMsg');
    let editingSeries = null;

    listWrap.querySelectorAll('.edit-series-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        editMsg.style.display = 'none';
        editSlotSelect.innerHTML = '<option value="">Carregando...</option>';
        editInfo.textContent = 'Carregando...';
        editModal.style.display = 'flex';

        const { data: series, error: seriesErr } = await db.from('appointment_series').select('*').eq('id', btn.dataset.seriesId).single();
        if (seriesErr) { editInfo.textContent = 'Erro ao carregar: ' + seriesErr.message; return; }
        editingSeries = series;

        const patientName = (() => {
          const p = (appts || []).find(x => x.patient_id === series.patient_id)?.patients;
          return p ? `#${p.registration_number} ${p.full_name || ''}` : series.patient_id;
        })();
        const internName = nameById[series.intern_id] || '?';
        editInfo.innerHTML = `Paciente: <strong>${escapeHtml(patientName)}</strong> · Estagiário: <strong>${escapeHtml(internName)}</strong>`;

        const [{ data: clinicSlots }, { data: internAvail }, { data: patAvail }] = await Promise.all([
          db.from('clinic_schedule_slots').select('*').eq('enabled', true),
          db.from('intern_availability').select('weekday, start_time').eq('intern_id', series.intern_id),
          db.from('patient_availability').select('weekday, start_time').eq('patient_id', series.patient_id)
        ]);

        const candidates = (clinicSlots || []).filter(c => {
          const internMatch = (internAvail || []).some(a => a.weekday === c.weekday && a.start_time.slice(0, 5) === c.start_time.slice(0, 5));
          if (!internMatch) return false;
          if (patAvail && patAvail.length > 0) {
            return patAvail.some(p => p.weekday === c.weekday && p.start_time.slice(0, 5) === c.start_time.slice(0, 5));
          }
          return true;
        }).sort((a, b) => a.weekday - b.weekday || a.start_time.localeCompare(b.start_time));

        if (candidates.length === 0) {
          editSlotSelect.innerHTML = '<option value="">Nenhum horário compatível encontrado</option>';
        } else {
          editSlotSelect.innerHTML = candidates.map(c => {
            const dayLabel = WEEKDAYS.find(d => d.n === c.weekday).l;
            const val = `${c.weekday}|${c.start_time}|${c.end_time}`;
            const isCurrent = c.weekday === series.weekday && c.start_time.slice(0, 5) === series.start_time.slice(0, 5);
            return `<option value="${val}" ${isCurrent ? 'selected' : ''}>${dayLabel} ${c.start_time.slice(0,5)}–${c.end_time.slice(0,5)}</option>`;
          }).join('');
        }

        editEndDate.value = series.series_end;
      });
    });

    document.getElementById('closeEditSeriesBtn').onclick = () => { editModal.style.display = 'none'; editingSeries = null; };

    document.getElementById('saveEditSeriesBtn').onclick = async () => {
      if (!editingSeries) return;
      editMsg.style.display = 'none';

      const slotVal = editSlotSelect.value;
      const newEndDate = editEndDate.value;
      if (!slotVal || !newEndDate) {
        editMsg.textContent = 'Selecione o horário e a data de término.';
        editMsg.className = 'message error'; editMsg.style.display = 'block';
        return;
      }
      if (newEndDate < toDateStr(new Date())) {
        editMsg.textContent = 'A data de término não pode ser no passado.';
        editMsg.className = 'message error'; editMsg.style.display = 'block';
        return;
      }

      const [weekdayStr, newStart, newEnd] = slotVal.split('|');
      const newWeekday = parseInt(weekdayStr);
      const btn = document.getElementById('saveEditSeriesBtn');
      btn.disabled = true; btn.textContent = 'Salvando...';

      // Gera as novas datas futuras (a partir de hoje) até a nova data de término
      const todayD = new Date(toDateStr(new Date()) + 'T00:00:00');
      let curr = new Date(todayD);
      while (curr.getDay() !== newWeekday) curr.setDate(curr.getDate() + 1);
      const endD = new Date(newEndDate + 'T00:00:00');
      const newDates = [];
      while (curr <= endD) { newDates.push(toDateStr(curr)); curr.setDate(curr.getDate() + 7); }

      if (newDates.length > 0) {
        const { data: conflicts } = await db.from('appointments')
          .select('appointment_date, intern_id, patient_id, series_id')
          .in('appointment_date', newDates).eq('start_time', newStart).eq('status', 'agendado');

        const hasConflict = (conflicts || []).some(c => c.series_id !== editingSeries.id &&
          (c.intern_id === editingSeries.intern_id || c.patient_id === editingSeries.patient_id));

        if (hasConflict) {
          editMsg.textContent = 'Conflito: o estagiário ou o paciente já têm atendimento em pelo menos uma dessas datas/horário.';
          editMsg.className = 'message error'; editMsg.style.display = 'block';
          btn.disabled = false; btn.textContent = 'Salvar alterações';
          return;
        }
      }

      // Remove os atendimentos futuros ainda pendentes desta série
      const { error: delErr } = await db.from('appointments').delete()
        .eq('series_id', editingSeries.id).eq('status', 'agendado').eq('attendance_status', 'pendente')
        .gte('appointment_date', toDateStr(new Date()));
      if (delErr) {
        editMsg.textContent = 'Erro ao atualizar: ' + delErr.message;
        editMsg.className = 'message error'; editMsg.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Salvar alterações';
        return;
      }

      await db.from('appointment_series').update({
        weekday: newWeekday, start_time: newStart, end_time: newEnd, series_end: newEndDate
      }).eq('id', editingSeries.id);

      if (newDates.length > 0) {
        const newAppts = newDates.map(d => ({
          series_id: editingSeries.id, patient_id: editingSeries.patient_id, intern_id: editingSeries.intern_id,
          appointment_date: d, start_time: newStart, end_time: newEnd
        }));
        await db.from('appointments').insert(newAppts);
      }

      editModal.style.display = 'none';
      editingSeries = null;
      btn.disabled = false; btn.textContent = 'Salvar alterações';
      loadAppointments();
    };
  }

  // ---- Formulário de novo agendamento ----
  const fPatient = document.getElementById('fPatient');
  const fIntern = document.getElementById('fIntern');
  const fSlot = document.getElementById('fSlot');
  const fStartDate = document.getElementById('fStartDate');
  const fEndDate = document.getElementById('fEndDate');
  const previewText = document.getElementById('apptPreviewText');
  const confirmBtn = document.getElementById('confirmApptBtn');

  fPatient.innerHTML = '<option value="">Selecione...</option>' +
    patientsList.map(p => `<option value="${p.id}">#${escapeHtml(p.registration_number)} — ${escapeHtml(p.full_name || 'Sem nome')}</option>`).join('');

  function resetApptForm() {
    msg.style.display = 'none';
    fPatient.value = ''; fIntern.innerHTML = '<option value="">Escolha o paciente primeiro</option>'; fIntern.disabled = true;
    fSlot.innerHTML = '<option value="">Escolha o estagiário primeiro</option>'; fSlot.disabled = true;
    fStartDate.value = ''; fEndDate.value = '';
    previewText.textContent = 'Preencha os campos acima.';
    confirmBtn.disabled = true;
  }

  async function updateInternOptions() {
    const patientId = fPatient.value;
    fIntern.innerHTML = '<option value="">Selecione...</option>';
    fSlot.innerHTML = '<option value="">Escolha o estagiário primeiro</option>';
    fSlot.disabled = true;
    confirmBtn.disabled = true;
    previewText.textContent = 'Preencha os campos acima.';

    if (!patientId) { fIntern.disabled = true; fIntern.innerHTML = '<option value="">Escolha o paciente primeiro</option>'; return; }

    const { data: patAvail } = await db.from('patient_availability').select('weekday, start_time').eq('patient_id', patientId);

    const compatible = internsList.filter(intern => {
      const availForIntern = (allInternAvail || []).filter(a => a.intern_id === intern.id);
      const enabledAvail = availForIntern.filter(a => (clinicSlots || []).some(c => c.weekday === a.weekday && c.start_time.slice(0, 5) === a.start_time.slice(0, 5)));
      if (enabledAvail.length === 0) return false;
      if (patAvail && patAvail.length > 0) {
        return enabledAvail.some(a => patAvail.some(p => p.weekday === a.weekday && p.start_time.slice(0, 5) === a.start_time.slice(0, 5)));
      }
      return true;
    });

    if (compatible.length === 0) {
      fIntern.innerHTML = '<option value="">Nenhum estagiário compatível</option>';
      fIntern.disabled = true;
      return;
    }

    fIntern.innerHTML = '<option value="">Selecione...</option>' + compatible.map(i => `<option value="${i.id}">${escapeHtml(i.full_name)}</option>`).join('');
    fIntern.disabled = false;

    if (pendingQuickSchedule && compatible.some(i => i.id === pendingQuickSchedule.internId)) {
      fIntern.value = pendingQuickSchedule.internId;
      await updateSlotOptions();
    }
  }

  async function updateSlotOptions() {
    const patientId = fPatient.value;
    const internId = fIntern.value;
    fSlot.innerHTML = '<option value="">Selecione...</option>';
    confirmBtn.disabled = true;
    previewText.textContent = 'Preencha os campos acima.';

    if (!patientId || !internId) { fSlot.disabled = true; return; }

    const { data: patAvail } = await db.from('patient_availability').select('weekday, start_time').eq('patient_id', patientId);
    const internAvail = (allInternAvail || []).filter(a => a.intern_id === internId);

    const candidates = (clinicSlots || []).filter(c => {
      const internMatch = internAvail.some(a => a.weekday === c.weekday && a.start_time.slice(0, 5) === c.start_time.slice(0, 5));
      if (!internMatch) return false;
      if (patAvail && patAvail.length > 0) {
        return patAvail.some(p => p.weekday === c.weekday && p.start_time.slice(0, 5) === c.start_time.slice(0, 5));
      }
      return true;
    }).sort((a, b) => a.weekday - b.weekday || a.start_time.localeCompare(b.start_time));

    if (candidates.length === 0) {
      fSlot.innerHTML = '<option value="">Nenhum horário compatível</option>';
      fSlot.disabled = true;
      return;
    }

    fSlot.innerHTML = '<option value="">Selecione...</option>' + candidates.map(c => {
      const dayLabel = WEEKDAYS.find(d => d.n === c.weekday).l;
      return `<option value="${c.weekday}|${c.start_time}|${c.end_time}">${dayLabel} ${c.start_time.slice(0,5)}–${c.end_time.slice(0,5)}</option>`;
    }).join('');
    fSlot.disabled = false;

    if (pendingQuickSchedule && pendingQuickSchedule.internId === internId) {
      const match = candidates.find(c => c.weekday === pendingQuickSchedule.weekday && c.start_time.slice(0, 5) === pendingQuickSchedule.startTime.slice(0, 5));
      if (match) fSlot.value = `${match.weekday}|${match.start_time}|${match.end_time}`;
    }
  }

  async function calculatePreview() {
    msg.style.display = 'none';
    confirmBtn.disabled = true;

    const patientId = fPatient.value;
    const internId = fIntern.value;
    const slotVal = fSlot.value;
    const startDateStr = fStartDate.value;
    const endDateStr = fEndDate.value;

    if (!patientId || !internId || !slotVal || !startDateStr || !endDateStr) {
      previewText.textContent = 'Preencha todos os campos para calcular a prévia.';
      return;
    }

    const [weekdayStr, startTime, endTime] = slotVal.split('|');
    const weekday = parseInt(weekdayStr);
    const start = new Date(startDateStr + 'T00:00:00');
    const end = new Date(endDateStr + 'T00:00:00');

    if (start > end) {
      msg.textContent = 'A data inicial não pode ser posterior à data final.';
      msg.className = 'message error'; msg.style.display = 'block';
      return;
    }

    let curr = new Date(start);
    while (curr.getDay() !== weekday) curr.setDate(curr.getDate() + 1);
    const generatedDates = [];
    while (curr <= end) { generatedDates.push(new Date(curr)); curr.setDate(curr.getDate() + 7); }

    if (generatedDates.length === 0) {
      previewText.textContent = 'Nenhuma data encontrada para este dia da semana no período.';
      return;
    }

    const dateStrings = generatedDates.map(toDateStr);
    const { data: conflicts } = await db.from('appointments')
      .select('appointment_date, intern_id, patient_id')
      .in('appointment_date', dateStrings)
      .eq('start_time', startTime)
      .eq('status', 'agendado');

    if (conflicts && conflicts.some(c => c.intern_id === internId || c.patient_id === patientId)) {
      msg.textContent = 'Conflito: o estagiário ou o paciente já possuem atendimento em pelo menos uma dessas datas/horário.';
      msg.className = 'message error'; msg.style.display = 'block';
      return;
    }

    previewText.innerHTML = `Serão gerados <strong>${generatedDates.length} atendimentos semanais</strong>
      (${startTime.slice(0,5)}–${endTime.slice(0,5)}).<br>
      <small>Primeira sessão: ${generatedDates[0].toLocaleDateString('pt-BR')} · Última sessão: ${generatedDates[generatedDates.length-1].toLocaleDateString('pt-BR')}</small>`;
    confirmBtn.disabled = false;

    confirmBtn.onclick = async () => {
      confirmBtn.disabled = true; confirmBtn.textContent = 'Criando...';

      const { data: series, error: seriesErr } = await db.from('appointment_series').insert([{
        patient_id: patientId, intern_id: internId, weekday, start_time: startTime, end_time: endTime,
        series_start: startDateStr, series_end: endDateStr, status: 'ativa', created_by: currentProfile.id
      }]).select().single();

      if (seriesErr) {
        msg.textContent = 'Erro ao criar agendamento: ' + seriesErr.message;
        msg.className = 'message error'; msg.style.display = 'block';
        confirmBtn.disabled = false; confirmBtn.textContent = 'Validar e criar atendimentos';
        return;
      }

      const newAppts = generatedDates.map(d => ({
        series_id: series.id, patient_id: patientId, intern_id: internId,
        appointment_date: toDateStr(d), start_time: startTime, end_time: endTime
      }));

      const { error: apptsErr } = await db.from('appointments').insert(newAppts);
      if (apptsErr) {
        msg.textContent = 'Erro ao gerar atendimentos: ' + apptsErr.message;
        msg.className = 'message error'; msg.style.display = 'block';
        confirmBtn.disabled = false; confirmBtn.textContent = 'Validar e criar atendimentos';
        return;
      }

      pendingQuickSchedule = null;
      panel.style.display = 'none';
      await loadAppointments();
      confirmBtn.disabled = false; confirmBtn.textContent = 'Validar e criar atendimentos';
    };
  }

  fPatient.addEventListener('change', updateInternOptions);
  fIntern.addEventListener('change', updateSlotOptions);
  [fSlot, fStartDate, fEndDate].forEach(el => el.addEventListener('change', calculatePreview));

  document.getElementById('newApptBtn').addEventListener('click', async () => {
    resetApptForm();
    panel.style.display = 'block';
    panel.scrollIntoView({ behavior: 'smooth' });
    if (pendingQuickSchedule) {
      // Paciente ainda precisa ser escolhido manualmente; estagiário e horário
      // serão pré-marcados assim que o paciente for selecionado.
      msg.textContent = 'Selecione o paciente para concluir o agendamento rápido a partir da Grade Geral.';
      msg.className = 'message success'; msg.style.display = 'block';
    }
  });
  document.getElementById('cancelApptBtn').addEventListener('click', () => { pendingQuickSchedule = null; panel.style.display = 'none'; });

  await loadAppointments();
}

// ---------------------------------------------------------------------------
// INICIALIZAÇÃO
// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------
// REDEFINIÇÃO DE SENHA (link enviado por e-mail)
// ---------------------------------------------------------------------------
const newPasswordScreen = document.getElementById('newPasswordScreen');
const newPasswordForm = document.getElementById('newPasswordForm');
const newPasswordButton = document.getElementById('newPasswordButton');
const newPasswordMessage = document.getElementById('newPasswordMessage');
let inPasswordRecovery = window.location.hash.includes('type=recovery');

db.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') {
    inPasswordRecovery = true;
    loadingScreen.style.display = 'none';
    loginScreen.style.display = 'none';
    app.style.display = 'none';
    newPasswordScreen.style.display = 'flex';
  }
});

newPasswordForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  const p1 = document.getElementById('newPassword1').value;
  const p2 = document.getElementById('newPassword2').value;
  newPasswordMessage.className = 'message';

  if (p1 !== p2) {
    newPasswordMessage.textContent = 'As senhas não coincidem.';
    newPasswordMessage.className = 'message error';
    return;
  }

  newPasswordButton.disabled = true; newPasswordButton.textContent = 'Salvando...';
  const { error } = await db.auth.updateUser({ password: p1 });
  newPasswordButton.disabled = false; newPasswordButton.textContent = 'Salvar nova senha';

  if (error) {
    newPasswordMessage.textContent = 'Erro ao salvar: ' + error.message;
    newPasswordMessage.className = 'message error';
    return;
  }

  inPasswordRecovery = false;
  await db.auth.signOut();
  newPasswordScreen.style.display = 'none';
  loginScreen.style.display = 'flex';
  loginForm.style.display = 'block';
  forgotPasswordForm.style.display = 'none';
  newPasswordForm.reset();
  showMessage('Senha alterada com sucesso. Entre com sua nova senha.', 'success');
});

// ---------------------------------------------------------------------------
// INICIALIZAÇÃO
// ---------------------------------------------------------------------------
(async function init() {
  if (inPasswordRecovery) {
    loadingScreen.style.display = 'none';
    newPasswordScreen.style.display = 'flex';
    return;
  }
  const { data: { session } } = await db.auth.getSession();
  if (inPasswordRecovery) return;
  if (session?.user) {
    try {
      await loadProfile(session.user);
    } catch (e) {
      await db.auth.signOut();
      loadingScreen.style.display = 'none';
      loginScreen.style.display = 'flex';
      showMessage(e.message || 'Erro ao carregar perfil.');
    }
  } else {
    loadingScreen.style.display = 'none';
    loginScreen.style.display = 'flex';
  }
})();
</script>
