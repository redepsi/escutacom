<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Projeto Escuta Comunitária">
<title>Projeto Escuta Comunitária</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:min(420px,100%);background:#fff;border:1px solid #e5e9ef;border-radius:16px;padding:34px;box-shadow:0 12px 35px rgba(23,32,51,.07)}
.brand{text-align:center;margin-bottom:28px}.brand h1{margin:0;color:#315c8c;font-size:25px}.brand p{color:#667085;font-size:13px;margin:8px 0 0}
.field{margin-bottom:16px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #d5dbe4;border-radius:9px;font-size:14px;outline:none}.field input:focus{border-color:#315c8c}
.btn{width:100%;border:0;background:#315c8c;color:#fff;padding:12px 14px;border-radius:9px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.6;cursor:not-allowed}
.message{display:none;margin-top:14px;padding:11px 12px;border-radius:8px;font-size:13px}.message.error{display:block;background:#fdecec;color:#b42318}.message.success{display:block;background:#e8f5ee;color:#2f855a}
.app{display:none;min-height:100vh}.side{width:240px;background:#fff;border-right:1px solid #e5e9ef;padding:24px 14px}.logo{font-weight:800;font-size:18px;margin:0 12px 28px}.logo span{color:#315c8c}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;border-radius:9px;margin:4px 0;color:#475467;font-size:14px;cursor:pointer}.nav button.active{background:#e8f0f8;color:#315c8c;font-weight:700}
.main{flex:1;padding:28px 36px;max-width:1550px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:26px}.profile{display:flex;align-items:center;gap:10px}.profile select,.context-select{padding:10px 14px;border:1px solid #d5dbe4;border-radius:9px;background:#fff;font-weight:700}.user{background:#fff;border:1px solid #e5e9ef;padding:10px 14px;border-radius:9px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.card,.panel,.hero{background:#fff;border:1px solid #e5e9ef;border-radius:12px}.card{padding:18px}.card small{color:#667085}.card strong{display:block;font-size:26px;margin-top:8px}.panel{padding:20px;margin-bottom:20px}.panel h2{font-size:17px;margin:0 0 16px}.hero{padding:22px;margin-bottom:20px}.hero h2{margin:0 0 6px}.hero p{margin:0;color:#667085}.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}.toolbar .right{margin-left:auto;display:flex;gap:8px}.action{border:0;background:#315c8c;color:#fff;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer}.secondary{background:#fff;color:#315c8c;border:1px solid #cbd6e2}.notice{padding:12px 14px;border-radius:8px;background:#fff5d8;color:#6b4b00;font-size:13px;margin-bottom:14px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.green{background:#e8f5ee;color:#2f855a}.yellow{background:#fff5d8;color:#9a6700}.red{background:#fdecec;color:#b42318}.gray{background:#f1f3f6;color:#667085}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid #e9edf2;font-size:13px}th{font-size:11px;color:#667085;background:#fafbfc}.hidden{display:none}
@media(max-width:850px){.side{display:none}.main{padding:20px}.cards{grid-template-columns:repeat(2,1fr)}}
</style>

<style>
.availability-table th,.availability-table td{min-width:145px}
.slot{padding:10px;border-radius:10px;text-align:center;font-size:13px}
.slot.free{background:#f3f4f6;color:#6b7280}
.slot.selected{background:#e6f4ea;color:#176b36;font-weight:700}
.slot.blocked{background:#f9e6e6;color:#9b2c2c;font-weight:700;cursor:not-allowed}
.slot.selectable{display:block;cursor:pointer}
.slot.selectable input{display:none}
.slot.selectable.selected{outline:2px solid #2f855a}
.subtle{font-size:13px;color:#6b7280;margin-top:4px}
</style>

<style>
.coordinator-simple-menu{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:12px;margin-bottom:18px}
.coordinator-simple-menu .menu-card{padding:16px;border:1px solid #e5e7eb;border-radius:14px;background:#fff;cursor:pointer}
.coordinator-simple-menu .menu-card strong{display:block;margin-top:6px}
.coordinator-simple-menu .menu-card span{font-size:12px;color:#6b7280}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="brand">
      <h1>Projeto Escuta Comunitária</h1>
      <p>Gestão de atendimentos psicológicos</p>
    </div>
    <form id="loginForm">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button id="loginButton" class="btn" type="submit">Entrar</button>
      <div id="loginMessage" class="message"></div>
    </form>
  </div>
</div>

<div id="app" class="app">
  <aside class="side">
    <div class="logo">Projeto <span>Escuta Comunitária</span></div>
    <nav id="nav" class="nav"></nav>
  </aside>
  <main class="main">
    <div class="top">
      <div>
        <h1 id="title">Dashboard</h1>
        <div style="font-size:12px;color:#667085;margin-top:5px">Projeto Escuta Comunitária</div>
      </div>
      <div class="profile">
        <div class="user" id="userName">Carregando...</div>
        <select id="contextSelect" class="context-select" aria-label="Visualizar como">
          <option value="coordenacao">Coordenação da agenda</option>
          <option value="estagiario">Meu perfil de estagiário</option>
        </select>
        <button id="logoutButton" class="action secondary">Sair</button>
      </div>
    </div>
    <div id="content"></div>
  </main>
</div>

<script>
const SUPABASE_URL = 'https://olovwleelrdxxiyxzgyh.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_WuvgwZg-HkrE09TNSimK_A_d5vc1jrw';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const loginScreen = document.getElementById('loginScreen');
const app = document.getElementById('app');
const loginForm = document.getElementById('loginForm');
const loginButton = document.getElementById('loginButton');
const loginMessage = document.getElementById('loginMessage');
const logoutButton = document.getElementById('logoutButton');
const contextSelect = document.getElementById('contextSelect');
const userName = document.getElementById('userName');
const content = document.getElementById('content');
const nav = document.getElementById('nav');
const title = document.getElementById('title');

let currentProfile = null;
let currentIntern = null;
let currentPage = 'dashboard';
let currentContext = 'coordenacao';

const internListPage = async () => {
  content.innerHTML = `
    <section class="panel">
      <div class="toolbar"><h2>Estagiários</h2>
        <div class="right"><button id="newInternBtn" class="action">+ Novo estagiário</button></div>
      </div>
      <div id="internLoading" class="notice">Carregando estagiários do Supabase...</div>
      <div id="internTableWrap"></div>
    </section>
    <section id="internFormPanel" class="panel hidden">
      <div class="toolbar"><h2 id="internFormTitle">Novo estagiário</h2></div>
      <div class="formgrid">
        <div class="field"><label>Nome</label><input id="newInternName" placeholder="Nome completo"></div>
        <div class="field"><label>Matrícula</label><input id="newInternRegistration" placeholder="Matrícula"></div>
        <div class="field"><label>WhatsApp</label><input id="newInternWhatsapp" placeholder="(85) 99999-9999"></div>
        <div class="field"><label>Período / semestre</label><input id="newInternSemester" type="number" min="1" max="20" placeholder="8"></div>
        <div class="field"><label>Abordagens de preferência</label><input id="newInternApproaches" placeholder="Opcional"></div>
        <div class="field"><label>Público de preferência</label><input id="newInternAudience" placeholder="Opcional"></div>
        <div class="field"><label>Status</label><select id="newInternStatus"><option value="ativo">Ativo</option><option value="inativo">Inativo</option></select></div>
      </div>
      <div style="margin-top:14px"><button id="saveInternBtn" class="action">Salvar</button> <button id="cancelInternBtn" class="action secondary">Cancelar</button></div>
      <div id="internFormMessage" class="message"></div>
    </section>`;

  const loading = document.getElementById('internLoading');
  const wrap = document.getElementById('internTableWrap');

  const { data, error } = await db.from('interns')
    .select('id, full_name, registration_number, whatsapp, current_semester, preferred_approaches, preferred_audience, status, user_id')
    .order('full_name');

  if (error) {
    loading.className='message error'; loading.style.display='block';
    loading.textContent='Não foi possível carregar os estagiários: '+error.message; return;
  }
  loading.remove();

  const rows=(data||[]).map(i=>{
    const phone=(i.whatsapp||'').replace(/\D/g,'');
    const wa=phone ? `<a href="https://wa.me/55${phone}" target="_blank" rel="noopener" style="color:#2f855a;font-weight:700;text-decoration:none">📱 ${escapeHtml(i.whatsapp)}</a>` : '—';
    const status=i.status==='ativo'?'<span class="badge green">Ativo</span>':'<span class="badge red">Inativo</span>';
    const access=i.user_id?'<span class="badge green">Conta vinculada</span>':'<span class="badge yellow">Sem acesso</span>';
    return `<tr><td><strong>${escapeHtml(i.full_name)}</strong></td><td>${escapeHtml(i.registration_number)}</td><td>${i.current_semester}º semestre</td><td>${wa}</td><td>${escapeHtml(i.preferred_approaches||'—')}</td><td>${escapeHtml(i.preferred_audience||'—')}</td><td>${access}</td><td>${status}</td><td><button class="action secondary edit-intern" data-id="${i.id}" style="padding:7px 10px">Editar</button></td></tr>`;
  }).join('');

  wrap.innerHTML=`<div style="overflow:auto"><table><tr><th>Nome</th><th>Matrícula</th><th>Período</th><th>WhatsApp</th><th>Abordagens</th><th>Público</th><th>Acesso</th><th>Status</th><th>Ações</th></tr>${rows||'<tr><td colspan="9">Nenhum estagiário cadastrado.</td></tr>'}</table></div>`;

  const panel=document.getElementById('internFormPanel'), titleForm=document.getElementById('internFormTitle');
  let editingId=null;
  const reset=()=>{editingId=null;titleForm.textContent='Novo estagiário';['Name','Registration','Whatsapp','Semester','Approaches','Audience'].forEach(x=>{const e=document.getElementById('newIntern'+x);if(e)e.value=''});document.getElementById('newInternStatus').value='ativo';document.getElementById('internFormMessage').style.display='none'};

  document.getElementById('newInternBtn').onclick=()=>{reset();panel.classList.remove('hidden');panel.scrollIntoView({behavior:'smooth'})};
  document.getElementById('cancelInternBtn').onclick=()=>{panel.classList.add('hidden');reset()};

  wrap.querySelectorAll('.edit-intern').forEach(btn=>btn.onclick=()=>{
    const i=(data||[]).find(x=>x.id===btn.dataset.id); if(!i)return;
    editingId=i.id; titleForm.textContent='Editar estagiário';
    document.getElementById('newInternName').value=i.full_name||'';
    document.getElementById('newInternRegistration').value=i.registration_number||'';
    document.getElementById('newInternWhatsapp').value=i.whatsapp||'';
    document.getElementById('newInternSemester').value=i.current_semester||'';
    document.getElementById('newInternApproaches').value=i.preferred_approaches||'';
    document.getElementById('newInternAudience').value=i.preferred_audience||'';
    document.getElementById('newInternStatus').value=i.status||'ativo';
    panel.classList.remove('hidden'); panel.scrollIntoView({behavior:'smooth'});
  });

  document.getElementById('saveInternBtn').onclick=async()=>{
    const btn=document.getElementById('saveInternBtn'),msg=document.getElementById('internFormMessage');btn.disabled=true;msg.style.display='none';
    const payload={
      full_name:document.getElementById('newInternName').value.trim(),
      registration_number:document.getElementById('newInternRegistration').value.trim(),
      whatsapp:document.getElementById('newInternWhatsapp').value.trim(),
      current_semester:Number(document.getElementById('newInternSemester').value),
      preferred_approaches:document.getElementById('newInternApproaches').value.trim()||null,
      preferred_audience:document.getElementById('newInternAudience').value.trim()||null,
      status:document.getElementById('newInternStatus').value
    };
    if(!payload.full_name||!payload.registration_number||!payload.whatsapp||!payload.current_semester){
      msg.textContent='Preencha nome, matrícula, WhatsApp e semestre.';msg.className='message error';msg.style.display='block';btn.disabled=false;return;
    }
    const result=editingId?await db.from('interns').update(payload).eq('id',editingId):await db.from('interns').insert(payload);
    if(result.error){msg.textContent='Não foi possível salvar: '+result.error.message;msg.className='message error';msg.style.display='block';btn.disabled=false;return;}
    await internListPage();
  };
};

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

const registrationRequestsPage = async () => {
  content.innerHTML=`<section class="panel"><div class="toolbar"><h2>Solicitações de cadastro</h2></div><div class="notice">Ao autorizar, o sistema cria a conta do estagiário e envia um convite por e-mail. A operação é executada com segurança pela Edge Function do Supabase.</div><div id="reqLoading" class="notice">Carregando solicitações...</div><div id="reqWrap"></div></section>`;
  const loading=document.getElementById('reqLoading'),wrap=document.getElementById('reqWrap');
  const {data,error}=await db.from('intern_registration_requests').select('id,full_name,registration_number,whatsapp,semester,email,status,created_at').order('created_at',{ascending:false});
  if(error){loading.className='message error';loading.style.display='block';loading.textContent='Erro: '+error.message;return;}
  loading.remove();
  const rows=(data||[]).map(r=>{
    const badge=r.status==='pendente'?'<span class="badge yellow">Pendente</span>':r.status==='autorizado'?'<span class="badge green">Autorizado</span>':r.status==='recusado'?'<span class="badge red">Recusado</span>':'<span class="badge gray">Correção solicitada</span>';
    const actions=r.status==='pendente'?`<button class="action authorize-request" data-id="${r.id}" style="padding:7px 10px">Autorizar</button>`:'—';
    return `<tr><td><strong>${escapeHtml(r.full_name)}</strong></td><td>${escapeHtml(r.registration_number)}</td><td>${r.semester}º</td><td>${escapeHtml(r.whatsapp)}</td><td>${escapeHtml(r.email)}</td><td>${badge}</td><td>${actions}</td></tr>`;
  }).join('');
  wrap.innerHTML=`<div style="overflow:auto"><table><tr><th>Nome</th><th>Matrícula</th><th>Sem.</th><th>WhatsApp</th><th>E-mail</th><th>Status</th><th>Ações</th></tr>${rows||'<tr><td colspan="7">Nenhuma solicitação encontrada.</td></tr>'}</table></div>`;
  wrap.querySelectorAll('.authorize-request').forEach(btn=>btn.onclick=async()=>{
    if(!confirm('Autorizar este estagiário e criar a conta de acesso?')) return;

    btn.disabled = true;
    btn.textContent = 'Autorizando...';

    const { data, error } = await db.functions.invoke('autorizar-estagiario', {
      body: { request_id: btn.dataset.id }
    });

    if(error){
      let detail = error.message || 'Não foi possível autorizar.';
      try {
        const body = await error.context?.json?.();
        if(body?.error) detail = body.error;
      } catch (_) {}
      alert('Não foi possível autorizar: ' + detail);
      btn.disabled = false;
      btn.textContent = 'Autorizar';
      return;
    }

    if(data?.warning){
      alert(data.warning);
    } else {
      alert(data?.message || 'Estagiário autorizado com sucesso. Um convite de acesso foi enviado por e-mail.');
    }

    await registrationRequestsPage();
  });
};


const availabilityPage = async () => {
  const isIntern = currentContext === 'estagiario';
  const internId = currentIntern?.id;

  if (isIntern && !internId) {
    content.innerHTML = `<section class="panel"><div class="message error" style="display:block">Seu perfil de estagiário ainda não está vinculado a um cadastro de estagiário.</div></section>`;
    return;
  }

  content.innerHTML = `
    <section class="panel">
      <div class="toolbar">
        <div>
          <h2>${isIntern ? 'Minha disponibilidade' : 'Disponibilidade dos estagiários'}</h2>
          <div class="subtle">${isIntern ? 'Marque os horários em que você pode atender. A coordenação controla quais horários estão liberados.' : 'Visualize a disponibilidade semanal cadastrada pelos estagiários.'}</div>
        </div>
        ${isIntern ? '<div class="right"><button id="saveAvailabilityBtn" class="action">Salvar disponibilidade</button></div>' : ''}
      </div>
      <div id="availabilityMessage" class="message"></div>
      <div id="availabilityLoading" class="notice">Carregando quadro de horários...</div>
      <div id="availabilityGrid"></div>
    </section>`;

  const loading = document.getElementById('availabilityLoading');
  const grid = document.getElementById('availabilityGrid');

  const { data: clinicSlots, error: clinicError } = await db
    .from('clinic_schedule_slots')
    .select('weekday,start_time,end_time,enabled')
    .order('weekday').order('start_time');

  if (clinicError) {
    loading.className='message error'; loading.style.display='block';
    loading.textContent='Não foi possível carregar o quadro de horários: '+clinicError.message;
    return;
  }

  const { data: blocks, error: blocksError } = await db
    .from('schedule_blocks')
    .select('id,weekday,start_time,end_time,reason')
    .order('weekday').order('start_time');

  if (blocksError) {
    loading.className='message error'; loading.style.display='block';
    loading.textContent='Não foi possível carregar os bloqueios: '+blocksError.message;
    return;
  }

  let availability = [];
  if (isIntern) {
    const { data, error } = await db
      .from('intern_availability')
      .select('weekday,start_time,end_time')
      .eq('intern_id', internId);

    if (error) {
      loading.className='message error'; loading.style.display='block';
      loading.textContent='Não foi possível carregar sua disponibilidade: '+error.message;
      return;
    }
    availability = data || [];
  }

  loading.remove();

  const days = [
    {n:1,l:'Segunda-feira'}, {n:2,l:'Terça-feira'},
    {n:3,l:'Quarta-feira'}, {n:4,l:'Quinta-feira'}, {n:5,l:'Sexta-feira'}
  ];

  const clinicSlotFor = (d,s,e) => (clinicSlots||[]).find(x =>
    Number(x.weekday)===d && x.start_time.slice(0,5)===s && x.end_time.slice(0,5)===e
  );

  const blockedFor = (d,s,e) => (blocks||[]).find(b =>
    Number(b.weekday)===d &&
    b.start_time.slice(0,5) <= s &&
    b.end_time.slice(0,5) >= e
  );

  const availableFor = (d,s,e) => availability.some(a =>
    Number(a.weekday)===d &&
    a.start_time.slice(0,5)===s &&
    a.end_time.slice(0,5)===e
  );

  const allSlots = [...new Map(
    (clinicSlots||[]).map(x => [`${x.start_time.slice(0,5)}-${x.end_time.slice(0,5)}`, {
      start:x.start_time.slice(0,5), end:x.end_time.slice(0,5)
    }])
  ).values()].sort((a,b)=>a.start.localeCompare(b.start));

  let table='<div style="overflow:auto"><table class="availability-table"><tr><th>Horário</th>';
  days.forEach(d=>table+=`<th>${d.l}</th>`);
  table+='</tr>';

  allSlots.forEach(slot=>{
    table+=`<tr><td><strong>${slot.start}–${slot.end}</strong></td>`;
    days.forEach(d=>{
      const clinic=clinicSlotFor(d.n,slot.start,slot.end);
      const block=blockedFor(d.n,slot.start,slot.end);
      const checked=availableFor(d.n,slot.start,slot.end);

      if(!clinic?.enabled) {
        table+=`<td><div class="slot outside">—</div></td>`;
      } else if(block) {
        table+=`<td><div class="slot blocked">🔒 Bloqueado</div></td>`;
      } else if(isIntern) {
        table+=`<td><label class="slot selectable ${checked?'selected':''}">
          <input type="checkbox" class="availability-check" data-day="${d.n}" data-start="${slot.start}" data-end="${slot.end}" ${checked?'checked':''}>
          <span>${checked?'✓ Disponível':'Livre'}</span>
        </label></td>`;
      } else {
        table+=`<td><div class="slot ${checked?'selected':'free'}">${checked?'✓ Disponível':'Livre'}</div></td>`;
      }
    });
    table+='</tr>';
  });

  table+='</table></div>';
  grid.innerHTML=table;

  if(isIntern) {
    document.querySelectorAll('.availability-check').forEach(cb=>{
      cb.addEventListener('change',()=>{
        cb.closest('.slot').classList.toggle('selected',cb.checked);
        cb.closest('.slot').querySelector('span').textContent=cb.checked?'✓ Disponível':'Livre';
      });
    });

    document.getElementById('saveAvailabilityBtn').onclick=async()=>{
      const btn=document.getElementById('saveAvailabilityBtn');
      const msg=document.getElementById('availabilityMessage');
      btn.disabled=true;

      const selected=[...document.querySelectorAll('.availability-check:checked')].map(cb=>({
        intern_id:internId,
        weekday:Number(cb.dataset.day),
        start_time:cb.dataset.start+':00',
        end_time:cb.dataset.end+':00'
      }));

      const {error:delError}=await db.from('intern_availability').delete().eq('intern_id',internId);
      if(delError){
        msg.textContent='Não foi possível salvar: '+delError.message;
        msg.className='message error'; msg.style.display='block';
        btn.disabled=false; return;
      }

      if(selected.length){
        const {error:insError}=await db.from('intern_availability').insert(selected);
        if(insError){
          msg.textContent='Não foi possível salvar a disponibilidade: '+insError.message;
          msg.className='message error'; msg.style.display='block';
          btn.disabled=false; return;
        }
      }

      msg.textContent='Disponibilidade salva com sucesso.';
      msg.className='message success'; msg.style.display='block';
      btn.disabled=false;
    };
  }
};

const availabilitySettingsPage = async () => {
  content.innerHTML=`
    <section class="panel">
      <div class="toolbar">
        <div>
          <h2>Configurações da clínica</h2>
          <div class="subtle">Você define, por dia, quais intervalos de 1 hora ficam liberados para atendimento.</div>
        </div>
        <button id="saveClinicSchedule" class="action">Salvar quadro</button>
      </div>
      <div class="notice">
        Cada intervalo representa <strong>50 minutos de atendimento + 10 minutos de folga</strong>.
        Horários desligados não aparecem como opção para os estagiários.
      </div>
      <div id="clinicScheduleMessage" class="message"></div>
      <div id="clinicScheduleLoading" class="notice">Carregando quadro...</div>
      <div id="clinicScheduleGrid"></div>
    </section>

    <section class="panel">
      <div class="toolbar">
        <div>
          <h2>Bloqueios específicos</h2>
          <div class="subtle">Use quando um intervalo normalmente liberado precisar ficar indisponível.</div>
        </div>
        <button id="newBlock" class="action">+ Bloquear horário</button>
      </div>
      <div id="blocksList">Carregando...</div>
    </section>`;

  const loading=document.getElementById('clinicScheduleLoading');
  const grid=document.getElementById('clinicScheduleGrid');

  const {data:slots,error}=await db.from('clinic_schedule_slots')
    .select('id,weekday,start_time,end_time,enabled')
    .order('weekday').order('start_time');

  if(error){
    loading.className='message error'; loading.style.display='block';
    loading.textContent='Não foi possível carregar o quadro: '+error.message;
    return;
  }

  loading.remove();

  const days=[
    {n:1,l:'Segunda-feira'},{n:2,l:'Terça-feira'},
    {n:3,l:'Quarta-feira'},{n:4,l:'Quinta-feira'},{n:5,l:'Sexta-feira'}
  ];

  const uniqueSlots=[...new Map((slots||[]).map(s=>[
    `${s.start_time.slice(0,5)}-${s.end_time.slice(0,5)}`,
    {start:s.start_time.slice(0,5),end:s.end_time.slice(0,5)}
  ])).values()].sort((a,b)=>a.start.localeCompare(b.start));

  let table='<div style="overflow:auto"><table class="availability-table"><tr><th>Horário</th>';
  days.forEach(d=>table+=`<th>${d.l}</th>`);
  table+='</tr>';

  uniqueSlots.forEach(slot=>{
    table+=`<tr><td><strong>${slot.start}–${slot.end}</strong></td>`;
    days.forEach(d=>{
      const found=(slots||[]).find(s=>Number(s.weekday)===d.n && s.start_time.slice(0,5)===slot.start && s.end_time.slice(0,5)===slot.end);
      const enabled=!!found?.enabled;
      table+=`<td><label class="slot selectable clinic-slot ${enabled?'selected':''}">
        <input type="checkbox" data-slot-id="${found?.id||''}" data-day="${d.n}" data-start="${slot.start}" data-end="${slot.end}" ${enabled?'checked':''}>
        <span>${enabled?'🟢 Liberado':'⚪ Fechado'}</span>
      </label></td>`;
    });
    table+='</tr>';
  });

  table+='</table></div>';
  grid.innerHTML=table;

  document.querySelectorAll('.clinic-slot input').forEach(cb=>{
    cb.addEventListener('change',()=>{
      cb.closest('.slot').classList.toggle('selected',cb.checked);
      cb.closest('.slot').querySelector('span').textContent=cb.checked?'🟢 Liberado':'⚪ Fechado';
    });
  });

  document.getElementById('saveClinicSchedule').onclick=async()=>{
    const btn=document.getElementById('saveClinicSchedule');
    const msg=document.getElementById('clinicScheduleMessage');
    btn.disabled=true;

    const updates=[...document.querySelectorAll('.clinic-slot input')].map(cb=>({
      id:cb.dataset.slotId,
      enabled:cb.checked
    }));

    for(const item of updates){
      const {error}=await db.from('clinic_schedule_slots').update({
        enabled:item.enabled,
        updated_by:currentProfile.id,
        updated_at:new Date().toISOString()
      }).eq('id',item.id);

      if(error){
        msg.textContent='Não foi possível salvar o quadro: '+error.message;
        msg.className='message error'; msg.style.display='block';
        btn.disabled=false; return;
      }
    }

    msg.textContent='Configurações salvo com sucesso.';
    msg.className='message success'; msg.style.display='block';
    btn.disabled=false;
  };

  const loadBlocks=async()=>{
    const wrap=document.getElementById('blocksList');
    const {data,error}=await db.from('schedule_blocks')
      .select('id,weekday,start_time,end_time,reason')
      .order('weekday').order('start_time');

    if(error){wrap.innerHTML=`<div class="message error">${escapeHtml(error.message)}</div>`;return;}

    const names=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];

    wrap.innerHTML=`<div style="overflow:auto"><table>
      <tr><th>Dia</th><th>Horário</th><th>Motivo</th><th></th></tr>
      ${(data||[]).map(b=>`<tr>
        <td>${names[b.weekday]}</td>
        <td>${b.start_time.slice(0,5)}–${b.end_time.slice(0,5)}</td>
        <td>${escapeHtml(b.reason||'—')}</td>
        <td><button class="action secondary delete-block" data-id="${b.id}" style="padding:6px 10px">Excluir</button></td>
      </tr>`).join('')||'<tr><td colspan="4">Nenhum bloqueio cadastrado.</td></tr>'}
    </table></div>`;

    wrap.querySelectorAll('.delete-block').forEach(btn=>btn.onclick=async()=>{
      if(!confirm('Excluir este bloqueio?'))return;
      const {error}=await db.from('schedule_blocks').delete().eq('id',btn.dataset.id);
      if(error)alert('Não foi possível excluir: '+error.message);
      else loadBlocks();
    });
  };

  await loadBlocks();

  document.getElementById('newBlock').onclick=async()=>{
    const day=prompt('Dia da semana: 1=segunda, 2=terça, 3=quarta, 4=quinta, 5=sexta','1');
    if(day===null)return;
    const start=prompt('Horário inicial (ex.: 13:00)','13:00');
    if(start===null)return;
    const end=prompt('Horário final (ex.: 14:00)','14:00');
    if(end===null)return;
    const reason=prompt('Motivo do bloqueio (opcional)','');

    const {error}=await db.from('schedule_blocks').insert({
      weekday:Number(day),
      start_time:start+':00',
      end_time:end+':00',
      reason:reason||null,
      created_by:currentProfile.id
    });

    if(error)alert('Não foi possível criar o bloqueio: '+error.message);
    else loadBlocks();
  };
};

const coordinatorPages = {
  dashboard: `
    <div class="cards">
      <div class="card"><small>Atendimentos hoje</small><strong>12</strong></div>
      <div class="card"><small>Confirmados</small><strong>8</strong></div>
      <div class="card"><small>Aguardando confirmação</small><strong>2</strong></div>
      <div class="card"><small>Não confirmados</small><strong>2</strong></div>
    </div>
    <section class="panel">
      <div class="toolbar"><h2>Período acadêmico</h2><div class="right"><span class="badge green">2026.2 ativo</span><button class="action secondary">Iniciar 2027.1</button></div></div>
      <p style="font-size:13px;color:#667085;margin:0">O sistema calcula a progressão dos semestres e apresenta as mudanças para uma única confirmação da coordenação.</p>
    </section>

      <table>
        <tr><th>Horário</th><th>Paciente</th><th>Estagiário</th><th>Confirmação</th><th>Status</th></tr>
        <tr><td>14:00</td><td>#00342</td><td>Ana Beatriz</td><td><span class="badge green">Confirmado</span></td><td>Agendado</td></tr>
        <tr><td>15:00</td><td>#00501</td><td>João Pedro</td><td><span class="badge yellow">Aguardando</span></td><td>Agendado</td></tr>
      </table>
    </section>
  `,
  estagiarios: `<section class="panel"><h2>Estagiários</h2><p>Carregando...</p></section>`,
  pacientes: `
    <section class="panel">
      <div class="toolbar"><h2>Pacientes</h2><button class="action" style="margin-left:auto">+ Novo paciente</button></div>
      <p style="font-size:13px;color:#667085">Cadastro com inscrição, idade, gênero, nome opcional e disponibilidade opcional.</p>
    </section>
  `,
  agenda: `
    <section class="panel"><h2>Agenda</h2><p style="font-size:13px;color:#667085">Calendário integrado aos agendamentos reais será conectado na próxima etapa.</p></section>
  `,
  relatorio: `
    <section class="hero"><h2>Relatórios</h2><p>Selecione um estagiário para visualizar horas, pacientes e atendimentos realizados.</p></section>
  `,
  regras_horario: `<section class="panel"><h2>Configurações</h2><p style="font-size:13px;color:#667085">Aqui ficarão o quadro de horários da clínica e as configurações gerais da agenda.</p></section>`
};

const internPages = {
  dashboard: `
    <section class="hero"><h2>Olá, ${'Dawton'}</h2><p>Você possui acesso de estagiário e de coordenador da agenda.</p></section>
    <section class="panel"><h2>Meus próximos atendimentos</h2><div class="notice">As confirmações e os atendimentos serão carregados do banco nesta etapa.</div></section>
  `,
  disponibilidade: `
    <section class="panel"><h2>Minha disponibilidade</h2><p style="font-size:13px;color:#667085">Aqui você poderá marcar sua disponibilidade semanal e bloquear horários específicos.</p></section>
  `,
  meus: `
    <section class="panel"><h2>Meus agendamentos</h2><p style="font-size:13px;color:#667085">Aqui aparecerão seus atendimentos, confirmação e registro de presença/ausência.</p></section>
  `
};

function showMessage(text, type='error') {
  loginMessage.textContent = text;
  loginMessage.className = 'message ' + type;
}

async function loadProfile(user) {
  const { data: profile, error: profileError } = await db
    .from('profiles')
    .select('id, full_name, role')
    .eq('id', user.id)
    .single();

  if (profileError) {
    throw new Error('Sua conta entrou, mas o perfil do sistema não foi encontrado.');
  }

  currentProfile = profile;

  const { data: intern } = await db
    .from('interns')
    .select('id, full_name, registration_number, current_semester, status, academic_period_id')
    .eq('user_id', user.id)
    .maybeSingle();

  currentIntern = intern;
  userName.textContent = `${profile.full_name} • ${profile.role === 'coordenador_agenda' ? 'Coordenação da agenda' : 'Estagiário'}`;

  const canCoordinate = profile.role === 'coordenador_agenda' || profile.role === 'coordenador_projeto';
  const canIntern = !!intern;

  contextSelect.style.display = (canCoordinate && canIntern) ? 'block' : 'none';
  currentContext = canCoordinate ? 'coordenacao' : 'estagiario';
  contextSelect.value = currentContext;
  currentPage = 'dashboard';
  updateContextNavigation();
  render();
  loginScreen.style.display = 'none';
  app.style.display = 'flex';
}

function updateContextNavigation() {
  const pages = currentContext === 'coordenacao' ? Object.keys(coordinatorPages) : Object.keys(internPages);
  buildNav(pages);
}

function buildNav(pages) {
  const labels = {
    dashboard:'Dashboard',
    agenda:'Agenda',
    estagiarios:'Estagiários',
    pacientes:'Pacientes',
    relatorio:'Relatórios',
    regras_horario:'Configurações',
    disponibilidade:'Minha disponibilidade',
    meus:'Meus agendamentos'
  };
  nav.innerHTML = pages.map(p => `<button data-page="${p}">${labels[p] || p}</button>`).join('');
  nav.querySelectorAll('button').forEach(button => {
    button.addEventListener('click', () => {
      currentPage = button.dataset.page;
      render();
    });
  });
}

function render() {
  if (currentPage === 'disponibilidade') {
    title.textContent = currentContext === 'estagiario' ? 'Minha disponibilidade' : 'Disponibilidade dos estagiários';
    nav.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.page === currentPage));
    availabilityPage();
    return;
  }
  if (currentContext === 'coordenacao' && currentPage === 'regras_horario') {
    title.textContent = 'Regras de horário';
    nav.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.page === currentPage));
    availabilitySettingsPage();
    return;
  }
  if (currentContext === 'coordenacao' && currentPage === 'estagiarios') {
    title.textContent = 'Estagiários';
    nav.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.page === currentPage));
    internListPage();
    return;
  }
  const pages = currentContext === 'coordenacao' ? coordinatorPages : internPages;
  content.innerHTML = pages[currentPage] || pages.dashboard;
  title.textContent = ({
    dashboard:'Dashboard',agenda:'Agenda',estagiarios:'Estagiários',
    pacientes:'Pacientes',agendamentos:'Agendamentos',relatorio:'Relatórios',
    solicitacoes:'Solicitações',disponibilidade:'Minha disponibilidade',
    regras_horario:'Configurações',meus:'Meus agendamentos'
  })[currentPage] || 'Dashboard';
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.page === currentPage));
}

loginForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  loginButton.disabled = true;
  loginButton.textContent = 'Entrando...';
  loginMessage.className = 'message';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const { data, error } = await db.auth.signInWithPassword({ email, password });

  if (error) {
    showMessage('Não foi possível entrar. Confira o e-mail e a senha.');
    loginButton.disabled = false;
    loginButton.textContent = 'Entrar';
    return;
  }

  try {
    await loadProfile(data.user);
  } catch (e) {
    await db.auth.signOut();
    showMessage(e.message || 'Não foi possível carregar seu perfil.');
  }

  loginButton.disabled = false;
  loginButton.textContent = 'Entrar';
});


contextSelect.addEventListener('change', () => {
  currentContext = contextSelect.value;
  currentPage = 'dashboard';
  updateContextNavigation();
  render();
  userName.textContent = currentContext === 'coordenacao'
    ? `${currentProfile.full_name} • Coordenação da agenda`
    : `${currentProfile.full_name} • Estagiário`;
});

logoutButton.addEventListener('click', async () => {
  await db.auth.signOut();
  app.style.display = 'none';
  loginScreen.style.display = 'flex';
  loginForm.reset();
  showMessage('Você saiu do sistema.', 'success');
});

db.auth.onAuthStateChange(async (_event, session) => {
  if (session?.user && !currentProfile) {
    try {
      await loadProfile(session.user);
    } catch (e) {
      await db.auth.signOut();
      showMessage(e.message || 'Não foi possível carregar seu perfil.');
    }
  }
});

(async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (session?.user) {
    try {
      await loadProfile(session.user);
    } catch (e) {
      await db.auth.signOut();
      showMessage(e.message || 'Não foi possível carregar seu perfil.');
    }
  }
})();
</script>
