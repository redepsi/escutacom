<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Projeto Escuta Comunitária">
<title>Projeto Escuta Comunitária</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:min(420px,100%);background:#fff;border:1px solid #e5e9ef;border-radius:16px;padding:34px;box-shadow:0 12px 35px rgba(23,32,51,.07)}
.brand{text-align:center;margin-bottom:28px}
.brand h1{margin:0;color:#315c8c;font-size:23px}
.brand p{color:#667085;font-size:13px;margin:8px 0 0}

.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
.field input,.field select{width:100%;padding:12px;border:1px solid #d5dbe4;border-radius:9px;font-size:14px;outline:none;background:#fff}
.field input:focus,.field select:focus{border-color:#315c8c}

.btn{width:100%;border:0;background:#315c8c;color:#fff;padding:12px 14px;border-radius:9px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6;cursor:not-allowed}

.message{display:none;margin-top:14px;padding:11px 12px;border-radius:8px;font-size:13px}
.message.error{display:block;background:#fdecec;color:#b42318}
.message.success{display:block;background:#e8f5ee;color:#2f855a}

.app{display:none;min-height:100vh}
.side{width:240px;background:#fff;border-right:1px solid #e5e9ef;padding:24px 14px;flex-shrink:0}
.logo{font-weight:800;font-size:17px;margin:0 12px 28px}
.logo span{color:#315c8c}
.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;border-radius:9px;margin:4px 0;color:#475467;font-size:14px;cursor:pointer}
.nav button.active{background:#e8f0f8;color:#315c8c;font-weight:700}

.main{flex:1;padding:28px 36px;max-width:1400px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.top h1{margin:0;font-size:24px}
.profile{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.context-select{padding:10px 14px;border:1px solid #d5dbe4;border-radius:9px;background:#fff;font-weight:700;cursor:pointer}
.user{background:#fff;border:1px solid #e5e9ef;padding:10px 14px;border-radius:9px;font-size:13px}
.action{border:0;background:#315c8c;color:#fff;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer}
.action.active{background:#315c8c;color:#fff}
.secondary{background:#fff;color:#315c8c;border:1px solid #cbd6e2}
.secondary.active{background:#315c8c;color:#fff;border-color:#315c8c}

.panel{background:#fff;border:1px solid #e5e9ef;border-radius:12px;padding:20px;margin-bottom:20px}
.panel h2{font-size:17px;margin:0 0 6px}
.muted{color:#667085;font-size:13px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.notice{padding:12px 14px;border-radius:8px;background:#fff5d8;color:#6b4b00;font-size:13px;margin-bottom:14px}

.schedule-grid{display:grid;grid-template-columns:90px repeat(6,1fr);border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;background:#fff;gap:1px;background-color:#e5e7eb}
.schedule-grid>div{background:#fff;padding:10px;min-height:56px;display:flex;align-items:center;justify-content:center;text-align:center}
.schedule-head{background:#f8fafc!important;font-weight:700}
.slot-btn{width:100%;height:100%;min-height:48px;font:inherit;font-weight:700;font-size:12px;text-align:center;cursor:pointer;border-radius:8px;border:1px solid transparent;transition:.1s}
.slot-btn:hover{filter:brightness(.96)}
.slot-open{background:#e9f7ef;color:#176b36;border-color:#bce3cc}
.slot-closed{background:#f3f4f6;color:#98a2b3;border-color:#e5e7eb}
.slot-future{background:#eef0fd;color:#4c4ee0;border-color:#c7caf5}
.slot-shut{background:#fafafa;color:#c3c9d3;border-color:#eeeeee}

.placeholder{padding:40px 20px;text-align:center;color:#98a2b3}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-box{background:#fff;border-radius:16px;padding:24px;width:min(480px,100%);max-height:90vh;overflow:auto}

#loadingScreen{display:flex;flex-direction:column;gap:12px}
.spinner{border:3px solid #f3f3f3;border-top:3px solid #315c8c;border-radius:50%;width:30px;height:30px;animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

.mobile-menu-btn{display:none;border:0;background:#315c8c;color:#fff;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:16px}
.side-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:99}
.side-backdrop.open{display:block}

@media(max-width:850px){
  .side{
    display:block;position:fixed;top:0;left:0;bottom:0;width:240px;
    transform:translateX(-100%);transition:transform .25s ease;z-index:100;
    box-shadow:2px 0 16px rgba(0,0,0,.2);overflow-y:auto
  }
  .side.open{transform:translateX(0)}
  .mobile-menu-btn{display:inline-block}
  .main{padding:20px}
  .schedule-grid{grid-template-columns:60px repeat(6,minmax(90px,1fr));font-size:11px}
}
</style>
</head>
<body>

<div id="loadingScreen" class="login-wrap">
  <div class="brand">
    <div class="spinner"></div>
    <p>Conectando ao sistema...</p>
  </div>
</div>

<div id="loginScreen" class="login-wrap" style="display:none">
  <div class="login-card">
    <div class="brand">
      <h1>Projeto Escuta Comunitária</h1>
      <p>Gestão de atendimentos psicológicos</p>
    </div>
    <form id="loginForm">
      <div class="field">
        <label for="email">E-mail (coordenação) ou matrícula (estagiário)</label>
        <input id="email" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button id="loginButton" class="btn" type="submit">Entrar</button>
      <div id="loginMessage" class="message"></div>
      <div style="text-align:center;margin-top:14px">
        <a href="#" id="forgotPasswordLink" style="font-size:13px;color:#315c8c">Esqueci minha senha</a>
      </div>
    </form>

    <form id="forgotPasswordForm" style="display:none">
      <div class="field">
        <label for="forgotIdentifier">E-mail (coordenação) ou matrícula (estagiário)</label>
        <input id="forgotIdentifier" type="text" autocomplete="username" required>
      </div>
      <button id="forgotPasswordButton" class="btn" type="submit">Enviar link de redefinição</button>
      <div id="forgotPasswordMessage" class="message"></div>
      <div style="text-align:center;margin-top:14px">
        <a href="#" id="backToLoginLink" style="font-size:13px;color:#315c8c">Voltar para o login</a>
      </div>
    </form>
  </div>
</div>

<div id="newPasswordScreen" class="login-wrap" style="display:none">
  <div class="login-card">
    <div class="brand">
      <h1>Definir nova senha</h1>
      <p>Escolha uma nova senha de acesso</p>
    </div>
    <form id="newPasswordForm">
      <div class="field">
        <label for="newPassword1">Nova senha</label>
        <input id="newPassword1" type="password" autocomplete="new-password" required minlength="6">
      </div>
      <div class="field">
        <label for="newPassword2">Confirmar nova senha</label>
        <input id="newPassword2" type="password" autocomplete="new-password" required minlength="6">
      </div>
      <button id="newPasswordButton" class="btn" type="submit">Salvar nova senha</button>
      <div id="newPasswordMessage" class="message"></div>
    </form>
  </div>
</div>

<div id="app" class="app" style="display:none">
  <div id="sideBackdrop" class="side-backdrop"></div>
  <aside class="side">
    <div class="logo">Escuta <span>Comunitária</span></div>
    <nav id="nav" class="nav"></nav>
  </aside>
  <main class="main">
    <div class="top">
      <div style="display:flex;align-items:center;gap:12px">
        <button id="mobileMenuBtn" class="mobile-menu-btn">☰</button>
        <h1 id="pageTitle">Início</h1>
      </div>
      <div class="profile">
        <div class="user" id="userName">Carregando...</div>
        <select id="contextSelect" class="context-select" style="display:none">
          <option value="coordenacao">Coordenação</option>
          <option value="estagiario">Meu perfil de estagiário</option>
        </select>
        <button id="changePasswordButton" class="action secondary">Alterar senha</button>
        <button id="logoutButton" class="action secondary">Sair</button>
      </div>
    </div>
    <div id="content"></div>
  </main>
</div>

<div id="changePasswordModal" class="modal-overlay">
  <div class="modal-box">
    <h3 style="margin-top:0">Alterar minha senha</h3>
    <div class="field"><label>Nova senha</label><input id="cpNewPassword1" type="password" autocomplete="new-password" minlength="6"></div>
    <div class="field"><label>Confirmar nova senha</label><input id="cpNewPassword2" type="password" autocomplete="new-password" minlength="6"></div>
    <div id="changePasswordMsg" class="message"></div>
    <div style="display:flex;gap:10px;margin-top:10px">
      <button id="cpSaveBtn" class="action">Salvar nova senha</button>
      <button id="cpCloseBtn" class="action secondary">Cancelar</button>
    </div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// CONFIGURAÇÃO DO SUPABASE
// ---------------------------------------------------------------------------
const SUPABASE_URL = 'https://qphcrtpngwgsszhtuctf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yo7cUtMbnflkSERbocknig_ZwYXw-B6';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// ---------------------------------------------------------------------------
// ELEMENTOS DA TELA
// ---------------------------------------------------------------------------
const loadingScreen = document.getElementById('loadingScreen');
const loginScreen = document.getElementById('loginScreen');
const app = document.getElementById('app');
const loginForm = document.getElementById('loginForm');
const loginButton = document.getElementById('loginButton');
const loginMessage = document.getElementById('loginMessage');
const logoutButton = document.getElementById('logoutButton');
const contextSelect = document.getElementById('contextSelect');
const userName = document.getElementById('userName');
const content = document.getElementById('content');
const nav = document.getElementById('nav');
const pageTitle = document.getElementById('pageTitle');

// ---------------------------------------------------------------------------
// FECHAMENTO GENÉRICO DE POP-UPS (clicar fora, ou no X)
// Funciona em qualquer .modal-overlay existente hoje ou criado no futuro.
// ---------------------------------------------------------------------------
document.body.addEventListener('click', (e) => {
  if (e.target.classList && e.target.classList.contains('modal-overlay')) {
    e.target.style.display = 'none';
  }
});

function injectModalCloseButtons() {
  document.querySelectorAll('.modal-box').forEach(box => {
    if (box.querySelector('.modal-x-close')) return;
    const overlay = box.closest('.modal-overlay');
    if (!overlay) return;
    box.style.position = 'relative';
    const xBtn = document.createElement('button');
    xBtn.className = 'modal-x-close';
    xBtn.type = 'button';
    xBtn.innerHTML = '✕';
    xBtn.setAttribute('aria-label', 'Fechar');
    xBtn.style.cssText = 'position:absolute;top:14px;right:16px;border:0;background:none;font-size:18px;line-height:1;cursor:pointer;color:#98a2b3;padding:4px';
    xBtn.addEventListener('click', () => { overlay.style.display = 'none'; });
    box.insertBefore(xBtn, box.firstChild);
  });
}

new MutationObserver(() => injectModalCloseButtons()).observe(document.body, { childList: true, subtree: true });
// Cobre os pop-ups que já existem assim que a página carrega (ex.: alterar senha).
injectModalCloseButtons();

// ---------------------------------------------------------------------------
// ESTADO GLOBAL
// ---------------------------------------------------------------------------
let currentProfile = null;   // linha de profiles
let currentIntern = null;    // linha de interns, se existir para este usuário
let currentContext = 'coordenacao'; // 'coordenacao' ou 'estagiario'
let currentPage = 'inicio';

const WEEKDAYS = [
  { n: 1, l: 'Segunda' }, { n: 2, l: 'Terça' }, { n: 3, l: 'Quarta' },
  { n: 4, l: 'Quinta' }, { n: 5, l: 'Sexta' }, { n: 6, l: 'Sábado' }
];

// Usado só para salas, que agora também podem abrir aos domingos.
const ROOM_WEEKDAYS = [
  { n: 0, l: 'Domingo' }, { n: 1, l: 'Segunda' }, { n: 2, l: 'Terça' }, { n: 3, l: 'Quarta' },
  { n: 4, l: 'Quinta' }, { n: 5, l: 'Sexta' }, { n: 6, l: 'Sábado' }
];

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

function showMessage(text, type = 'error') {
  loginMessage.textContent = text;
  loginMessage.className = 'message ' + type;
}

// ---------------------------------------------------------------------------
// LOGIN / LOGOUT
// ---------------------------------------------------------------------------
loginForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  loginButton.disabled = true;
  loginButton.textContent = 'Entrando...';
  loginMessage.className = 'message';

  const identifier = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  let emailToUse = identifier;
  if (!identifier.includes('@')) {
    const { data: resolvedEmail, error: lookupError } = await db.rpc('get_email_by_registration', { p_registration: identifier });
    if (lookupError || !resolvedEmail) {
      showMessage('Matrícula não encontrada. Confira o número digitado.');
      loginButton.disabled = false;
      loginButton.textContent = 'Entrar';
      return;
    }
    emailToUse = resolvedEmail;
  }

  const { data, error } = await db.auth.signInWithPassword({ email: emailToUse, password });

  if (error) {
    showMessage('Erro ao entrar. Confira os dados e a senha.');
    loginButton.disabled = false;
    loginButton.textContent = 'Entrar';
    return;
  }

  try {
    await loadProfile(data.user);
  } catch (e) {
    await db.auth.signOut();
    showMessage(e.message || 'Erro ao carregar perfil.');
  }
  loginButton.disabled = false;
  loginButton.textContent = 'Entrar';
});

// ---------------------------------------------------------------------------
// ESQUECI MINHA SENHA (a partir da tela de login)
// ---------------------------------------------------------------------------
const forgotPasswordForm = document.getElementById('forgotPasswordForm');
const forgotPasswordButton = document.getElementById('forgotPasswordButton');
const forgotPasswordMessage = document.getElementById('forgotPasswordMessage');

document.getElementById('forgotPasswordLink').addEventListener('click', (e) => {
  e.preventDefault();
  loginForm.style.display = 'none';
  forgotPasswordForm.style.display = 'block';
  forgotPasswordMessage.style.display = 'none';
  document.getElementById('forgotIdentifier').value = document.getElementById('email').value;
});

document.getElementById('backToLoginLink').addEventListener('click', (e) => {
  e.preventDefault();
  forgotPasswordForm.style.display = 'none';
  loginForm.style.display = 'block';
});

forgotPasswordForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  forgotPasswordButton.disabled = true;
  forgotPasswordButton.textContent = 'Enviando...';
  forgotPasswordMessage.style.display = 'none';

  const identifier = document.getElementById('forgotIdentifier').value.trim();
  let emailToUse = identifier;

  if (!identifier.includes('@')) {
    const { data: resolvedEmail, error: lookupError } = await db.rpc('get_email_by_registration', { p_registration: identifier });
    if (lookupError || !resolvedEmail) {
      forgotPasswordMessage.textContent = 'Matrícula não encontrada. Confira o número digitado.';
      forgotPasswordMessage.className = 'message error'; forgotPasswordMessage.style.display = 'block';
      forgotPasswordButton.disabled = false;
      forgotPasswordButton.textContent = 'Enviar link de redefinição';
      return;
    }
    emailToUse = resolvedEmail;
  }

  const { error } = await db.auth.resetPasswordForEmail(emailToUse, {
    redirectTo: window.location.origin + window.location.pathname
  });

  forgotPasswordButton.disabled = false;
  forgotPasswordButton.textContent = 'Enviar link de redefinição';

  if (error) {
    forgotPasswordMessage.textContent = 'Erro ao enviar: ' + error.message;
    forgotPasswordMessage.className = 'message error';
  } else {
    forgotPasswordMessage.textContent = `Se o cadastro existir, um link foi enviado para ${emailToUse}. Confira sua caixa de entrada.`;
    forgotPasswordMessage.className = 'message success';
  }
  forgotPasswordMessage.style.display = 'block';
});

logoutButton.addEventListener('click', async () => {
  await db.auth.signOut();
  app.style.display = 'none';
  loadingScreen.style.display = 'none';
  loginScreen.style.display = 'flex';
  loginForm.style.display = 'block';
  forgotPasswordForm.style.display = 'none';
  loginForm.reset();
  showMessage('Você saiu do sistema.', 'success');
});

// ---------------------------------------------------------------------------
// ALTERAR MINHA SENHA (qualquer usuário logado)
// ---------------------------------------------------------------------------
const changePasswordModal = document.getElementById('changePasswordModal');
const changePasswordMsg = document.getElementById('changePasswordMsg');

document.getElementById('changePasswordButton').addEventListener('click', () => {
  document.getElementById('cpNewPassword1').value = '';
  document.getElementById('cpNewPassword2').value = '';
  changePasswordMsg.style.display = 'none';
  changePasswordModal.style.display = 'flex';
});

document.getElementById('cpCloseBtn').addEventListener('click', () => {
  changePasswordModal.style.display = 'none';
});

document.getElementById('cpSaveBtn').addEventListener('click', async () => {
  const p1 = document.getElementById('cpNewPassword1').value;
  const p2 = document.getElementById('cpNewPassword2').value;
  changePasswordMsg.style.display = 'none';

  if (p1.length < 6) {
    changePasswordMsg.textContent = 'A senha deve ter no mínimo 6 caracteres.';
    changePasswordMsg.className = 'message error'; changePasswordMsg.style.display = 'block';
    return;
  }
  if (p1 !== p2) {
    changePasswordMsg.textContent = 'As senhas não coincidem.';
    changePasswordMsg.className = 'message error'; changePasswordMsg.style.display = 'block';
    return;
  }

  const btn = document.getElementById('cpSaveBtn');
  btn.disabled = true; btn.textContent = 'Salvando...';
  const { error } = await db.auth.updateUser({ password: p1 });
  btn.disabled = false; btn.textContent = 'Salvar nova senha';

  if (error) {
    changePasswordMsg.textContent = 'Erro ao salvar: ' + error.message;
    changePasswordMsg.className = 'message error'; changePasswordMsg.style.display = 'block';
    return;
  }

  changePasswordModal.style.display = 'none';
  alert('Senha alterada com sucesso.');
});

// ---------------------------------------------------------------------------
// CARREGAMENTO DO PERFIL LOGADO
// ---------------------------------------------------------------------------
function defaultPageForContext(context) {
  return context === 'coordenacao' ? 'inicio' : 'minha_agenda';
}

async function loadProfile(user) {
  const { data: profile, error: profileError } = await db
    .from('profiles').select('id, full_name, role').eq('id', user.id).single();
  if (profileError) throw new Error('Este usuário não possui um perfil cadastrado no sistema.');

  currentProfile = profile;

  const { data: intern } = await db
    .from('interns').select('*').eq('id', user.id).maybeSingle();
  currentIntern = intern || null;

  const isCoord = profile.role === 'coordenador_agenda' || profile.role === 'coordenador_projeto';

  // Se a pessoa é coordenação E também tem perfil de estagiário, mostra o seletor
  if (isCoord && currentIntern) {
    contextSelect.style.display = 'block';
    contextSelect.value = 'coordenacao';
    currentContext = 'coordenacao';
  } else {
    contextSelect.style.display = 'none';
    currentContext = isCoord ? 'coordenacao' : 'estagiario';
  }

  updateUserLabel();
  currentPage = defaultPageForContext(currentContext);
  loadingScreen.style.display = 'none';
  loginScreen.style.display = 'none';
  app.style.display = 'flex';

  buildNav();
  render();
}

function updateUserLabel() {
  const label = currentContext === 'coordenacao' ? 'Coordenação' : 'Estagiário';
  userName.textContent = `${currentProfile.full_name} • ${label}`;
}

contextSelect.addEventListener('change', () => {
  currentContext = contextSelect.value;
  currentPage = defaultPageForContext(currentContext);
  updateUserLabel();
  buildNav();
  render();
});

// ---------------------------------------------------------------------------
// MENU
// ---------------------------------------------------------------------------
const COORD_PAGES = [
  { id: 'inicio', label: 'Início' },
  { id: 'agenda', label: 'Agenda' },
  { id: 'grade_geral', label: 'Grade Geral' },
  { id: 'mapa', label: 'Mapa de Salas' },
  { id: 'pacientes', label: 'Pacientes' },
  { id: 'estagiarios', label: 'Estagiários' },
  { id: 'relatorios', label: 'Relatórios' },
  { id: 'configuracoes', label: 'Horários' }
];

const INTERN_PAGES = [
  { id: 'minha_agenda', label: 'Minha agenda' },
  { id: 'minha_disponibilidade', label: 'Minha disponibilidade' },
  { id: 'meu_perfil', label: 'Meu perfil' }
];

// ---------------------------------------------------------------------------
// MENU MÓVEL (gaveta deslizante)
// ---------------------------------------------------------------------------
const sideEl = document.querySelector('.side');
const sideBackdrop = document.getElementById('sideBackdrop');
const mobileMenuBtn = document.getElementById('mobileMenuBtn');

function openMobileMenu() { sideEl.classList.add('open'); sideBackdrop.classList.add('open'); }
function closeMobileMenu() { sideEl.classList.remove('open'); sideBackdrop.classList.remove('open'); }

mobileMenuBtn.addEventListener('click', openMobileMenu);
sideBackdrop.addEventListener('click', closeMobileMenu);

function buildNav() {
  const pages = currentContext === 'coordenacao' ? COORD_PAGES : INTERN_PAGES;
  nav.innerHTML = pages.map(p => `<button data-page="${p.id}">${p.label}</button>`).join('');
  nav.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      currentPage = btn.dataset.page;
      closeMobileMenu();
      render();
    });
  });
}

function updateActiveNav() {
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.page === currentPage));
}

// ---------------------------------------------------------------------------
// ROTEAMENTO DE PÁGINAS
// ---------------------------------------------------------------------------
const PAGE_TITLES = {
  inicio: 'Início', agenda: 'Agenda', grade_geral: 'Grade Geral de Disponibilidade',
  mapa: 'Mapa de Salas',
  pacientes: 'Pacientes', estagiarios: 'Estagiários', relatorios: 'Relatórios',
  configuracoes: 'Horários', minha_agenda: 'Minha agenda',
  minha_disponibilidade: 'Minha disponibilidade', meu_perfil: 'Meu perfil'
};

function render() {
  pageTitle.textContent = PAGE_TITLES[currentPage] || 'Início';
  updateActiveNav();

  if (currentPage === 'configuracoes') { renderConfiguracoes(); return; }
  if (currentPage === 'estagiarios') { renderEstagiarios(); return; }
  if (currentPage === 'pacientes') { renderPacientes(); return; }
  if (currentPage === 'minha_disponibilidade') { renderMinhaDisponibilidade(); return; }

// PÁGINA: INÍCIO (coordenação e estagiário)
// ---------------------------------------------------------------------------
// Calcula os horários "efetivamente abertos", olhando todas as salas juntas
// (ou só as salas das localizações informadas, se locationIds for passado).
// Substitui o antigo quadro geral da clínica como fonte de verdade.
async function getEffectiveClinicSlots(locationIds = null) {
  let rows;
  if (locationIds && locationIds.length > 0) {
    const { data } = await db.from('room_schedule_slots').select('weekday, start_time, end_time, enabled, rooms(location_id)');
    rows = (data || []).filter(s => s.rooms && locationIds.includes(s.rooms.location_id));
  } else {
    const { data } = await db.from('room_schedule_slots').select('weekday, start_time, end_time, enabled');
    rows = data || [];
  }
  const map = {};
  rows.forEach(s => {
    const key = `${s.weekday}_${s.start_time.slice(0, 5)}`;
    if (!map[key]) map[key] = { weekday: s.weekday, start_time: s.start_time, end_time: s.end_time, enabled: false };
    if (s.enabled) map[key].enabled = true;
  });
  return Object.values(map);
}

function formatHM(t) {
  const [h, m] = t.slice(0, 5).split(':');
  return m === '00' ? `${h}h` : `${h}h${m}`;
}

function toMinutes(t) {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}

function timesOverlap(startA, endA, startB, endB) {
  return toMinutes(startA) < toMinutes(endB) && toMinutes(startB) < toMinutes(endA);
}

// Verifica se a sala já está ocupada por OUTRO paciente/estagiário nas datas/horário informados.
// É só aviso — nunca bloqueia, ao contrário do conflito de estagiário/paciente.
async function checkRoomConflicts(room, dateStrings, startTime, endTime, excludeSeriesId = null, excludeApptId = null) {
  if (!room || !dateStrings || dateStrings.length === 0) return [];
  const { data } = await db.from('appointments')
    .select('id, appointment_date, start_time, end_time, series_id, patients(registration_number, full_name)')
    .eq('room', room).in('appointment_date', dateStrings).eq('status', 'agendado');
  return (data || []).filter(c => {
    if (excludeApptId && c.id === excludeApptId) return false;
    if (excludeSeriesId && c.series_id === excludeSeriesId) return false;
    return timesOverlap(c.start_time, c.end_time, startTime, endTime);
  });
}

function roomConflictWarningHtml(conflicts, room) {
  if (!conflicts || conflicts.length === 0) return '';
  const examples = conflicts.slice(0, 3).map(c => {
    const patLabel = c.patients ? `#${c.patients.registration_number} ${c.patients.full_name || ''}` : '—';
    return `${fmtBr(c.appointment_date)} ${c.start_time.slice(0,5)}–${c.end_time.slice(0,5)} com ${escapeHtml(patLabel)}`;
  }).join('; ');
  return `<div class="message error" style="display:block;background:#fff5d8;color:#8a5b00;margin-top:10px">
    ⚠️ A sala "${escapeHtml(room)}" já tem ${conflicts.length} atendimento(s) marcado(s) nesse(s) dia/horário — ${examples}${conflicts.length > 3 ? '...' : ''}.
    Isso é só um aviso, você pode confirmar mesmo assim.
  </div>`;
}

// Mantém o ensalamento em dia com o agendamento: se um agendamento define uma
// sala, garante que aquele estagiário fique ensalado ali (perguntando antes
// de sobrescrever, se já houver outro estagiário ensalado no mesmo horário).
async function syncRoomStaffing(roomName, weekday, startTime, endTime, internId, nameByIdMap) {
  if (!roomName) return;
  const { data: roomRow } = await db.from('rooms').select('id').eq('name', roomName).maybeSingle();
  if (!roomRow) return;

  const { data: existingSlot } = await db.from('room_schedule_slots')
    .select('id').eq('room_id', roomRow.id).eq('weekday', weekday).eq('start_time', startTime).maybeSingle();
  if (!existingSlot) {
    await db.from('room_schedule_slots').insert([{ room_id: roomRow.id, weekday, start_time: startTime, end_time: endTime, enabled: true }]);
  }

  const { data: existingStaffing } = await db.from('room_staffing')
    .select('*').eq('room_id', roomRow.id).eq('weekday', weekday).eq('start_time', startTime).maybeSingle();

  if (!existingStaffing) {
    await db.from('room_staffing').insert([{ room_id: roomRow.id, intern_id: internId, weekday, start_time: startTime, end_time: endTime }]);
  } else if (existingStaffing.intern_id !== internId) {
    const internName = (nameByIdMap && nameByIdMap[internId]) || 'este estagiário';
    const oldName = (nameByIdMap && nameByIdMap[existingStaffing.intern_id]) || 'outro estagiário';
    if (confirm(`A sala "${roomName}" já tem ${oldName} ensalado neste dia e horário. Deseja substituir por ${internName}?`)) {
      await db.from('room_staffing').update({ intern_id: internId }).eq('id', existingStaffing.id);
    }
  }
}

function dateWithWeekday(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const wd = ROOM_WEEKDAYS.find(w => w.n === d.getDay());
  return `${wd ? wd.l.slice(0, 3) : ''} ${fmtBr(dateStr)}`;
}

function miniApptTable(list, nameById, showEstagiario) {
  if (!list || list.length === 0) return `<div class="placeholder">Nada por aqui.</div>`;
  const rows = list.map(a => {
    const patLabel = a.patients ? `#${a.patients.registration_number} ${a.patients.full_name || ''}` : '—';
    const internCell = showEstagiario ? `<td style="text-align:left">${escapeHtml(nameById[a.intern_id] || '?')}</td>` : '';
    return `<tr>
      <td style="text-align:left">${dateWithWeekday(a.appointment_date)}</td>
      <td style="text-align:left">${a.start_time.slice(0,5)}–${a.end_time.slice(0,5)}</td>
      <td style="text-align:left">${escapeHtml(patLabel)}</td>
      ${internCell}
    </tr>`;
  }).join('');
  const internHead = showEstagiario ? '<th style="text-align:left">Estagiário</th>' : '';
  return `<table style="width:100%;border-collapse:collapse;font-size:13px">
    <tr style="font-size:12px;color:#667085"><th style="text-align:left">Data</th><th style="text-align:left">Horário</th><th style="text-align:left">Paciente</th>${internHead}</tr>
    ${rows}</table>`;
}

function hoursSinceEnd(dateStr, endTime) {
  const end = new Date(`${dateStr}T${endTime}`);
  return (new Date() - end) / 36e5;
}

function daysUntil(dateStr) {
  const target = new Date(dateStr + 'T00:00:00');
  const today = new Date(toDateStr(new Date()) + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}

function statCard(label, value, color) {
  return `<div class="panel" style="margin-bottom:0;padding:18px">
    <small class="muted">${label}</small>
    <div style="font-size:26px;font-weight:700;margin-top:8px;color:${color || '#172033'}">${value}</div>
  </div>`;
}

async function loadInternStatsAndActions() {

    db.from('appointments').select('id, appointment_date, start_time, end_time, patients(registration_number, full_name)')

      .eq('intern_id', currentIntern.id).lte('appointment_date', todayStr).eq('status', 'agendado').eq('attendance_status', 'pendente')

          .eq('intern_id', currentIntern.id).eq('patient_id', pid).eq('status', 'agendado')

      const nextApptRow = nextAppt && nextAppt[0] ? nextAppt[0] : null;

          <div><div class="muted" style="font-size:11px">Próxima sessão</div><div style="font-weight:700;font-size:14px">${p.nextAppt ? `${dateWithWeekday(p.nextAppt.appointment_date)} ${p.nextAppt.start_time.slice(0,5)}` : '—'}</div></div>

      <td style="text-align:left">${fmtBr(a.appointment_date)}</td>
      <td style="text-align:left">${a.start_time.slice(0,5)}</td>
      <td style="text-align:left">${escapeHtml(patLabel)}</td>

  }).join('');

  const attRows = urgentAtt.map(a => {

      <td style="text-align:left">${escapeHtml(patLabel)}</td>

        style="padding:5px 10px;font-size:12px;background:#f3f4f6;color:#475467;border:1px solid #e5e7eb">Presença pendente</button></td>
    </tr>`;
  }).join('');

  const acoesRows = confRows + attRows;
  document.getElementById('acoesWrap').innerHTML = acoesRows
    ? `<table style="width:100%;border-collapse:collapse;font-size:13px">
        <tr style="font-size:12px;color:#667085"><th style="text-align:left">Data</th><th style="text-align:left">Horário</th><th style="text-align:left">Paciente</th><th style="text-align:left">Pendência</th><th style="text-align:left">Ação</th></tr>
        ${acoesRows}</table>`
    : `<div class="placeholder">Nenhum alerta urgente. Tudo em dia!</div>`;

  document.querySelectorAll('.action-confirm').forEach(btn => {
    btn.addEventListener('click', async () => {
      const { error } = await db.rpc('confirmar_atendimento', { p_appointment_id: btn.dataset.id, p_confirmacao: 'confirmado' });
      if (error) alert('Erro: ' + error.message); else renderMinhaAgenda();
    });
  });
  document.querySelectorAll('.toggle-presence-inline').forEach(btn => {
    btn.addEventListener('click', async () => {
      const current = btn.dataset.current;
      const next = current === 'presente' ? 'ausente' : 'presente';
      const { error } = await db.rpc('registrar_atendimento', { p_appointment_id: btn.dataset.id, p_status: next, p_cancelado_por: null });
      if (error) { alert('Erro: ' + error.message); return; }
      btn.dataset.current = next;
      if (next === 'presente') {
        btn.textContent = '✓ Compareceu';
        btn.style.background = '#e9f7ef'; btn.style.color = '#176b36'; btn.style.borderColor = '#bce3cc';
      } else {
        btn.textContent = '✗ Não compareceu';
        btn.style.background = '#fdecec'; btn.style.color = '#b42318'; btn.style.borderColor = '#f3c6c6';
      }
    });
  });
}

async function runBackup() {
  const btn = document.getElementById('backupBtn');
  const msg = document.getElementById('backupMsg');
  btn.disabled = true; btn.textContent = 'Gerando backup...';
  msg.style.display = 'none';

  const tables = [
    'patients', 'interns', 'profiles', 'clinic_schedule_slots',
    'intern_availability', 'patient_availability',
    'appointment_series', 'appointments',
    'academic_periods', 'intern_supervisor_history',
    'locations', 'rooms', 'room_schedule_slots', 'room_staffing',
    'intern_location_preferences', 'patient_number_counters'
  ];

  try {
    const workbook = XLSX.utils.book_new();

    for (const table of tables) {
      const { data, error } = await db.from(table).select('*');
      if (error) throw new Error(`Erro ao ler ${table}: ${error.message}`);
      const sheet = XLSX.utils.json_to_sheet(data && data.length ? data : [{}]);
      XLSX.utils.book_append_sheet(workbook, sheet, table.slice(0, 31));
    }

    const dateStr = toDateStr(new Date());
    XLSX.writeFile(workbook, `backup_escuta_comunitaria_${dateStr}.xlsx`);

    msg.textContent = 'Backup gerado e baixado com sucesso.';
    msg.className = 'message success'; msg.style.display = 'block';
  } catch (err) {
    msg.textContent = 'Erro ao gerar backup: ' + err.message;
    msg.className = 'message error'; msg.style.display = 'block';
  }

  btn.disabled = false; btn.textContent = 'Baixar backup completo';
}

          <h2>Horários</h2>
          <div class="muted">Isto é só um resumo. Os horários agora são gerenciados por sala, em <strong>Mapa de Salas</strong>. Cada célula mostra em quais salas aquele horário está aberto.</div>
        </div>
      </div>
      <div id="scheduleMsg" class="message"></div>
      <div id="scheduleGrid" class="schedule-grid">
        <div style="grid-column:1/-1;padding:20px;text-align:center">Carregando horários...</div>
      </div>
    </section>

    <section class="panel">
      <div class="toolbar">
        <div>
          <h2>Backup</h2>
          <div class="muted">Baixa uma cópia completa dos dados em uma planilha Excel, com uma aba para cada tabela do sistema.</div>
        </div>
        <button id="backupBtn" class="action secondary">Baixar backup completo</button>
      </div>
      <div id="backupMsg" class="message"></div>
    </section>`;

  document.getElementById('backupBtn').addEventListener('click', runBackup);

  const grid = document.getElementById('scheduleGrid');

  const [{ data: roomSlots }, { data: rooms }] = await Promise.all([
    db.from('room_schedule_slots').select('weekday, start_time, end_time, enabled, room_id').eq('enabled', true),
    db.from('rooms').select('id, name')
  ]);

  const roomNameById = {};
  (rooms || []).forEach(r => { roomNameById[r.id] = r.name; });

  if (!roomSlots || roomSlots.length === 0) {
    grid.innerHTML = `<div style="grid-column:1/-1;padding:20px;text-align:center" class="placeholder">Nenhum horário aberto em nenhuma sala ainda. Configure em "Mapa de Salas".</div>`;
    return;
  }

  const times = [...new Set(roomSlots.map(s => s.start_time.slice(0, 5)))].sort();

  let html = `<div class="schedule-head">Horário</div>` + WEEKDAYS.map(d => `<div class="schedule-head">${d.l}</div>`).join('');

  times.forEach(time => {
    const sample = roomSlots.find(s => s.start_time.slice(0, 5) === time);
    const label = sample ? `${formatHM(sample.start_time)} – ${formatHM(sample.end_time)}` : time;
    html += `<div><strong>${label}</strong></div>`;
    WEEKDAYS.forEach(d => {
      const matches = roomSlots.filter(s => s.weekday === d.n && s.start_time.slice(0, 5) === time);
      if (matches.length === 0) { html += `<div style="color:#d0d5dd;font-size:11px">Fechado</div>`; return; }
      const roomNames = matches.map(s => escapeHtml(roomNameById[s.room_id] || '?')).join(', ');
      html += `<div style="background:#e9f7ef;color:#176b36;border:1px solid #bce3cc;border-radius:8px;padding:6px;font-size:11px">🟢 ${roomNames}</div>`;
    });
  });

  grid.innerHTML = html;
}

function exportReportPdf(title, bodyHtml) {
  const win = window.open('', '_blank');
  win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${title}</title>
    <style>
      body{font-family:Arial,sans-serif;padding:32px;color:#172033}

      th,td{border:1px solid #ddd;padding:8px;font-size:13px;text-align:left}
      th{background:#f5f7fb}
      .totals td{font-weight:700;background:#fafbfc}
    </style></head><body>
    <h1>${title}</h1>${bodyHtml}
    </body></html>`);
  win.document.close();

async function computeInternMetrics(internId, startDate, endDate) {
  const { data: appts } = await db.from('appointments').select('id, patient_id, status, attendance_status')
    .eq('intern_id', internId).gte('appointment_date', startDate).lte('appointment_date', endDate);
  const all = appts || [];
  const ativos = all.filter(a => a.status === 'agendado');
  const presentes = ativos.filter(a => a.attendance_status === 'presente').length;
  const ausentes = ativos.filter(a => a.attendance_status === 'ausente').length;
  const cancelados = all.filter(a => a.status === 'cancelado').length;
  const pacientes = new Set(ativos.map(a => a.patient_id)).size;
  return {
    atendimentos: ativos.length, horasPrevistas: ativos.length, horasRealizadas: presentes,
    pacientes, presentes, ausentes, cancelados
  };
}

function whatsappLink(whatsapp) {
  let digits = String(whatsapp || '').replace(/\D/g, '');
  if (!digits) return null;
  if (!digits.startsWith('55')) digits = '55' + digits;
  return `https://wa.me/${digits}`;
}

function whatsappContactLink(whatsapp, patientName) {
  const base = whatsappLink(whatsapp);
  if (!base) return '#';
  const firstTwoNames = (patientName || '').trim().split(/\s+/).slice(0, 2).join(' ') || 'tudo bem';
  const message = `Oi, ${firstTwoNames}! Tudo bem? Me chamo Dawton, sou estagiário do Prof. Sérgio Duarte, e estou entrando em contato pelo *Projeto Escuta Comunitária*. Você se inscreveu para um projeto de atendimento psicológico da Uninassau e gostaria de saber se você tem disponibilidade para iniciar o processo terapêutico com um de nossos extensionistas.`;
  return `${base}?text=${encodeURIComponent(message)}`;
}

function whatsappConfirmationLink(whatsapp, patientName, appt, roomInfo, internName) {
  const base = whatsappLink(whatsapp);
  if (!base) return '#';
  const firstName = (patientName || '').trim().split(/\s+/)[0] || '';
  const dateLabel = fmtBr(appt.appointment_date);
  const timeLabel = formatHM(appt.start_time);
  const roomName = roomInfo ? roomInfo.name : (appt.room || 'a definir');
  const roomAddress = (roomInfo && roomInfo.address) ? roomInfo.address : 'endereço a confirmar';
  const message = `Oi, ${firstName}! Seu atendimento será no dia ${dateLabel}, às ${timeLabel}, na sala ${roomName}, da ${roomAddress}, com ${internName || 'nosso estagiário'}.`;
  return `${base}?text=${encodeURIComponent(message)}`;
}

// o login do estagiário sem afetar a sessão da coordenação que está logada.
function createTempAuthClient() {
  return createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
  });
}

async function renderEstagiarios() {
  content.innerHTML = `
    <section class="panel">
      <div class="toolbar">
        <div><h2>Período letivo</h2><div class="muted">Informe o início e o término do semestre atual. Ao passar da data final, os estagiários entram em "avanço pendente".</div></div>
      </div>
      <div id="periodMsg" class="message"></div>
      <div id="currentPeriodWrap" class="muted" style="margin-bottom:12px">Carregando...</div>
      <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
        <div class="field" style="margin-bottom:0"><label>Início do semestre</label><input type="date" id="periodStart"></div>
        <div class="field" style="margin-bottom:0"><label>Término do semestre</label><input type="date" id="periodEnd"></div>
        <button id="savePeriodBtn" class="action">Salvar período</button>
      </div>
    </section>

    <section class="panel">
      <div class="toolbar">
        <div><h2>Estagiários</h2><div class="muted">Cadastro e login dos estagiários.</div></div>
        <div style="display:flex;gap:8px">
          <button id="exportInternsPdfBtn" class="action secondary">Lista em PDF</button>
          <button id="newInternBtn" class="action">+ Novo estagiário</button>
        </div>
      </div>
      <div style="margin-bottom:14px">
        <input id="internSearchInput" type="text" placeholder="Buscar por nome, matrícula, e-mail ou WhatsApp..." style="width:100%;max-width:420px;padding:10px 14px;border:1px solid #d5dbe4;border-radius:9px;font-size:14px">
      </div>
      <div id="internListWrap"><div class="placeholder">Carregando...</div></div>
    </section>

    <div id="internFormPanel" class="modal-overlay">
      <div class="modal-box" style="width:min(620px,100%)">
      <div class="toolbar"><h2 id="internFormTitle">Novo estagiário</h2></div>
      <div id="internFormMsg" class="message"></div>
      <div class="field"><label>Nome completo *</label><input id="fName" placeholder="Nome completo"></div>
      <div id="loginFields">
        <div class="field"><label>E-mail de acesso *</label><input id="fEmail" type="email" placeholder="estagiario@email.com"></div>
        <div class="field"><label>Senha de acesso *</label><input id="fPassword" type="text" placeholder="Mínimo 6 caracteres"></div>
      </div>
      <div id="resetPasswordField" style="display:none;margin-bottom:16px">
        <button id="sendResetPasswordBtn" type="button" class="action secondary">Enviar link de redefinição de senha</button>
        <div class="muted" style="font-size:12px;margin-top:6px">Envia um e-mail para o estagiário definir uma nova senha.</div>
      </div>
      <div class="field"><label>Matrícula *</label><input id="fRegistration" placeholder="Matrícula">
        <div class="muted" style="font-size:12px;margin-top:4px">O estagiário pode usar a matrícula para entrar no sistema, além do e-mail.</div>
      </div>
      <div class="field"><label>WhatsApp *</label><input id="fWhatsapp" placeholder="(85) 99999-9999"></div>
      <div class="field"><label>Semestre *</label><input id="fSemester" type="number" min="1" max="20" placeholder="8"></div>
      <div class="field"><label>Supervisor *</label><input id="fSupervisor" placeholder="Nome do professor supervisor"></div>
      <div id="supervisorHistoryWrap" style="display:none;margin:-8px 0 16px"></div>
      <div class="field"><label>Abordagens (opcional)</label><input id="fApproaches" placeholder="Ex.: TCC"></div>
      <div class="field"><label>Público (opcional)</label><input id="fAudience" placeholder="Ex.: Adultos"></div>
      <div class="field"><label>Status</label>
        <select id="fStatus"><option value="ativo">Ativo</option><option value="inativo">Inativo</option></select>
      </div>
      <div style="display:flex;gap:10px;margin-top:10px">
        <button id="saveInternBtn" class="action">Salvar estagiário</button>
        <button id="cancelInternBtn" class="action secondary">Cancelar</button>
      </div>
      </div>
    </div>`;

  // ---- Período letivo e avanço de semestre ----
  const periodMsg = document.getElementById('periodMsg');
  let latestPeriod = null;

  async function loadPeriod() {
    const { data } = await db.from('academic_periods').select('*').order('end_date', { ascending: false }).limit(1);
    latestPeriod = (data && data[0]) || null;
    document.getElementById('currentPeriodWrap').innerHTML = latestPeriod
      ? `Período atual: <strong>${fmtBr(latestPeriod.start_date)} a ${fmtBr(latestPeriod.end_date)}</strong>`
      : 'Nenhum período letivo cadastrado ainda.';
  }

  document.getElementById('savePeriodBtn').addEventListener('click', async () => {
    const start = document.getElementById('periodStart').value;
    const end = document.getElementById('periodEnd').value;
    if (!start || !end || start > end) {
      periodMsg.textContent = 'Informe datas válidas (início antes do término).';
      periodMsg.className = 'message error'; periodMsg.style.display = 'block';
      return;
    }
    const { error } = await db.from('academic_periods').insert([{ start_date: start, end_date: end }]);
    if (error) {
      periodMsg.textContent = 'Erro ao salvar: ' + error.message;
      periodMsg.className = 'message error'; periodMsg.style.display = 'block';
      return;
    }
    periodMsg.textContent = 'Período letivo salvo.';
    periodMsg.className = 'message success'; periodMsg.style.display = 'block';
    document.getElementById('periodStart').value = '';
    document.getElementById('periodEnd').value = '';
    await loadPeriod();
    await checkSemesterAdvance();
    await loadList();
  });

  async function checkSemesterAdvance() {
    if (!latestPeriod) return;
    const todayStr = toDateStr(new Date());
    if (todayStr <= latestPeriod.end_date) return;

    const { data: candidates } = await db.from('interns').select('id, last_advanced_period_id, pending_semester_advance')
      .eq('status', 'ativo')
      .or(`last_advanced_period_id.is.null,last_advanced_period_id.neq.${latestPeriod.id}`);

    const toFlag = (candidates || []).filter(i => !i.pending_semester_advance).map(i => i.id);
    if (toFlag.length > 0) {
      await db.from('interns').update({ pending_semester_advance: true }).in('id', toFlag);
    }
  }

  await loadPeriod();
  await checkSemesterAdvance();

  const wrap = document.getElementById('internListWrap');
  const panel = document.getElementById('internFormPanel');
  const formTitle = document.getElementById('internFormTitle');
  const loginFields = document.getElementById('loginFields');
  const msg = document.getElementById('internFormMsg');
  let editingId = null;
  let internsCache = [];
  let internPage = 1;
  let internPageSize = 20;
  let internSearchQuery = '';
  let lastFilteredInterns = []; // usado para exportar em PDF

  async function loadList() {
    const { data: interns, error: internsErr } = await db.from('interns').select('*');
    if (internsErr) {
      wrap.innerHTML = `<div class="message error" style="display:block">Erro: ${escapeHtml(internsErr.message)}</div>`;
      return;
    }

    const internIds = (interns || []).map(i => i.id);
    const { data: profiles, error: profilesErr } = internIds.length
      ? await db.from('profiles').select('id, full_name').in('id', internIds)
      : { data: [], error: null };

    if (profilesErr) {
      wrap.innerHTML = `<div class="message error" style="display:block">Erro: ${escapeHtml(profilesErr.message)}</div>`;
      return;
    }

    const nameById = {};
    (profiles || []).forEach(p => { nameById[p.id] = p.full_name; });

    internsCache = (interns || []).map(i => ({ ...i, full_name: nameById[i.id] || '(sem nome)' }))
      .sort((a, b) => a.full_name.localeCompare(b.full_name));

    if (internsCache.length === 0) {
      wrap.innerHTML = `<div class="placeholder">Nenhum estagiário cadastrado.</div>`;
      return;
    }

    const filteredInterns = internSearchQuery
      ? internsCache.filter(i => {
          const q = internSearchQuery.toLowerCase();
          return (i.full_name || '').toLowerCase().includes(q)
            || (i.registration_number || '').toLowerCase().includes(q)
            || (i.email || '').toLowerCase().includes(q)
            || (i.whatsapp || '').toLowerCase().includes(q);
        })
      : internsCache;

    if (filteredInterns.length === 0) {
      wrap.innerHTML = `<div class="placeholder">Nenhum estagiário encontrado.</div>`;
      return;
    }

    lastFilteredInterns = filteredInterns;

    const effectivePageSize = internPageSize === 'all' ? filteredInterns.length : internPageSize;
    const totalPages = Math.max(1, Math.ceil(filteredInterns.length / effectivePageSize));
    if (internPage > totalPages) internPage = totalPages;
    const startIdx = (internPage - 1) * effectivePageSize;
    const pageItems = internPageSize === 'all' ? filteredInterns : filteredInterns.slice(startIdx, startIdx + effectivePageSize);

    const rows = pageItems.map(i => {
      const wa = whatsappLink(i.whatsapp);
      const waHtml = wa ? `<a href="${wa}" target="_blank" rel="noopener">${escapeHtml(i.whatsapp)}</a>` : (escapeHtml(i.whatsapp) || '—');
      const statusBadge = i.status === 'ativo'
        ? `<span style="color:#2f855a;font-weight:700">Ativo</span>`
        : `<span style="color:#b42318;font-weight:700">Inativo</span>`;
      const semestreCell = i.pending_semester_advance
        ? `${i.current_semester}º <button class="action secondary confirm-advance" data-id="${i.id}" data-current="${i.current_semester}" style="padding:3px 8px;font-size:11px;margin-left:6px;background:#fff4d6;color:#8a5b00;border-color:#f0d38a">⏫ Avançar p/ ${i.current_semester + 1}º</button>`
        : `${i.current_semester}º`;
      return `<tr>
        <td><strong>${escapeHtml(i.full_name)}</strong><br><small class="muted">${escapeHtml(i.email)}</small></td>
        <td>${escapeHtml(i.registration_number)}</td>
        <td>${waHtml}</td>
        <td>${escapeHtml(i.supervisor || '—')}</td>
        <td>${semestreCell}</td>
        <td>${statusBadge}</td>
        <td>
          <button class="action secondary edit-intern" data-id="${i.id}" style="padding:6px 10px">Editar</button>
          ${i.status === 'inativo' ? `<button class="action secondary delete-intern" data-id="${i.id}" style="padding:6px 10px;color:#b42318">Excluir</button>` : ''}
        </td>
      </tr>`;
    }).join('');

    wrap.innerHTML = `<div style="overflow:auto"><table style="width:100%;border-collapse:collapse">
      <tr style="text-align:left;font-size:12px;color:#667085">
        <th style="padding:10px 8px">Nome / E-mail</th><th>Matrícula</th><th>WhatsApp</th><th>Supervisor</th><th>Semestre</th><th>Status</th><th>Ações</th>
      </tr>${rows}</table></div>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-top:14px">
        <div style="display:flex;align-items:center;gap:8px;font-size:13px">
          <span class="muted">Por página:</span>
          <select id="internPageSizeSelect" style="padding:6px 10px;border:1px solid #d5dbe4;border-radius:8px">
            <option value="10" ${internPageSize === 10 ? 'selected' : ''}>10</option>
            <option value="20" ${internPageSize === 20 ? 'selected' : ''}>20</option>
            <option value="50" ${internPageSize === 50 ? 'selected' : ''}>50</option>
            <option value="100" ${internPageSize === 100 ? 'selected' : ''}>100</option>
            <option value="all" ${internPageSize === 'all' ? 'selected' : ''}>Todos</option>
          </select>
          <span class="muted">${filteredInterns.length} estagiário(s)</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <button id="internPrevPage" class="action secondary" style="padding:6px 12px" ${internPage <= 1 ? 'disabled' : ''}>◀</button>
          <span style="font-size:13px">Página ${internPage} de ${totalPages}</span>
          <button id="internNextPage" class="action secondary" style="padding:6px 12px" ${internPage >= totalPages ? 'disabled' : ''}>▶</button>
        </div>
      </div>`;

    document.getElementById('internPageSizeSelect').addEventListener('change', (e) => {
      internPageSize = e.target.value === 'all' ? 'all' : parseInt(e.target.value);
      internPage = 1;
      loadList();
    });
    document.getElementById('internPrevPage').addEventListener('click', () => { internPage--; loadList(); });
    document.getElementById('internNextPage').addEventListener('click', () => { internPage++; loadList(); });

    wrap.querySelectorAll('.edit-intern').forEach(btn => {
      btn.addEventListener('click', () => openForm(internsCache.find(i => i.id === btn.dataset.id)));
    });

    wrap.querySelectorAll('.confirm-advance').forEach(btn => {
      btn.addEventListener('click', async () => {
        const nextSemester = parseInt(btn.dataset.current) + 1;
        const { error } = await db.from('interns').update({
          current_semester: nextSemester,
          pending_semester_advance: false,
          last_advanced_period_id: latestPeriod ? latestPeriod.id : null
        }).eq('id', btn.dataset.id);
        if (error) alert('Erro ao avançar semestre: ' + error.message); else loadList();
      });
    });

    wrap.querySelectorAll('.delete-intern').forEach(btn => {
      btn.addEventListener('click', async () => {
        const { count } = await db.from('appointments').select('id', { count: 'exact', head: true }).eq('intern_id', btn.dataset.id);
        if (count && count > 0) {
          alert('Não é possível excluir: este estagiário já teve atendimentos registrados. Mantenha-o inativo para preservar o histórico.');
          return;
        }
        if (!confirm('Excluir este estagiário definitivamente? O login dele deixará de funcionar, mas a conta em si precisa ser removida manualmente no painel do Supabase (Authentication → Users). Deseja continuar?')) return;
        await db.from('intern_availability').delete().eq('intern_id', btn.dataset.id);
        const { error: internErr } = await db.from('interns').delete().eq('id', btn.dataset.id);
        if (internErr) { alert('Erro ao excluir: ' + internErr.message); return; }
        await db.from('profiles').delete().eq('id', btn.dataset.id);
        loadList();
      });
    });
  }

  function resetForm() {
    editingId = null;
    formTitle.textContent = 'Novo estagiário';
    loginFields.style.display = 'block';
    document.getElementById('resetPasswordField').style.display = 'none';
    document.getElementById('supervisorHistoryWrap').style.display = 'none';
    msg.style.display = 'none';
    document.getElementById('fName').value = '';
    document.getElementById('fEmail').value = '';
    document.getElementById('fPassword').value = '';
    document.getElementById('fRegistration').value = '';
    document.getElementById('fWhatsapp').value = '';
    document.getElementById('fSemester').value = '';
    document.getElementById('fSupervisor').value = '';
    document.getElementById('fApproaches').value = '';
    document.getElementById('fAudience').value = '';
    document.getElementById('fStatus').value = 'ativo';
  }

  async function openForm(intern) {
    resetForm();
    if (intern) {
      editingId = intern.id;
      formTitle.textContent = 'Editar estagiário';
      loginFields.style.display = 'none'; // login não é editado aqui
      document.getElementById('resetPasswordField').style.display = 'block';
      document.getElementById('sendResetPasswordBtn').dataset.email = intern.email;
      document.getElementById('fName').value = intern.full_name;
      document.getElementById('fRegistration').value = intern.registration_number || '';
      document.getElementById('fWhatsapp').value = intern.whatsapp || '';
      document.getElementById('fSemester').value = intern.current_semester || '';
      document.getElementById('fSupervisor').value = intern.supervisor || '';
      document.getElementById('fApproaches').value = intern.preferred_approaches || '';
      document.getElementById('fAudience').value = intern.preferred_audience || '';
      document.getElementById('fStatus').value = intern.status || 'ativo';

      const historyWrap = document.getElementById('supervisorHistoryWrap');
      const { data: history } = await db.from('intern_supervisor_history')
        .select('supervisor, start_date, end_date')
        .eq('intern_id', intern.id).order('start_date', { ascending: false });

      if (history && history.length > 0) {
        historyWrap.innerHTML = `<div class="muted" style="font-size:12px;margin-bottom:4px">Histórico de supervisores:</div>
          <div style="font-size:12px;color:#475467">${history.map(h => {
            const period = `${fmtBr(h.start_date)} a ${h.end_date ? fmtBr(h.end_date) : 'atual'}`;
            return `${escapeHtml(h.supervisor)} <span class="muted">(${period})</span>`;
          }).join('<br>')}</div>`;
        historyWrap.style.display = 'block';
      }
    }
    panel.style.display = 'flex';
  }

  document.getElementById('newInternBtn').addEventListener('click', () => openForm(null));

  document.getElementById('exportInternsPdfBtn').addEventListener('click', () => {
    const rows = lastFilteredInterns.map(i => `
      <tr>
        <td>${escapeHtml(i.full_name)}</td>
        <td>${escapeHtml(i.registration_number)}</td>
        <td>${i.current_semester}º</td>
        <td>${escapeHtml(i.supervisor || '—')}</td>
      </tr>`).join('');
    const body = `
      <div class="meta">${lastFilteredInterns.length} estagiário(s) · gerado em ${new Date().toLocaleDateString('pt-BR')}</div>
      <table><tr><th>Nome</th><th>Matrícula</th><th>Período</th><th>Supervisor</th></tr>${rows}</table>`;
    exportReportPdf('Lista de estagiários', body);
  });

  let internSearchDebounce = null;
  document.getElementById('internSearchInput').addEventListener('input', (e) => {
    clearTimeout(internSearchDebounce);
    internSearchDebounce = setTimeout(() => {
      internSearchQuery = e.target.value.trim();
      internPage = 1;
      loadList();
    }, 300);
  });
  document.getElementById('cancelInternBtn').addEventListener('click', () => { panel.style.display = 'none'; });

  document.getElementById('sendResetPasswordBtn').addEventListener('click', async () => {
    const email = document.getElementById('sendResetPasswordBtn').dataset.email;
    if (!email) return;
    const btn = document.getElementById('sendResetPasswordBtn');
    btn.disabled = true; btn.textContent = 'Enviando...';
    const { error } = await db.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname
    });
    btn.disabled = false; btn.textContent = 'Enviar link de redefinição de senha';
    if (error) {
      msg.textContent = 'Erro ao enviar: ' + error.message;
      msg.className = 'message error'; msg.style.display = 'block';
    } else {
      msg.textContent = `Link de redefinição enviado para ${email}.`;
      msg.className = 'message success'; msg.style.display = 'block';
    }
  });

  document.getElementById('saveInternBtn').addEventListener('click', async () => {
    const btn = document.getElementById('saveInternBtn');
    msg.style.display = 'none';

    const fullName = document.getElementById('fName').value.trim();
    const registration = document.getElementById('fRegistration').value.trim();
    const whatsapp = document.getElementById('fWhatsapp').value.trim();
    const semester = parseInt(document.getElementById('fSemester').value);
    const supervisor = document.getElementById('fSupervisor').value.trim();
    const approaches = document.getElementById('fApproaches').value.trim() || null;
    const audience = document.getElementById('fAudience').value.trim() || null;
    const status = document.getElementById('fStatus').value;

    if (!fullName || !registration || !whatsapp || !semester || !supervisor) {
      msg.textContent = 'Preencha todos os campos obrigatórios.';
      msg.className = 'message error'; msg.style.display = 'block';
      return;
    }

    btn.disabled = true; btn.textContent = 'Salvando...';

    if (editingId) {
      // Edição: não mexe em login/e-mail, só nos dados cadastrais
      const previousIntern = internsCache.find(i => i.id === editingId);
      const previousSupervisor = previousIntern ? previousIntern.supervisor : null;

      const { error: profileErr } = await db.from('profiles').update({ full_name: fullName }).eq('id', editingId);
      const { error: internErr } = await db.from('interns').update({
        registration_number: registration, whatsapp, current_semester: semester, supervisor,
        preferred_approaches: approaches, preferred_audience: audience, status
      }).eq('id', editingId);

      if (profileErr || internErr) {
        msg.textContent = 'Erro ao salvar: ' + (profileErr || internErr).message;
        msg.className = 'message error'; msg.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Salvar estagiário';
        return;
      }

      if (supervisor !== previousSupervisor) {
        const todayStr = toDateStr(new Date());
        const { data: openEntries } = await db.from('intern_supervisor_history')
          .select('id').eq('intern_id', editingId).is('end_date', null);
        if (openEntries && openEntries.length > 0) {
          await db.from('intern_supervisor_history').update({ end_date: todayStr }).in('id', openEntries.map(e => e.id));
        }
        await db.from('intern_supervisor_history').insert([{
          intern_id: editingId, supervisor, start_date: todayStr, end_date: null
        }]);
      }
    } else {
      // Criação: precisa de e-mail e senha para gerar o login
      const email = document.getElementById('fEmail').value.trim();
      const password = document.getElementById('fPassword').value;

      if (!email || !password || password.length < 6) {
        msg.textContent = 'Informe e-mail e uma senha com no mínimo 6 caracteres.';
        msg.className = 'message error'; msg.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Salvar estagiário';
        return;
      }

      const tempClient = createTempAuthClient();
      const { data: signUpData, error: signUpError } = await tempClient.auth.signUp({ email, password });

      if (signUpError || !signUpData.user) {
        msg.textContent = 'Erro ao criar login: ' + (signUpError ? signUpError.message : 'usuário não criado.');
        msg.className = 'message error'; msg.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Salvar estagiário';
        return;
      }

      const newId = signUpData.user.id;

      const { error: profileErr } = await db.from('profiles').insert([{ id: newId, full_name: fullName, role: 'estagiario' }]);
      if (profileErr) {
        msg.textContent = 'Erro ao salvar perfil: ' + profileErr.message;
        msg.className = 'message error'; msg.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Salvar estagiário';
        return;
      }

      const { error: internErr } = await db.from('interns').insert([{
        id: newId, registration_number: registration, whatsapp, current_semester: semester, supervisor,
        preferred_approaches: approaches, preferred_audience: audience, email, status
      }]);
      if (internErr) {
        msg.textContent = 'Erro ao salvar dados do estagiário: ' + internErr.message;
        msg.className = 'message error'; msg.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Salvar estagiário';
        return;
      }

      await db.from('intern_supervisor_history').insert([{
        intern_id: newId, supervisor, start_date: toDateStr(new Date()), end_date: null
      }]);
    }

    panel.style.display = 'none';
    await loadList();
    btn.disabled = false; btn.textContent = 'Salvar estagiário';
  });

  await loadList();
}

// GRADE DE DISPONIBILIDADE (reutilizável: pacientes, estagiários)

function buildAvailabilityGrid(allSlots, selectedSlots) {
  if (!allSlots || allSlots.length === 0) {
    return `<div class="placeholder">Nenhum horário cadastrado ainda. Configure em "Horários".</div>`;
  }

  const times = [...new Set(allSlots.map(s => s.start_time.slice(0, 5)))].sort();

  let html = `<div class="schedule-grid"><div class="schedule-head">Horário</div>` +
    WEEKDAYS.map(d => `<div class="schedule-head">${d.l}</div>`).join('');

  times.forEach(time => {
    const sampleSlot = allSlots.find(s => s.start_time.slice(0, 5) === time);
    const timeLabel = sampleSlot ? `${formatHM(sampleSlot.start_time)} – ${formatHM(sampleSlot.end_time)}` : time;
    html += `<div><strong>${timeLabel}</strong></div>`;
    WEEKDAYS.forEach(d => {
      const slot = allSlots.find(s => s.weekday === d.n && s.start_time.slice(0, 5) === time);
      if (!slot) { html += `<div style="color:#d0d5dd;font-size:11px">—</div>`; return; }

      const isSelected = (selectedSlots || []).some(s => s.weekday === d.n && s.start_time.slice(0, 5) === time);
      let cls, label;
      if (slot.enabled && isSelected) { cls = 'slot-open'; label = '✓ Disponível'; }
      else if (slot.enabled && !isSelected) { cls = 'slot-closed'; label = 'Livre'; }
      else if (!slot.enabled && isSelected) { cls = 'slot-future'; label = '🔜 Fora do horário'; }
      else { cls = 'slot-shut'; label = 'Fechado'; }

      html += `<div><button type="button" class="slot-btn avail-toggle ${cls}"
        data-weekday="${d.n}" data-start="${slot.start_time}" data-end="${slot.end_time}" data-enabled="${slot.enabled}">${label}</button></div>`;
    });
  });

  html += `</div>`;
  return html;
}

function bindAvailabilityToggles(container) {
  container.querySelectorAll('.avail-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const enabled = btn.dataset.enabled === 'true';
      const wasSelected = btn.classList.contains('slot-open') || btn.classList.contains('slot-future');
      const nowSelected = !wasSelected;
      btn.classList.remove('slot-open', 'slot-closed', 'slot-future', 'slot-shut');
      if (enabled && nowSelected) { btn.classList.add('slot-open'); btn.textContent = '✓ Disponível'; }
      else if (enabled && !nowSelected) { btn.classList.add('slot-closed'); btn.textContent = 'Livre'; }
      else if (!enabled && nowSelected) { btn.classList.add('slot-future'); btn.textContent = '🔜 Fora do horário'; }
      else { btn.classList.add('slot-shut'); btn.textContent = 'Fechado'; }
    });
  });
}

function readSelectedSlots(container) {
  return Array.from(container.querySelectorAll('.avail-toggle.slot-open, .avail-toggle.slot-future')).map(b => ({
    weekday: parseInt(b.dataset.weekday), start_time: b.dataset.start, end_time: b.dataset.end
  }));
}

function formatAvailabilityBadges(slots) {
  if (!slots || slots.length === 0) return `<span class="muted">Sem restrição</span>`;
  const byDay = {};
  slots.forEach(s => {
    if (!byDay[s.weekday]) byDay[s.weekday] = [];
    byDay[s.weekday].push(s.start_time.slice(0, 5));
  });
  return `<div style="display:flex;gap:4px">` + WEEKDAYS.map(d => {
    const hours = byDay[d.n];
    const has = !!hours;
    const bg = has ? '#e9f7ef' : '#f3f4f6';
    const fg = has ? '#176b36' : '#c3c9d3';
    const title = has ? hours.sort().join(', ') : 'Sem disponibilidade';
    return `<span title="${escapeHtml(title)}" style="width:28px;height:22px;border-radius:6px;background:${bg};color:${fg};
      font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center">${d.l.slice(0, 3)}</span>`;
  }).join('') + `</div>`;
}

const CANCELLATION_REASON_LABELS = {
  paciente_nao_respondeu: 'Paciente não respondeu',
  paciente_nao_podera_comparecer: 'Paciente não poderá comparecer',
  estagiario_nao_confirmou: 'Estagiário não confirmou',
  estagiario_nao_podera_comparecer: 'Estagiário não poderá comparecer'
};

function daysSince(dateStr) {
  const then = new Date(dateStr);
  const now = new Date();
  return Math.max(0, Math.floor((now - then) / (1000 * 60 * 60 * 24)));
}

      if (situationFilter === 'inativos') return p.status === 'inativo';
      if (situationFilter === 'pausados') return p.status === 'pausado';
      if (situationFilter === 'alta') return p.status === 'alta';
      if (situationFilter === 'contato') return p.status === 'em_contato';
      if (situationFilter === 'sem_encaixe') return p.status === 'sem_encaixe';

      if (situationFilter === 'agendado') return scheduledSet.has(p.id);

  document.querySelectorAll('.situation-filter').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.v === situationFilter);
    btn.addEventListener('click', () => {
