<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projeto Escuta Comunitária</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* (Mantendo os estilos anteriores para brevidade, apenas adicionando os necessários) */
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}
.panel{background:#fff;border:1px solid #e5e9ef;border-radius:12px;padding:20px;margin-bottom:20px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.action{border:0;background:#315c8c;color:#fff;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer}
.secondary{background:#fff;color:#315c8c;border:1px solid #cbd6e2}
.ec-pills{display:flex;gap:8px;margin-bottom:16px}
.ec-pill{padding:7px 12px;border-radius:999px;background:#f2f4f7;font-size:12px;cursor:pointer;border:0}
.ec-pill.active{background:#315c8c;color:#fff;font-weight:700}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #e9edf2}
.app{display:flex;min-height:100vh}.side{width:240px;background:#fff;border-right:1px solid #e5e9ef;padding:24px}.main{flex:1;padding:30px}
</style>
</head>
<body>
<!-- (Estrutura HTML mantida, apenas ajuste o script abaixo) -->
<div id="app" class="app">
  <aside class="side"><div class="logo">Escuta <span>Comunitária</span></div><nav id="nav"></nav></aside>
  <main class="main"><h1 id="title">Agenda</h1><div id="content"></div></main>
</div>

<script>
// ... [Chaves Supabase e Init igual aos anteriores] ...
const SUPABASE_URL = 'https://bhgwzqkdhbgfrlhcveqg.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_l8XeXHqjK6yRwFHjquGadg_e0PpDNXn';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

// Variáveis de Estado
let appointments = [];
let viewFilter = 'semana'; // hoje, semana, mes, geral
let internFilter = 'todos'; // id do estagiário ou 'todos'

const ecPrototypeAgenda = async () => {
  const { data } = await db.from('appointments')
    .select('id, appointment_date, start_time, end_time, patients(full_name, registration_number), interns(id, full_name)')
    .order('appointment_date', { ascending: true });
  appointments = data || [];

  content.innerHTML = `
    <div class="toolbar">
      <div class="ec-pills" id="timeFilter">
        <button class="ec-pill" data-v="hoje">Hoje</button>
        <button class="ec-pill active" data-v="semana">Semana</button>
        <button class="ec-pill" data-v="mes">Mês</button>
        <button class="ec-pill" data-v="geral">Geral</button>
      </div>
      <select id="internFilterSelect" class="context-select"><option value="todos">Todos os estagiários</option></select>
      <button class="action" id="ecNewAppointment">+ Novo</button>
    </div>
    <section class="panel"><div id="agendaTableWrap"></div></section>
  `;

  // Renderizar filtros
  document.getElementById('timeFilter').onclick = (e) => {
    if(!e.target.dataset.v) return;
    document.querySelectorAll('.ec-pill').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    viewFilter = e.target.dataset.v;
    renderAgenda();
  };

  renderAgenda();
};

function renderAgenda() {
  const today = new Date().toISOString().split('T')[0];
  const now = new Date();
  
  let filtered = appointments.filter(a => {
    const d = new Date(a.appointment_date);
    if(viewFilter === 'hoje') return a.appointment_date === today;
    if(viewFilter === 'semana') {
       const weekEnd = new Date(); weekEnd.setDate(now.getDate() + 7);
       return d >= now && d <= weekEnd;
    }
    if(viewFilter === 'mes') return d.getMonth() === now.getMonth();
    return true; // geral
  });

  if(internFilter !== 'todos') filtered = filtered.filter(a => a.interns.id === internFilter);

  const wrap = document.getElementById('agendaTableWrap');
  wrap.innerHTML = `<table><tr><th>Data</th><th>Horário</th><th>Paciente</th><th>Estagiário</th></tr>
  ${filtered.map(a => `<tr><td>${a.appointment_date}</td><td>${a.start_time.slice(0,5)}</td><td>${a.patients?.full_name}</td><td>${a.interns?.full_name}</td></tr>`).join('')}
  </table>`;
}

// ... [Adicionar lógica de abrir o Modal pré-preenchido mantida do anterior] ...
</script>
</body>
</html>
