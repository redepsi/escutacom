<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:min(420px,100%);background:#fff;border:1px solid #e5e9ef;border-radius:16px;padding:34px;box-shadow:0 12px 35px rgba(23,32,51,.07)}
.brand{text-align:center;margin-bottom:28px}.brand h1{margin:0;color:#315c8c;font-size:25px}.brand p{color:#667085;font-size:13px;margin:8px 0 0}
.field{margin-bottom:16px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input, .field select{width:100%;padding:12px;border:1px solid #d5dbe4;border-radius:9px;font-size:14px;outline:none;background:#fff}.field input:focus, .field select:focus{border-color:#315c8c}
.btn{width:100%;border:0;background:#315c8c;color:#fff;padding:12px 14px;border-radius:9px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.6;cursor:not-allowed}
.message{display:none;margin-top:14px;padding:11px 12px;border-radius:8px;font-size:13px}.message.error{display:block;background:#fdecec;color:#b42318}.message.success{display:block;background:#e8f5ee;color:#2f855a}
.app{display:none;min-height:100vh}.side{width:240px;background:#fff;border-right:1px solid #e5e9ef;padding:24px 14px}.logo{font-weight:800;font-size:18px;margin:0 12px 28px}.logo span{color:#315c8c}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;border-radius:9px;margin:4px 0;color:#475467;font-size:14px;cursor:pointer}.nav button.active{background:#e8f0f8;color:#315c8c;font-weight:700}
.main{flex:1;padding:28px 36px;max-width:1550px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:26px}.profile{display:flex;align-items:center;gap:10px}.profile select,.context-select{padding:10px 14px;border:1px solid #d5dbe4;border-radius:9px;background:#fff;font-weight:700}.user{background:#fff;border:1px solid #e5e9ef;padding:10px 14px;border-radius:9px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.card,.panel,.hero{background:#fff;border:1px solid #e5e9ef;border-radius:12px}.card{padding:18px}.card small{color:#667085}.card strong{display:block;font-size:26px;margin-top:8px}.panel{padding:20px;margin-bottom:20px}.panel h2{font-size:17px;margin:0 0 16px}.hero{padding:22px;margin-bottom:20px}.hero h2{margin:0 0 6px}.hero p{margin:0;color:#667085}.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}.toolbar .right{margin-left:auto;display:flex;gap:8px}.action{border:0;background:#315c8c;color:#fff;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer}.secondary{background:#fff;color:#315c8c;border:1px solid #cbd6e2}.notice{padding:12px 14px;border-radius:8px;background:#fff5d8;color:#6b4b00;font-size:13px;margin-bottom:14px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.green{background:#e8f5ee;color:#2f855a}.yellow{background:#fff5d8;color:#9a6700}.red{background:#fdecec;color:#b42318}.gray{background:#f1f3f6;color:#667085}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid #e9edf2;font-size:13px}th{font-size:11px;color:#667085;background:#fafbfc}.hidden{display:none}
@media(max-width:850px){.side{display:none}.main{padding:20px}.cards{grid-template-columns:repeat(2,1fr)}}

.ec-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ec-card{background:#fff;border:1px solid #e6e8ec;border-radius:14px;padding:16px}
.ec-card h3{margin:0 0 6px}.ec-muted{font-size:12px;color:#667085}
.ec-calendar{display:grid;grid-template-columns:80px repeat(6,1fr);border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;background:#fff;}
.ec-calendar>div{padding:10px;border-right:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;min-height:68px}
.ec-head{background:#f8fafc;font-weight:700;text-align:center;min-height:48px!important;display:flex;align-items:center;justify-content:center;}
.ec-open{background:#e9f7ef;border-radius:9px;font-weight:700;cursor:pointer;color:#176b36;border:1px solid #bce3cc;}
.ec-closed{background:#f3f4f6;color:#98a2b3;border-radius:9px;cursor:pointer;border:1px solid #e5e7eb;}
.ec-appt{border-radius:9px;padding:9px!important;min-height:58px!important}
.ec-confirmed{background:#e9f7ef}.ec-wait{background:#fff4d6}.ec-no{background:#fdecec}
.ec-appt strong,.ec-appt span,.ec-appt small{display:block}
.ec-appt span{font-size:12px;margin-top:3px}.ec-appt small{font-size:11px;color:#667085;margin-top:2px}
.ec-pills{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.ec-pill{padding:7px 10px;border-radius:999px;background:#f2f4f7;font-size:12px}
.ec-pill.active{background:#e7f3ec;color:#176b36;font-weight:700}
.ec-status{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700}
.ec-green{background:#e7f3ec;color:#176b36}.ec-yellow{background:#fff4d6;color:#8a5b00}.ec-red{background:#fdecec;color:#a12b2b}.ec-gray{background:#eef0f2;color:#475467}
.ec-modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.ec-modal-box{background:white;border-radius:16px;padding:24px;width:min(900px,100%);max-height:90vh;overflow:auto}
.ec-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
@media(max-width:900px){.ec-grid{grid-template-columns:1fr}.ec-calendar{grid-template-columns:65px repeat(6,minmax(120px,1fr))}}

.ec-toggle-slot{
  width:100%;
  min-height:48px;
  font:inherit;
  text-align:center;
  cursor:pointer;
  padding:10px;
  border-radius:9px;
  transition: 0.1s;
}
.ec-toggle-slot:hover{filter:brightness(.97);transform:translateY(-1px)}
.ec-toggle-slot:active{transform:translateY(0)}

button,.action,select,input{cursor:pointer}.ec-toggle-slot{pointer-events:auto!important}

#loadingScreen { display: flex; flex-direction: column; gap: 12px; }
.spinner { border: 3px solid #f3f3f3; border-top: 3px solid #315c8c; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>

<script>
// =========================================================================
// CHAVES DO SUPABASE
// =========================================================================
const SUPABASE_URL = 'https://bhgwzqkdhbgfrlhcveqg.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_l8XeXHqjK6yRwFHjquGadg_e0PpDNXn';
// =========================================================================

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const loadingScreen = document.getElementById('loadingScreen');
const loginScreen = document.getElementById('loginScreen');
const app = document.getElementById('app');
const loginForm = document.getElementById('loginForm');
const loginButton = document.getElementById('loginButton');
const loginMessage = document.getElementById('loginMessage');
const logoutButton = document.getElementById('logoutButton');
const contextSelect = document.getElementById('contextSelect');
const userName = document.getElementById('userName');
const content = document.getElementById('content');
const nav = document.getElementById('nav');
const title = document.getElementById('title');

let currentProfile = null;
let currentIntern = null;
let currentPage = 'dashboard';
let currentContext = 'coordenacao';

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

// -------------------------------------------------------------------------
// COMPONENTE: GRADE DE DISPONIBILIDADE
// -------------------------------------------------------------------------
function generateAvailabilityGrid(clinicSlots, userSlots) {
  const days = [{n:1, l:'Seg'},{n:2, l:'Ter'},{n:3, l:'Qua'},{n:4, l:'Qui'},{n:5, l:'Sex'},{n:6, l:'Sáb'}];
  // Pega apenas os horários de início que a clínica liberou em pelo menos um dia
  const enabledTimes = [...new Set((clinicSlots||[]).map(s => s.start_time.slice(0,5)))].sort();
  
  if(enabledTimes.length === 0) {
      return `<div style="grid-column: 1/-1; padding: 20px; text-align: center;">Nenhum horário liberado pela clínica. Verifique o Quadro de Horários.</div>`;
  }

  let html = `<div class="ec-head">Horário</div>` + days.map(d=>`<div class="ec-head">${d.l}</div>`).join('');
  
  enabledTimes.forEach(time => {
     const hourInt = parseInt(time.split(':')[0]);
     const endHour = String(hourInt+1).padStart(2,'0') + ':00';
     html += `<div><strong>${time} – ${endHour.split(':')[0]}h</strong></div>`;
     
     days.forEach(d => {
        // Verifica se a clínica abriu neste dia e neste horário
        const cSlot = clinicSlots.find(s => s.weekday === d.n && s.start_time.slice(0,5) === time);
        if(cSlot) {
           // Se abriu, verifica se o usuário (paciente/estagiário) marcou como disponível
           const isSelected = userSlots.some(s => s.weekday === d.n && s.start_time.slice(0,5) === time);
           const cssClass = isSelected ? 'ec-open' : 'ec-closed';
           const text = isSelected ? '✓ Disponível' : 'Livre';
           html += `<button type="button" class="${cssClass} ec-toggle-slot avail-slot" data-day="${d.n}" data-start="${time}:00" data-end="${endHour}:00">${text}</button>`;
        } else {
           html += `<div style="background:#f9fafb; color:#d0d5dd; font-size:11px; text-align:center; display:flex; align-items:center; justify-content:center; border-radius:9px; border:1px dashed #e5e7eb;">Fechado pela clínica</div>`;
        }
     });
  });
  return html;
}

// -------------------------------------------------------------------------
// PÁGINA: ESTAGIÁRIOS
// -------------------------------------------------------------------------
const internListPage = async () => {
  content.innerHTML = `
    <section class="panel">
      <div class="toolbar"><h2>Estagiários</h2>
        <div class="right"><button id="newInternBtn" class="action">+ Novo estagiário</button></div>
      </div>
      <div id="internLoading" class="notice">Carregando estagiários...</div>
      <div id="internTableWrap"></div>
    </section>
    <section id="internFormPanel" class="panel hidden">
      <div class="toolbar"><h2 id="internFormTitle">Novo estagiário</h2></div>
      <div class="formgrid">
        <div class="field"><label>Nome</label><input id="newInternName" placeholder="Nome completo"></div>
        <div class="field"><label>Matrícula</label><input id="newInternRegistration" placeholder="Matrícula"></div>
        <div class="field"><label>WhatsApp</label><input id="newInternWhatsapp" placeholder="(85) 99999-9999"></div>
        <div class="field"><label>Período / semestre</label><input id="newInternSemester" type="number" min="1" max="20" placeholder="8"></div>
        <div class="field"><label>Abordagens de preferência (opcional)</label><input id="newInternApproaches" placeholder="Ex: TCC, Psicanálise"></div>
        <div class="field"><label>Público de preferência (opcional)</label><input id="newInternAudience" placeholder="Ex: Adultos, Adolescentes"></div>
        <div class="field"><label>Status</label><select id="newInternStatus"><option value="ativo">Ativo</option><option value="inativo">Inativo</option></select></div>
      </div>
      <div style="margin-top:14px"><button id="saveInternBtn" class="action">Salvar estagiário</button> <button id="cancelInternBtn" class="action secondary">Cancelar</button></div>
      <div id="internFormMessage" class="message"></div>
    </section>`;

  const loading = document.getElementById('internLoading');
  const wrap = document.getElementById('internTableWrap');

  const { data, error } = await db.from('interns').select('*').order('full_name');

  if (error) {
    loading.className='message error'; loading.style.display='block';
    loading.textContent='Não foi possível carregar: '+error.message; return;
  }
  loading.remove();

  const rows=(data||[]).map(i=>{
    const status=i.status==='ativo'?'<span class="badge green">Ativo</span>':'<span class="badge red">Inativo</span>';
    const access=i.user_id?'<span class="badge green">Conta vinculada</span>':'<span class="badge yellow">Sem acesso</span>';
    return `<tr><td><strong>${escapeHtml(i.full_name)}</strong></td><td>${escapeHtml(i.registration_number)}</td><td>${i.current_semester}º</td><td>${escapeHtml(i.whatsapp||'—')}</td><td>${access}</td><td>${status}</td><td><button class="action secondary edit-intern" data-id="${i.id}" style="padding:7px 10px">Editar</button></td></tr>`;
  }).join('');

  wrap.innerHTML=`<div style="overflow:auto"><table><tr><th>Nome</th><th>Matrícula</th><th>Sem.</th><th>WhatsApp</th><th>Acesso</th><th>Status</th><th>Ações</th></tr>${rows||'<tr><td colspan="7">Nenhum estagiário cadastrado.</td></tr>'}</table></div>`;

  const panel=document.getElementById('internFormPanel'), titleForm=document.getElementById('internFormTitle');
  let editingId=null;
  const reset=()=>{
    editingId=null; titleForm.textContent='Novo estagiário';
    ['Name','Registration','Whatsapp','Semester','Approaches','Audience'].forEach(x=>{const e=document.getElementById('newIntern'+x);if(e)e.value=''});
    document.getElementById('newInternStatus').value='ativo'; document.getElementById('internFormMessage').style.display='none';
  };

  document.getElementById('newInternBtn').onclick=()=>{reset();panel.classList.remove('hidden');panel.scrollIntoView({behavior:'smooth'})};
  document.getElementById('cancelInternBtn').onclick=()=>{panel.classList.add('hidden');reset()};

  wrap.querySelectorAll('.edit-intern').forEach(btn=>btn.onclick=()=>{
    const i=(data||[]).find(x=>x.id===btn.dataset.id); if(!i)return;
    editingId=i.id; titleForm.textContent='Editar estagiário';
    document.getElementById('newInternName').value=i.full_name||'';
    document.getElementById('newInternRegistration').value=i.registration_number||'';
    document.getElementById('newInternWhatsapp').value=i.whatsapp||'';
    document.getElementById('newInternSemester').value=i.current_semester||'';
    document.getElementById('newInternApproaches').value=i.preferred_approaches||'';
    document.getElementById('newInternAudience').value=i.preferred_audience||'';
    document.getElementById('newInternStatus').value=i.status||'ativo';
    panel.classList.remove('hidden'); panel.scrollIntoView({behavior:'smooth'});
  });

  document.getElementById('saveInternBtn').onclick=async()=>{
    const btn=document.getElementById('saveInternBtn'),msg=document.getElementById('internFormMessage');
    btn.disabled=true; btn.textContent='Salvando...'; msg.style.display='none';
    const payload={
      full_name:document.getElementById('newInternName').value.trim(),
      registration_number:document.getElementById('newInternRegistration').value.trim(),
      whatsapp:document.getElementById('newInternWhatsapp').value.trim(),
      current_semester:Number(document.getElementById('newInternSemester').value),
      preferred_approaches:document.getElementById('newInternApproaches').value.trim()||null,
      preferred_audience:document.getElementById('newInternAudience').value.trim()||null,
      status:document.getElementById('newInternStatus').value
    };
    if(!payload.full_name||!payload.registration_number){
      msg.textContent='Preencha nome e matrícula.';msg.className='message error';msg.style.display='block';btn.disabled=false;btn.textContent='Salvar';return;
    }
    const result=editingId?await db.from('interns').update(payload).eq('id',editingId):await db.from('interns').insert([payload]);
    if(result.error){msg.textContent='Erro ao salvar: '+result.error.message;msg.className='message error';msg.style.display='block';btn.disabled=false;btn.textContent='Salvar';return;}
    await internListPage();
  };
};

// -------------------------------------------------------------------------
// PÁGINA: PACIENTES (Com Grade de Disponibilidade)
// -------------------------------------------------------------------------
const ecPrototypePatients = async () => {
  content.innerHTML=`
  <section class="panel"><div class="toolbar"><div><h2>Pacientes</h2><div class="ec-muted">Cadastro e disponibilidade dos pacientes.</div></div><button class="action" id="ecNewPatient">+ Novo paciente</button></div>
  <div id="patientMsg" class="message"></div>
  <table>
    <thead><tr><th>Inscrição</th><th>Nome</th><th>Idade</th><th>Gênero</th><th>Status</th></tr></thead>
    <tbody id="patientsTableBody"><tr><td colspan="5">Carregando pacientes...</td></tr></tbody>
  </table>
  </section>
  <div class="ec-modal" id="ecPatientModal"><div class="ec-modal-box">
    <div class="toolbar"><h2 id="patientModalTitle">Novo paciente</h2><button class="action secondary" id="ecPatientClose">Fechar</button></div>
    <div class="formgrid">
      <div class="field"><label>Número de inscrição *</label><input id="patReg" placeholder="Ex.: 00342"></div>
      <div class="field"><label>Nome</label><input id="patName" placeholder="Opcional"></div>
      <div class="field"><label>Idade</label><input id="patAge" type="number" min="0"></div>
      <div class="field"><label>Gênero</label><select id="patGender"><option>Mulher cisgênero</option><option>Homem cisgênero</option><option>Mulher transgênero</option><option>Homem transgênero</option><option>Pessoa não binária</option><option>Outra identidade</option><option>Prefiro não informar</option></select></div>
      <div class="field"><label>Status</label><select id="patStatus"><option value="ativo">Ativo</option><option value="inativo">Inativo</option></select></div>
    </div>
    
    <div style="margin-top:24px; padding-top:20px; border-top:1px solid #e5e9ef;">
      <h3 style="margin:0 0 6px; font-size:15px;">Disponibilidade Semanal (Opcional)</h3>
      <p class="ec-muted" style="margin:0 0 16px;">Marque abaixo os horários em que o paciente pode comparecer. Apenas horários liberados pela clínica são exibidos.</p>
      <div class="ec-calendar" id="patAvailGrid">Carregando grade...</div>
    </div>

    <div class="ec-actions"><button class="action secondary" id="ecPatientCancel">Cancelar</button><button class="action" id="ecPatientSave">Salvar paciente</button></div>
  </div></div>`;

  const m=document.getElementById('ecPatientModal');
  const tbody=document.getElementById('patientsTableBody');
  const msg=document.getElementById('patientMsg');
  let editingPatientId = null;

  // Carrega os horários da clínica que estão ativos
  const { data: clinicSlots } = await db.from('clinic_schedule_slots').select('*').eq('enabled', true);

  const loadPatients = async () => {
     const {data, error} = await db.from('patients').select('*').order('created_at', {ascending: false});
     if(error) { tbody.innerHTML=`<tr><td colspan="5">Erro: ${error.message}</td></tr>`; return data; }
     if(!data || data.length===0) { tbody.innerHTML=`<tr><td colspan="5">Nenhum paciente cadastrado.</td></tr>`; return data; }
     tbody.innerHTML = data.map(p => {
        const badge = p.status === 'ativo' ? 'ec-green' : 'ec-gray';
        return `<tr>
          <td><strong>${escapeHtml(p.registration_number)}</strong></td>
          <td>${escapeHtml(p.full_name||'—')}</td>
          <td>${p.age||'—'}</td>
          <td>${escapeHtml(p.gender||'—')}</td>
          <td><span class="ec-status ${badge}">${p.status}</span> <button class="action secondary edit-patient" data-id="${p.id}" style="padding:4px 8px; margin-left:10px; font-size:11px;">Editar</button></td>
        </tr>`;
     }).join('');
     return data;
  };
  
  const allPatients = await loadPatients();

  const resetForm = () => {
    editingPatientId = null;
    document.getElementById('patientModalTitle').textContent = 'Novo paciente';
    document.getElementById('patReg').value='';
    document.getElementById('patName').value='';
    document.getElementById('patAge').value='';
    document.getElementById('patGender').value='Mulher cisgênero';
    document.getElementById('patStatus').value='ativo';
    // Limpa a grade
    document.getElementById('patAvailGrid').innerHTML = generateAvailabilityGrid(clinicSlots, []);
  };

  document.getElementById('ecNewPatient').onclick=()=>{ resetForm(); m.style.display='flex'; };
  document.getElementById('ecPatientClose').onclick=()=>m.style.display='none';
  document.getElementById('ecPatientCancel').onclick=()=>m.style.display='none';
  
  tbody.addEventListener('click', async (e) => {
    if(e.target.classList.contains('edit-patient')) {
      const p = allPatients.find(x => x.id === e.target.dataset.id);
      if(!p) return;
      resetForm();
      editingPatientId = p.id;
      document.getElementById('patientModalTitle').textContent = 'Editar paciente';
      document.getElementById('patReg').value = p.registration_number || '';
      document.getElementById('patName').value = p.full_name || '';
      document.getElementById('patAge').value = p.age || '';
      document.getElementById('patGender').value = p.gender || 'Prefiro não informar';
      document.getElementById('patStatus').value = p.status || 'ativo';

      // Busca a disponibilidade salva do paciente
      const { data: pAvail } = await db.from('patient_availability').select('*').eq('patient_id', p.id);
      document.getElementById('patAvailGrid').innerHTML = generateAvailabilityGrid(clinicSlots, pAvail || []);

      m.style.display='flex';
    }
  });

  document.getElementById('ecPatientSave').onclick=async()=>{
    const btn = document.getElementById('ecPatientSave');
    btn.disabled = true; btn.textContent = 'Salvando...';
    
    const payload = {
      registration_number: document.getElementById('patReg').value.trim(),
      full_name: document.getElementById('patName').value.trim() || null,
      age: document.getElementById('patAge').value ? parseInt(document.getElementById('patAge').value) : null,
      gender: document.getElementById('patGender').value,
      status: document.getElementById('patStatus').value
    };
    
    if(!payload.registration_number) { alert('Número de inscrição é obrigatório.'); btn.disabled=false; btn.textContent='Salvar paciente'; return; }

    // Salva ou atualiza os dados principais do paciente
    const patientResult = editingPatientId 
        ? await db.from('patients').update(payload).eq('id', editingPatientId).select().single()
        : await db.from('patients').insert([payload]).select().single();

    if(patientResult.error) { 
        alert('Erro ao salvar paciente: '+patientResult.error.message); 
        btn.disabled=false; btn.textContent='Salvar paciente'; return; 
    }

    const savedPatientId = patientResult.data.id;

    // Lida com a Grade de Disponibilidade
    // 1. Pega os horários marcados na tela
    const selectedSlots = Array.from(document.querySelectorAll('#patAvailGrid .ec-open')).map(btn => ({
        patient_id: savedPatientId,
        weekday: parseInt(btn.dataset.day),
        start_time: btn.dataset.start,
        end_time: btn.dataset.end
    }));

    // 2. Apaga a disponibilidade antiga
    await db.from('patient_availability').delete().eq('patient_id', savedPatientId);
    
    // 3. Insere a nova disponibilidade (se houver)
    if(selectedSlots.length > 0) {
        await db.from('patient_availability').insert(selectedSlots);
    }

    m.style.display='none'; 
    await loadPatients(); 
    btn.disabled=false; btn.textContent='Salvar paciente';
  };
};

  }

  content.innerHTML = `

          <h2>Minha disponibilidade</h2>
          <div class="subtle">Marque os horários em que você pode realizar atendimentos. Apenas os horários liberados pela clínica estão disponíveis para seleção.</div>
        </div>

      </div>
      <div id="internAvailMsg" class="message"></div>
      <div class="ec-calendar" id="internAvailGrid">
        <div style="grid-column: 1/-1; padding: 20px; text-align: center;">Carregando grade...</div>
      </div>
    </section>`;

  const grid = document.getElementById('internAvailGrid');
  const msg = document.getElementById('internAvailMsg');

  // Busca os horários da clínica e os que o estagiário já havia marcado
  const { data: clinicSlots } = await db.from('clinic_schedule_slots').select('*').eq('enabled', true);
  const { data: mySlots } = await db.from('intern_availability').select('*').eq('intern_id', currentIntern.id);

  grid.innerHTML = generateAvailabilityGrid(clinicSlots, mySlots || []);

  document.getElementById('saveMyAvailBtn').onclick = async () => {
     const btn = document.getElementById('saveMyAvailBtn');
     btn.disabled = true; btn.textContent = 'Salvando...'; msg.style.display = 'none';

     // Pega os horários selecionados
     const selectedSlots = Array.from(document.querySelectorAll('#internAvailGrid .ec-open')).map(b => ({
         intern_id: currentIntern.id,
         weekday: parseInt(b.dataset.day),
         start_time: b.dataset.start,
         end_time: b.dataset.end
     }));

     // Apaga os velhos e insere os novos
     const { error: delErr } = await db.from('intern_availability').delete().eq('intern_id', currentIntern.id);
     if(delErr) {
         msg.textContent = 'Erro ao limpar grade: ' + delErr.message; msg.className = 'message error'; msg.style.display = 'block';
         btn.disabled = false; btn.textContent = 'Salvar minha disponibilidade'; return;
     }

     if(selectedSlots.length > 0) {
         const { error: insErr } = await db.from('intern_availability').insert(selectedSlots);
         if(insErr) {
             msg.textContent = 'Erro ao salvar horários: ' + insErr.message; msg.className = 'message error'; msg.style.display = 'block';
             btn.disabled = false; btn.textContent = 'Salvar minha disponibilidade'; return;
         }
     }

     msg.textContent = 'Sua disponibilidade foi salva com sucesso.'; msg.className = 'message success'; msg.style.display = 'block';
     btn.disabled = false; btn.textContent = 'Salvar minha disponibilidade';
  };
};

const ecPrototypeSettings = async () => {
  content.innerHTML=`
  <section class="panel"><div class="toolbar"><div><h2>Quadro de horários da clínica</h2><div class="ec-muted">A coordenação define quais intervalos ficam liberados.</div></div><button class="action" id="ecSaveSchedule">Salvar quadro</button></div>
  <div id="scheduleMsg" class="message"></div>
  <div class="notice">Clique para alternar entre <strong>🟢 Liberado</strong> e <strong>⚪ Fechado</strong>. Os estagiários e pacientes só verão os horários liberados para montar suas disponibilidades.</div>
  <div class="ec-calendar" id="scheduleGrid">
    <div style="grid-column: 1/-1; padding: 20px; text-align: center;">Carregando horários do Supabase...</div>
  </div></section>`;

  const grid = document.getElementById('scheduleGrid');
  const msg = document.getElementById('scheduleMsg');

  const {data: slots, error} = await db.from('clinic_schedule_slots').select('*');
  if(error) { grid.innerHTML = `<div style="grid-column: 1/-1; padding: 20px; text-align: center; color: red;">Erro ao carregar: ${error.message}</div>`; return; }

  const days = [{n:1, l:'Segunda'},{n:2, l:'Terça'},{n:3, l:'Quarta'},{n:4, l:'Quinta'},{n:5, l:'Sexta'},{n:6, l:'Sábado'}];
  const uniqueTimes = [...new Set((slots||[]).map(s => s.start_time.slice(0,5)))].sort();
  
  if(uniqueTimes.length === 0) {
      grid.innerHTML = `<div style="grid-column: 1/-1; padding: 20px; text-align: center;">Nenhum horário gerado no banco. Rode o script SQL.</div>`;
      return;
  }

  let html = `<div class="ec-head">Horário</div>` + days.map(d=>`<div class="ec-head">${d.l}</div>`).join('');
  
  uniqueTimes.forEach(time => {
     const hourInt = parseInt(time.split(':')[0]);
     const endHour = String(hourInt+1).padStart(2,'0') + ':00';
     html += `<div><strong>${time.split(':')[0]}h – ${endHour.split(':')[0]}h</strong></div>`;
     days.forEach(d => {
        const slot = slots.find(s => s.weekday === d.n && s.start_time.slice(0,5) === time);
        if(slot) {
           const cssClass = slot.enabled ? 'ec-open' : 'ec-closed';
           const text = slot.enabled ? '🟢 Liberado' : '⚪ Fechado';
           html += `<button type="button" class="${cssClass} ec-toggle-slot" data-id="${slot.id}">${text}</button>`;
        } else {
           html += `<div></div>`;
        }
     });
  });
  grid.innerHTML = html;

  document.getElementById('ecSaveSchedule').onclick = async () => {
     const btn = document.getElementById('ecSaveSchedule');
     btn.disabled = true; btn.textContent = 'Salvando...';
     msg.style.display = 'none';

     const updates = Array.from(document.querySelectorAll('.ec-toggle-slot')).map(b => ({
         id: b.dataset.id,
         enabled: b.classList.contains('ec-open')
     }));

     const {error} = await db.from('clinic_schedule_slots').upsert(updates);
     
     if(error) { 
         msg.textContent = 'Erro ao salvar o quadro: ' + error.message; 
         msg.className = 'message error'; msg.style.display = 'block';
     } else {
         msg.textContent = 'Quadro de horários atualizado com sucesso!';
         msg.className = 'message success'; msg.style.display = 'block';
     }
     btn.disabled = false; btn.textContent = 'Salvar quadro';
  };
};

// -------------------------------------------------------------------------
// MOTOR PRINCIPAL (Login e Navegação)
// -------------------------------------------------------------------------
function showMessage(text, type='error') {
  loginMessage.textContent = text;
  loginMessage.className = 'message ' + type;
}

async function loadProfile(user) {
  const { data: profile, error: profileError } = await db.from('profiles').select('id, full_name, role').eq('id', user.id).single();
  if (profileError) throw new Error('Erro ao carregar perfil.');

  currentProfile = profile;

  const { data: intern } = await db.from('interns').select('*').eq('user_id', user.id).maybeSingle();
  currentIntern = intern;
  
  userName.textContent = `${profile.full_name} • ${profile.role === 'coordenador_agenda' ? 'Coordenação' : 'Estagiário'}`;

  const canCoordinate = profile.role === 'coordenador_agenda' || profile.role === 'coordenador_projeto';
  const canIntern = !!intern;

  contextSelect.style.display = (canCoordinate && canIntern) ? 'block' : 'none';
  currentContext = canCoordinate ? 'coordenacao' : 'estagiario';
  contextSelect.value = currentContext;
  currentPage = 'dashboard';
  
  loadingScreen.style.display = 'none';
  loginScreen.style.display = 'none';
  app.style.display = 'flex';
  
  updateContextNavigation();
  render();
}

function updateContextNavigation() {
  const pages = currentContext === 'coordenacao' 
    ? ['dashboard', 'agenda', 'estagiarios', 'pacientes', 'relatorio', 'regras_horario'] 
    : ['dashboard', 'meus', 'disponibilidade'];
  buildNav(pages);
}

function buildNav(pages) {
  const labels = {
    dashboard:'Dashboard', agenda:'Agenda', estagiarios:'Estagiários',
    pacientes:'Pacientes', relatorio:'Relatórios', regras_horario:'Configurações',
    disponibilidade:'Minha disponibilidade', meus:'Meus agendamentos'
  };
  nav.innerHTML = pages.map(p => `<button data-page="${p}">${labels[p] || p}</button>`).join('');
  nav.querySelectorAll('button').forEach(button => {
    button.addEventListener('click', () => { currentPage = button.dataset.page; render(); });
  });
}

function render() {
  if (currentContext === 'coordenacao') {
    if (currentPage === 'agenda') { ecPrototypeAgenda(); return; }
    if (currentPage === 'pacientes') { ecPrototypePatients(); return; }
    if (currentPage === 'relatorio' || currentPage === 'relatorios') { ecPrototypeReports(); return; }
    if (currentPage === 'regras_horario' || currentPage === 'configuracoes') { ecPrototypeSettings(); return; }
    if (currentPage === 'estagiarios') { internListPage(); return; }
  } else {
    if (currentPage === 'disponibilidade') { availabilityPage(); return; }
  }
  
  const pages = currentContext === 'coordenacao' ? coordinatorPages : internPages;
  content.innerHTML = pages[currentPage] || pages.dashboard;
  title.textContent = ({
    dashboard:'Dashboard',agenda:'Agenda',estagiarios:'Estagiários',
    pacientes:'Pacientes',relatorio:'Relatórios',
    disponibilidade:'Minha disponibilidade',
    regras_horario:'Configurações',meus:'Meus agendamentos'
  })[currentPage] || 'Dashboard';
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.page === currentPage));
  bindSimplePageActions();
}

function bindSimplePageActions(){
  document.querySelectorAll('.confirmMock').forEach(b=>b.onclick=()=>{b.outerHTML='<span class="badge green">Confirmado</span>';});
  document.getElementById('dashboardAgendaBtn')?.addEventListener('click',()=>{currentPage='agenda';render();});
  document.getElementById('internAppointmentsBtn')?.addEventListener('click',()=>{currentPage='meus';render();});
}

loginForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  loginButton.disabled = true; loginButton.textContent = 'Entrando...'; loginMessage.className = 'message';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const { data, error } = await db.auth.signInWithPassword({ email, password });
  if (error) { showMessage('Não foi possível entrar. Confira o e-mail e a senha.'); loginButton.disabled = false; loginButton.textContent = 'Entrar'; return; }
  try { await loadProfile(data.user); } 
  catch (e) { await db.auth.signOut(); showMessage(e.message || 'Erro ao carregar perfil.'); }
  loginButton.disabled = false; loginButton.textContent = 'Entrar';
});

contextSelect.addEventListener('change', () => {
  currentContext = contextSelect.value; currentPage = 'dashboard';
  updateContextNavigation(); render();
  userName.textContent = currentContext === 'coordenacao'
    ? `${currentProfile.full_name} • Coordenação da agenda`
    : `${currentProfile.full_name} • Estagiário`;
});

logoutButton.addEventListener('click', async () => {
  await db.auth.signOut();
  app.style.display = 'none'; loadingScreen.style.display = 'none'; loginScreen.style.display = 'flex';
  loginForm.reset(); showMessage('Você saiu do sistema.', 'success');
});

// Eventos Globais de cliques dinâmicos
document.addEventListener('click', (event) => {
  const toggle = event.target.closest('.ec-toggle-slot');
  if(toggle){
    const open = toggle.classList.contains('ec-open');
    toggle.classList.toggle('ec-open', !open);
    toggle.classList.toggle('ec-closed', open);
    
    // Altera o texto dependendo se é a grade da clínica ou a grade de disponibilidade
    if(toggle.classList.contains('avail-slot')) {
       toggle.textContent = open ? 'Livre' : '✓ Disponível';
    } else {
       toggle.textContent = open ? '⚪ Fechado' : '🟢 Liberado';
    }
    return;
  }
  const view = event.target.closest('.ec-view');
  if(view){
    document.querySelectorAll('.ec-view').forEach(b=>b.classList.remove('active'));
    view.classList.add('active');
    return;
  }
});

(async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (session?.user) {
    try { await loadProfile(session.user); } 
    catch (e) {
      await db.auth.signOut(); loadingScreen.style.display = 'none'; loginScreen.style.display = 'flex';
      showMessage(e.message || 'Erro ao carregar perfil.');
    }
  } else {
    loadingScreen.style.display = 'none'; loginScreen.style.display = 'flex';
  }
})();
</script>
