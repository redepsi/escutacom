      msgEl.textContent = 'Esse dia/horário já foi adicionado.';
      msgEl.className = 'message error'; msgEl.style.display = 'block';
      return;
    }
    const existsInGrid = (clinicSlotsCache || []).some(s => s.weekday === weekday && s.start_time.slice(0, 5) === start);
    if (existsInGrid) {
      msgEl.textContent = 'Esse horário já existe na grade acima — use os botões dela em vez desta lista.';
      msgEl.className = 'message error'; msgEl.style.display = 'block';
      return;
    }
    futureAvailEntries.push({ weekday, start_time: start, end_time: end });
    renderFutureAvailList();
  });

  async function openForm(patient) {
    resetForm();
    if (patient) {
      editingId = patient.id;
      originalStatus = patient.status;
      formTitle.textContent = 'Editar paciente';
      document.getElementById('pReg').value = patient.registration_number || '';
      document.getElementById('pName').value = patient.full_name || '';
      document.getElementById('pWhatsapp').value = patient.whatsapp || '';
      document.getElementById('pOrigin').value = patient.origin || '';
      document.getElementById('pNotes').value = patient.notes || '';
      document.getElementById('pStatus').value = patient.status || 'ativo';

      const { data: pAvail } = await db.from('patient_availability').select('*').eq('patient_id', patient.id);
      const enabledSet = new Set((clinicSlotsCache || []).filter(c => c.enabled).map(c => `${c.weekday}_${c.start_time.slice(0, 5)}`));
      const gridSlots = (pAvail || []).filter(a => enabledSet.has(`${a.weekday}_${a.start_time.slice(0, 5)}`));
      futureAvailEntries = (pAvail || [])
        .filter(a => !enabledSet.has(`${a.weekday}_${a.start_time.slice(0, 5)}`))
        .map(a => ({ weekday: a.weekday, start_time: a.start_time, end_time: a.end_time }));

      availGridEl.innerHTML = buildAvailabilityGrid(clinicSlotsCache, gridSlots);
      bindAvailabilityToggles(availGridEl);
      renderFutureAvailList();
    }
    panel.style.display = 'flex';
  }

  document.getElementById('newPatientBtn').addEventListener('click', () => openForm(null));
  document.getElementById('cancelPatientBtn').addEventListener('click', () => { panel.style.display = 'none'; });

  // ---- Exportar listas em PDF ----
  document.getElementById('exportPatientsPdfBtn').addEventListener('click', () => {
    const rows = lastFilteredPatients.map(p => `
      <tr><td>${escapeHtml(p.registration_number)}</td><td>${escapeHtml(p.full_name || '—')}</td></tr>`).join('');
    const body = `
      <div class="meta">${lastFilteredPatients.length} paciente(s) · gerado em ${new Date().toLocaleDateString('pt-BR')}</div>
      <table><tr><th>Nº de inscrição</th><th>Nome</th></tr>${rows}</table>`;
    exportReportPdf('Lista de pacientes', body);
  });

  document.getElementById('exportPatientsWithInternPdfBtn').addEventListener('click', () => {
    const rows = lastFilteredPatients.map(p => `
      <tr><td>${escapeHtml(p.registration_number)}</td><td>${escapeHtml(p.full_name || '—')}</td><td>${escapeHtml(lastPatientInternByPatientId[p.id] || '—')}</td></tr>`).join('');
    const body = `
      <div class="meta">${lastFilteredPatients.length} paciente(s) · gerado em ${new Date().toLocaleDateString('pt-BR')}</div>
      <table><tr><th>Nº de inscrição</th><th>Nome</th><th>Estagiário</th></tr>${rows}</table>`;
    exportReportPdf('Lista de pacientes com estagiário', body);
  });

  // ---- Importar planilha de pacientes ----
  const importPanel = document.getElementById('importPanel');
  const importMsg = document.getElementById('importMsg');
  const importPreviewWrap = document.getElementById('importPreviewWrap');
  let importRows = [];

  document.getElementById('importPatientsBtn').addEventListener('click', () => {
    importPanel.style.display = importPanel.style.display === 'none' ? 'block' : 'none';
    importMsg.style.display = 'none';
    importPreviewWrap.innerHTML = '';
    document.getElementById('importFileInput').value = '';
    importRows = [];
  });

  function normalizeHeader(h) {
    return String(h || '').trim().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, ''); // remove acentos
  }

  document.getElementById('importFileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    importMsg.style.display = 'none';

    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const workbook = XLSX.read(ev.target.result, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rawRows = XLSX.utils.sheet_to_json(sheet, { defval: '' });

        importRows = rawRows.map(row => {
          const mapped = {};
          Object.keys(row).forEach(key => {
            const norm = normalizeHeader(key);
            if (norm === 'origem') mapped.origin = String(row[key]).trim();
            if (norm === 'nome') mapped.full_name = String(row[key]).trim();
            if (norm === 'whatsapp') mapped.whatsapp = String(row[key]).trim();
          });
          return mapped;
        }).filter(r => r.full_name || r.whatsapp || r.origin);

        if (importRows.length === 0) {
          importMsg.textContent = 'Nenhuma linha reconhecida. Confira se as colunas se chamam origem, nome e whatsapp.';
          importMsg.className = 'message error'; importMsg.style.display = 'block';
          importPreviewWrap.innerHTML = '';
          return;
        }

        const previewRows = importRows.map(r => `<tr>
          <td>${escapeHtml(r.full_name || '—')}</td>
          <td>${escapeHtml(r.whatsapp || '—')}</td>
          <td>${escapeHtml(r.origin || '—')}</td>
        </tr>`).join('');

        importPreviewWrap.innerHTML = `
          <div class="muted" style="margin-bottom:8px">${importRows.length} paciente(s) encontrados na planilha:</div>
          <div style="overflow:auto;max-height:300px">
            <table style="width:100%;border-collapse:collapse;font-size:13px">
              <tr style="text-align:left;font-size:12px;color:#667085"><th>Nome</th><th>WhatsApp</th><th>Origem</th></tr>
              ${previewRows}
            </table>
          </div>
          <button id="confirmImportBtn" class="action" style="margin-top:12px">Importar ${importRows.length} paciente(s)</button>`;

        document.getElementById('confirmImportBtn').addEventListener('click', runImport);
      } catch (err) {
        importMsg.textContent = 'Erro ao ler o arquivo: ' + err.message;
        importMsg.className = 'message error'; importMsg.style.display = 'block';
      }
    };
    reader.readAsArrayBuffer(file);
  });

  async function runImport() {
    const btn = document.getElementById('confirmImportBtn');
    btn.disabled = true;
    let done = 0, failed = 0;

    for (const row of importRows) {
      btn.textContent = `Importando... (${done + failed}/${importRows.length})`;
      const { data: generatedNumber, error: genError } = await db.rpc('next_patient_registration_number');
      if (genError || !generatedNumber) { failed++; continue; }

      const { error: insertError } = await db.from('patients').insert([{
        registration_number: generatedNumber,
        full_name: row.full_name || null,
        whatsapp: row.whatsapp || null,
        origin: row.origin || null,
        status: 'ativo'
      }]);
      if (insertError) failed++; else done++;
    }

    importMsg.textContent = `Importação concluída: ${done} paciente(s) importados${failed > 0 ? `, ${failed} com erro` : ''}.`;
    importMsg.className = failed > 0 ? 'message error' : 'message success';
    importMsg.style.display = 'block';
    importPreviewWrap.innerHTML = '';
    importRows = [];
    document.getElementById('importFileInput').value = '';
    await loadList();
  }

  document.getElementById('savePatientBtn').addEventListener('click', async () => {
    const btn = document.getElementById('savePatientBtn');
    msg.style.display = 'none';

    const fullName = document.getElementById('pName').value.trim() || null;
    const whatsapp = document.getElementById('pWhatsapp').value.trim() || null;
    const origin = document.getElementById('pOrigin').value.trim() || null;
    const notes = document.getElementById('pNotes').value.trim() || null;
    const status = document.getElementById('pStatus').value;

    btn.disabled = true; btn.textContent = 'Salvando...';

    let registration = editingId ? document.getElementById('pReg').value.trim() : null;

    if (!editingId) {
      const { data: generatedNumber, error: genError } = await db.rpc('next_patient_registration_number');
      if (genError || !generatedNumber) {
        msg.textContent = 'Erro ao gerar número de inscrição: ' + (genError ? genError.message : 'tente novamente.');
        msg.className = 'message error'; msg.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Salvar paciente';
        return;
      }
      registration = generatedNumber;
    }

    const payload = { registration_number: registration, full_name: fullName, whatsapp, origin, notes, status };

    const result = editingId
      ? await db.from('patients').update(payload).eq('id', editingId).select().single()
      : await db.from('patients').insert([payload]).select().single();

    if (result.error) {
      msg.textContent = 'Erro ao salvar: ' + result.error.message;
      msg.className = 'message error'; msg.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Salvar paciente';
      return;
    }

    const savedId = result.data.id;
    const selectedSlots = readSelectedSlots(availGridEl).map(s => ({ ...s, patient_id: savedId }));
    const gridKeys = new Set(selectedSlots.map(s => `${s.weekday}_${s.start_time.slice(0, 5)}`));
    const futureSlots = futureAvailEntries
      .filter(s => !gridKeys.has(`${s.weekday}_${s.start_time.slice(0, 5)}`))
      .map(s => ({ ...s, patient_id: savedId }));
    const allSlots = [...selectedSlots, ...futureSlots];

    await db.from('patient_availability').delete().eq('patient_id', savedId);
    if (allSlots.length > 0) await db.from('patient_availability').insert(allSlots);

    // Se o paciente saiu de "ativo" (inativado, pausado ou recebeu alta), oferece cancelar os atendimentos futuros
    // "Em contato" não entra aqui, pois não representa parar o tratamento.
    // "Em contato" e "Sem encaixe" não entram aqui, pois não representam parar um tratamento em curso.
    if (editingId && originalStatus === 'ativo' && status !== 'ativo' && status !== 'em_contato' && status !== 'sem_encaixe') {
      const statusLabel = { inativo: 'inativo', pausado: 'pausado', alta: 'com alta' }[status] || status;
      const confirmCancel = confirm(`Este paciente foi marcado como ${statusLabel}. Deseja cancelar todos os atendimentos futuros dele agora?`);
      if (confirmCancel) {
        const { error: rpcError } = await db.rpc('cancelar_atendimentos_futuros_paciente', { p_patient_id: savedId });
        if (rpcError) alert('Erro ao cancelar atendimentos futuros: ' + rpcError.message);
      }
    }

    panel.style.display = 'none';
    await loadList();
    btn.disabled = false; btn.textContent = 'Salvar paciente';
  });

  resetForm();
  await loadList();

  if (pendingEditPatientId) {
    const p = patientsCache.find(x => x.id === pendingEditPatientId);
    pendingEditPatientId = null;
    if (p) openForm(p);
  }
}

async function renderPatientFicha(patientId, returnPage = 'pacientes') {
  content.innerHTML = `<div class="placeholder">Carregando ficha...</div>`;

  const { data: patient, error: patErr } = await db.from('patients').select('*').eq('id', patientId).single();
  if (patErr) { content.innerHTML = `<div class="message error" style="display:block">Erro: ${escapeHtml(patErr.message)}</div>`; return; }

  const { data: appts } = await db.from('appointments')
    .select('*').eq('patient_id', patientId).order('appointment_date', { ascending: false });

  const internIds = [...new Set((appts || []).map(a => a.intern_id))];
  const { data: profiles } = internIds.length
    ? await db.from('profiles').select('id, full_name').in('id', internIds)
    : { data: [] };
  const nameById = {};
  (profiles || []).forEach(p => { nameById[p.id] = p.full_name; });

  const all = appts || [];
  const totalAgendado = all.filter(a => a.status === 'agendado').length;
  const presentes = all.filter(a => a.attendance_status === 'presente').length;
  const ausentes = all.filter(a => a.attendance_status === 'ausente').length;
  const cancelados = all.filter(a => a.status === 'cancelado').length;

  const todayStr = toDateStr(new Date());
  const nextAppt = all
    .filter(a => a.status === 'agendado' && a.appointment_date >= todayStr)
    .sort((a, b) => a.appointment_date.localeCompare(b.appointment_date) || a.start_time.localeCompare(b.start_time))[0] || null;

  let roomInfo = null;
  if (nextAppt && nextAppt.room) {
    const { data: r } = await db.from('rooms').select('name, address').eq('name', nextAppt.room).maybeSingle();
    roomInfo = r || null;
  }

  const rows = all.map(a => {
    const isCancelled = a.status === 'cancelado';
    const attLabel = { pendente: 'Pendente', presente: 'Presente', ausente: 'Ausente', cancelado: 'Cancelado' }[a.attendance_status];
    const reason = a.cancellation_reason ? CANCELLATION_REASON_LABELS[a.cancellation_reason] || a.cancellation_reason : '';
    return `<tr style="${isCancelled ? 'opacity:.6' : ''}">
      <td style="padding:6px 8px">${fmtBr(a.appointment_date)}</td>
      <td>${a.start_time.slice(0,5)}–${a.end_time.slice(0,5)}</td>
      <td>${escapeHtml(nameById[a.intern_id] || '?')}</td>
      <td>${isCancelled ? '<span style="color:#b42318;font-weight:700">Cancelado</span>' : attLabel}</td>
      <td style="font-size:12px">${isCancelled ? `${a.cancelled_by || ''}${reason ? ' — ' + reason : ''}` : ''}</td>
    </tr>`;
  }).join('');

  const isCoord = currentContext === 'coordenacao';
  const contactedStyle = patient.last_contacted_at ? 'background:#2f855a' : '';
  const contactedLabel = patient.last_contacted_at ? '✓ Contatado' : '💬 Contato';
  const contactedTitle = patient.last_contacted_at ? `Contatado em ${new Date(patient.last_contacted_at).toLocaleString('pt-BR')}` : '';

  content.innerHTML = `
    <section class="panel">
      <div style="display:flex;gap:10px;margin-bottom:14px">
        <button id="backFromFicha" class="action secondary">← Voltar</button>
        ${isCoord ? `<button id="editFromFicha" class="action secondary" data-id="${patient.id}">Editar paciente</button>` : ''}
        <button id="printFichaBtn" class="action secondary">🖨️ Imprimir</button>
      </div>
      <h2 style="margin-top:0">Ficha do paciente #${escapeHtml(patient.registration_number)}</h2>
      <div class="muted" style="margin-bottom:16px">${escapeHtml(patient.full_name || 'Nome não informado')} ${patient.origin ? '· ' + escapeHtml(patient.origin) : ''}</div>
      ${patient.whatsapp ? `<div style="margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        ${(() => { const wa = whatsappLink(patient.whatsapp); return wa ? `<a href="${wa}" target="_blank" rel="noopener">${escapeHtml(patient.whatsapp)}</a>` : escapeHtml(patient.whatsapp); })()}
        ${isCoord ? `<a id="contatoBtn" href="${whatsappContactLink(patient.whatsapp, patient.full_name)}" target="_blank" rel="noopener" class="action"
          style="padding:6px 12px;font-size:12px;text-decoration:none;${contactedStyle}" title="${contactedTitle}">${contactedLabel}</a>` : ''}
        ${isCoord && nextAppt ? `<a href="${whatsappConfirmationLink(patient.whatsapp, patient.full_name, nextAppt, roomInfo, nameById[nextAppt.intern_id])}" target="_blank" rel="noopener" class="action secondary"
          style="padding:6px 12px;font-size:12px;text-decoration:none">📅 Confirmação</a>` : ''}
      </div>` : ''}
      ${patient.notes ? `<div style="margin-bottom:16px;padding:12px;background:#fff5d8;border-radius:8px;font-size:13px"><strong>Observações:</strong> ${escapeHtml(patient.notes)}</div>` : ''}

      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">
        <div class="panel" style="margin-bottom:0;padding:14px"><div class="muted" style="font-size:12px">Agendados (futuros)</div><strong style="font-size:22px">${totalAgendado}</strong></div>
        <div class="panel" style="margin-bottom:0;padding:14px"><div class="muted" style="font-size:12px">Presenças</div><strong style="font-size:22px;color:#2f855a">${presentes}</strong></div>
        <div class="panel" style="margin-bottom:0;padding:14px"><div class="muted" style="font-size:12px">Faltas</div><strong style="font-size:22px;color:#b42318">${ausentes}</strong></div>
        <div class="panel" style="margin-bottom:0;padding:14px"><div class="muted" style="font-size:12px">Cancelados</div><strong style="font-size:22px;color:#9a6700">${cancelados}</strong></div>
      </div>

      ${all.length === 0 ? '<div class="placeholder">Nenhum atendimento registrado para este paciente ainda.</div>' : `
      <div style="overflow:auto">
        <table style="width:100%;border-collapse:collapse">
          <tr style="text-align:left;font-size:12px;color:#667085">
            <th style="padding:6px 8px">Data</th><th>Horário</th><th>Estagiário</th><th>Situação</th><th>Detalhe do cancelamento</th>
          </tr>${rows}
        </table>
      </div>`}
    </section>`;

  document.getElementById('backFromFicha').addEventListener('click', () => { currentPage = returnPage; render(); });

  document.getElementById('printFichaBtn').addEventListener('click', () => {
    const printRows = all.map(a => {
      const isCancelled = a.status === 'cancelado';
      const attLabel = { pendente: 'Pendente', presente: 'Presente', ausente: 'Ausente', cancelado: 'Cancelado' }[a.attendance_status];
      const reason = a.cancellation_reason ? CANCELLATION_REASON_LABELS[a.cancellation_reason] || a.cancellation_reason : '';
      const situacao = isCancelled ? `Cancelado (${a.cancelled_by || ''}${reason ? ' — ' + reason : ''})` : attLabel;
      return `<tr>
        <td>${fmtBr(a.appointment_date)}</td><td>${a.start_time.slice(0,5)}–${a.end_time.slice(0,5)}</td>
        <td>${escapeHtml(nameById[a.intern_id] || '?')}</td><td>${situacao}</td>
      </tr>`;
    }).join('');
    const body = `
      <div class="meta">${escapeHtml(patient.full_name || 'Nome não informado')} ${patient.origin ? '· ' + escapeHtml(patient.origin) : ''}${patient.whatsapp ? ' · ' + escapeHtml(patient.whatsapp) : ''}</div>
      <table>
        <tr><th>Agendados (futuros)</th><td>${totalAgendado}</td></tr>
        <tr><th>Presenças</th><td>${presentes}</td></tr>
        <tr><th>Faltas</th><td>${ausentes}</td></tr>
        <tr><th>Cancelados</th><td>${cancelados}</td></tr>
      </table>
      <h3>Histórico de atendimentos</h3>
      <table><tr><th>Data</th><th>Horário</th><th>Estagiário</th><th>Situação</th></tr>${printRows}</table>`;
    exportReportPdf(`Ficha do paciente #${patient.registration_number}`, body);
  });

  const editBtn = document.getElementById('editFromFicha');
  if (editBtn) {
    editBtn.addEventListener('click', () => {
      pendingEditPatientId = patient.id;
      currentPage = 'pacientes';
      render();
    });
  }

  const contatoBtn = document.getElementById('contatoBtn');
  if (contatoBtn) {
    contatoBtn.addEventListener('click', async () => {
      await db.from('patients').update({ last_contacted_at: new Date().toISOString() }).eq('id', patientId);
      contatoBtn.style.background = '#2f855a';
      contatoBtn.textContent = '✓ Contatado';
    });
  }
}

let internAgendaView = 'semana';
let internAgendaAnchor = new Date();

async function renderMinhaAgenda() {
  if (!currentIntern) {
    content.innerHTML = `<section class="panel"><div class="placeholder">Você não possui um cadastro de estagiário vinculado a este login.</div></section>`;
    return;
  }

  content.innerHTML = `
    <section class="panel"><h2 style="margin-top:0">Meu(s) paciente(s)</h2><div id="inicioCards"><div class="placeholder">Carregando...</div></div></section>
    <section class="panel"><h2>Ações necessárias</h2><div id="acoesWrap" class="placeholder">Carregando...</div></section>

    <section class="panel">
      <div class="toolbar"><div><h2>Minha agenda</h2><div class="muted">Confirme seus atendimentos e registre a presença após o horário.</div></div></div>

      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px">
        <div style="display:flex;gap:4px">
          <button class="action secondary iview-btn" data-v="dia">Dia</button>
          <button class="action secondary iview-btn" data-v="semana">Semana</button>
          <button class="action secondary iview-btn" data-v="mes">Mês</button>
        </div>
        <button id="iPrevPeriod" class="action secondary">◀</button>
        <div id="iPeriodLabel" style="font-weight:700;min-width:160px;text-align:center"></div>
        <button id="iNextPeriod" class="action secondary">▶</button>
        <button id="iTodayBtn" class="action secondary">Hoje</button>
      </div>

      <div id="myAgendaListWrap"><div class="placeholder">Carregando...</div></div>
    </section>`;

  await loadInternStatsAndActions();

  const listWrap = document.getElementById('myAgendaListWrap');

  document.querySelectorAll('.iview-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.v === internAgendaView);
    btn.addEventListener('click', () => {
      internAgendaView = btn.dataset.v;
      document.querySelectorAll('.iview-btn').forEach(b => b.classList.toggle('active', b.dataset.v === internAgendaView));
      loadMyAppointments();
    });
  });

  document.getElementById('iPrevPeriod').addEventListener('click', () => { shiftInternAnchor(-1); loadMyAppointments(); });
  document.getElementById('iNextPeriod').addEventListener('click', () => { shiftInternAnchor(1); loadMyAppointments(); });
  document.getElementById('iTodayBtn').addEventListener('click', () => { internAgendaAnchor = new Date(); loadMyAppointments(); });

  function shiftInternAnchor(dir) {
    const a = new Date(internAgendaAnchor);
    if (internAgendaView === 'dia') a.setDate(a.getDate() + dir);
    else if (internAgendaView === 'semana') a.setDate(a.getDate() + dir * 7);
    else a.setMonth(a.getMonth() + dir);
    internAgendaAnchor = a;
  }

  async function loadMyAppointments() {
    const range = getDateRange(internAgendaView, internAgendaAnchor);
    document.getElementById('iPeriodLabel').textContent = periodLabel(internAgendaView, range);

    const { data: appts, error } = await db.from('appointments')
      .select('id, appointment_date, start_time, end_time, status, intern_confirmation, patient_confirmation, attendance_status, patient_id, room, is_first_session, patients(registration_number, full_name)')
      .eq('intern_id', currentIntern.id)
      .gte('appointment_date', toDateStr(range.start))
      .lte('appointment_date', toDateStr(range.end))
      .order('appointment_date').order('start_time');

    if (error) { listWrap.innerHTML = `<div class="message error" style="display:block">Erro: ${escapeHtml(error.message)}</div>`; return; }
    if (!appts || appts.length === 0) { listWrap.innerHTML = `<div class="placeholder">Nenhum atendimento neste período.</div>`; return; }

    const todayStr = toDateStr(new Date());
    const byDate = {};
    appts.forEach(a => { (byDate[a.appointment_date] = byDate[a.appointment_date] || []).push(a); });

    let html = '';
    Object.keys(byDate).sort().forEach(date => {
      const d = new Date(date + 'T00:00:00');
      const weekdayLabel = d.toLocaleDateString('pt-BR', { weekday: 'long' });
      html += `<div style="margin:16px 0 6px;font-weight:700;text-transform:capitalize">${weekdayLabel}, ${fmtBr(date)}</div>
        <table style="width:100%;border-collapse:collapse;font-size:13px">
        <tr style="text-align:left;font-size:12px;color:#667085">
          <th style="padding:6px 8px">Horário</th><th style="text-align:left">Paciente</th><th>Minha confirmação</th><th>Presença do paciente</th><th>Ficha</th>
        </tr>`;

      byDate[date].forEach(a => {
        const patLabel = a.patients ? `#${a.patients.registration_number} ${a.patients.full_name || ''}` : '—';
        const isCancelled = a.status === 'cancelado';
        const isPast = date <= todayStr;

        let patCell = escapeHtml(patLabel);
        if (!isCancelled && a.is_first_session) {
          const pc = a.patient_confirmation;
          const pcColor = pc === 'confirmado' ? '#2f855a' : pc === 'nao_confirmado' ? '#b42318' : '#9a6700';
          const pcLabel = { aguardando: 'Aguardando', confirmado: 'Confirmado', nao_confirmado: 'Não confirmado' }[pc];
          patCell += `<br><span style="font-size:11px;color:${pcColor}">Paciente: ${pcLabel}</span>`;
        }

        let confCell, presCell;

        if (isCancelled) {
          confCell = `<span style="color:#b42318;font-weight:700">Cancelado</span>`;
          presCell = '—';
        } else if (!a.is_first_session) {
          // Só o 1º atendimento da série exige confirmação registrada no sistema;
          // nas sessões seguintes, o combinado é direto entre estagiário e paciente.
          confCell = `<span class="muted" style="font-size:12px">Combinado com o paciente</span>`;

          const att = a.attendance_status;
          if (!isPast) {
            presCell = `<span class="muted" style="font-size:12px">Disponível no dia</span>`;
          } else {
            let style, label;
            if (att === 'presente') { style = 'background:#e9f7ef;color:#176b36;border:1px solid #bce3cc'; label = '✓ Compareceu'; }
            else if (att === 'ausente') { style = 'background:#fdecec;color:#b42318;border:1px solid #f3c6c6'; label = '✗ Não compareceu'; }
            else { style = 'background:#f3f4f6;color:#475467;border:1px solid #e5e7eb'; label = 'Marcar presença'; }
            presCell = `<button class="toggle-presence" data-id="${a.id}" data-current="${att}"
              style="${style};font-weight:700;padding:7px 12px;border-radius:8px;font-size:12px;cursor:pointer;border-width:1px;border-style:solid">${label}</button>`;
          }
        } else {
          // Confirmação: editável antes do dia do atendimento; só leitura depois
          const conf = a.intern_confirmation;
          const confColor = conf === 'confirmado' ? '#176b36' : conf === 'nao_confirmado' ? '#b42318' : '#475467';
          const confLabelRead = { aguardando: 'Aguardando', confirmado: '✓ Confirmado', nao_confirmado: '✗ Não confirmado' }[conf];
          if (!isPast) {
            let style, label;
            if (conf === 'confirmado') { style = 'background:#e9f7ef;color:#176b36;border:1px solid #bce3cc'; label = '✓ Confirmado'; }
            else if (conf === 'nao_confirmado') { style = 'background:#fdecec;color:#b42318;border:1px solid #f3c6c6'; label = '✗ Não poderei comparecer'; }
            else { style = 'background:#f3f4f6;color:#475467;border:1px solid #e5e7eb'; label = 'Confirmar atendimento'; }
            confCell = `<button class="toggle-confirm" data-id="${a.id}" data-current="${conf}"
              style="${style};font-weight:700;padding:7px 12px;border-radius:8px;font-size:12px;cursor:pointer;border-width:1px;border-style:solid">${label}</button>`;
          } else {
            confCell = `<span style="color:${confColor};font-weight:700;font-size:12px">${confLabelRead}</span>`;
          }

          // Presença: só fica ativa a partir do dia do atendimento
          const att = a.attendance_status;
          if (!isPast) {
            presCell = `<span class="muted" style="font-size:12px">Disponível no dia</span>`;
          } else {
            let style, label;
            if (att === 'presente') { style = 'background:#e9f7ef;color:#176b36;border:1px solid #bce3cc'; label = '✓ Compareceu'; }
            else if (att === 'ausente') { style = 'background:#fdecec;color:#b42318;border:1px solid #f3c6c6'; label = '✗ Não compareceu'; }
            else { style = 'background:#f3f4f6;color:#475467;border:1px solid #e5e7eb'; label = 'Marcar presença'; }
            presCell = `<button class="toggle-presence" data-id="${a.id}" data-current="${att}"
              style="${style};font-weight:700;padding:7px 12px;border-radius:8px;font-size:12px;cursor:pointer;border-width:1px;border-style:solid">${label}</button>`;
          }
        }

        const horarioCell = `${a.start_time.slice(0,5)}–${a.end_time.slice(0,5)}${a.room ? `<br><small class="muted">${escapeHtml(a.room)}</small>` : ''}`;

        html += `<tr style="${isCancelled ? 'opacity:.5;text-decoration:line-through' : ''}">
          <td style="padding:6px 8px">${horarioCell}</td>
          <td style="text-align:left">${patCell}</td>
          <td>${confCell}</td>
          <td>${presCell}</td>
          <td><button class="action secondary view-patient-ficha" data-id="${a.patient_id}" style="padding:5px 10px;font-size:12px">Ver ficha</button></td>
        </tr>`;
      });
      html += `</table>`;
    });

    listWrap.innerHTML = html;

    listWrap.querySelectorAll('.toggle-confirm').forEach(btn => {
      btn.addEventListener('click', async () => {
        const next = btn.dataset.current === 'confirmado' ? 'nao_confirmado' : 'confirmado';
        const { error } = await db.rpc('confirmar_atendimento', { p_appointment_id: btn.dataset.id, p_confirmacao: next });
        if (error) alert('Erro: ' + error.message); else loadMyAppointments();
      });
    });
    listWrap.querySelectorAll('.toggle-presence').forEach(btn => {
      btn.addEventListener('click', async () => {
        const next = btn.dataset.current === 'presente' ? 'ausente' : 'presente';
        const { error } = await db.rpc('registrar_atendimento', { p_appointment_id: btn.dataset.id, p_status: next, p_cancelado_por: null });
        if (error) alert('Erro: ' + error.message); else loadMyAppointments();
      });
    });
    listWrap.querySelectorAll('.view-patient-ficha').forEach(btn => {
      btn.addEventListener('click', () => renderPatientFicha(btn.dataset.id, 'minha_agenda'));
    });
  }

  await loadMyAppointments();
}

// PÁGINA: MINHA DISPONIBILIDADE (estagiário)
// ---------------------------------------------------------------------------
async function renderMinhaDisponibilidade() {
  if (!currentIntern) {
    content.innerHTML = `<section class="panel"><div class="placeholder">Você não possui um cadastro de estagiário vinculado a este login.</div></section>`;
    return;
  }

  content.innerHTML = `
    <section class="panel">
      <div class="toolbar">
        <div><h2>Endereços onde topo atender</h2><div class="muted">Comece por aqui: marque só os endereços que funcionam pra você — se não marcar nenhum, você é considerado disposto a atender em qualquer um, e a grade abaixo mostra os horários de todos. A sala específica é escolhida pela coordenação.</div></div>
        <button id="saveLocationPrefBtn" class="action">Salvar</button>
      </div>
      <div id="locationPrefMsg" class="message"></div>
      <div id="locationPrefWrap"><div class="placeholder">Carregando endereços...</div></div>
    </section>

    <section class="panel">
      <div class="toolbar">
        <div><h2>Minha disponibilidade</h2><div class="muted" id="availGridHint">Marque os horários em que você pode atender. Só aparecem os horários liberados em pelo menos uma sala.</div></div>
        <button id="saveAvailBtn" class="action">Salvar disponibilidade</button>
      </div>
      <div id="availMsg" class="message"></div>
      <div id="myAvailGrid"><div class="placeholder">Carregando grade...</div></div>
    </section>`;

  const gridEl = document.getElementById('myAvailGrid');
  const msg = document.getElementById('availMsg');
  const availGridHint = document.getElementById('availGridHint');

  // ---- Endereços onde topo atender (buscado primeiro, para filtrar a grade) ----
  const locationPrefWrap = document.getElementById('locationPrefWrap');
  const locationPrefMsg = document.getElementById('locationPrefMsg');

  const [{ data: locations }, { data: myPrefs }, { data: mySlots }] = await Promise.all([
    db.from('locations').select('*').order('name'),
    db.from('intern_location_preferences').select('location_id').eq('intern_id', currentIntern.id),
    db.from('intern_availability').select('*').eq('intern_id', currentIntern.id)
  ]);

  const myPrefIds = (myPrefs || []).map(p => p.location_id);
  const clinicSlots = await getEffectiveClinicSlots(myPrefIds.length > 0 ? myPrefIds : null);

  if (myPrefIds.length > 0) {
    const prefNames = locations.filter(l => myPrefIds.includes(l.id)).map(l => l.name).join(', ');
    availGridHint.textContent = `Marque os horários em que você pode atender. Mostrando só os horários de: ${prefNames}.`;
  }

  gridEl.innerHTML = buildAvailabilityGrid(clinicSlots || [], mySlots || []);
  bindAvailabilityToggles(gridEl);

  document.getElementById('saveAvailBtn').addEventListener('click', async () => {
    const btn = document.getElementById('saveAvailBtn');
    btn.disabled = true; btn.textContent = 'Salvando...';
    msg.style.display = 'none';

    const selected = readSelectedSlots(gridEl).map(s => ({ ...s, intern_id: currentIntern.id }));

    const { error: delErr } = await db.from('intern_availability').delete().eq('intern_id', currentIntern.id);
    if (delErr) {
      msg.textContent = 'Erro ao salvar: ' + delErr.message;
      msg.className = 'message error'; msg.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Salvar disponibilidade';
      return;
    }

    if (selected.length > 0) {
      const { error: insErr } = await db.from('intern_availability').insert(selected);
      if (insErr) {
        msg.textContent = 'Erro ao salvar: ' + insErr.message;
        msg.className = 'message error'; msg.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Salvar disponibilidade';
        return;
      }
    }

    msg.textContent = 'Disponibilidade salva com sucesso.';
    msg.className = 'message success'; msg.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Salvar disponibilidade';
  });

  if (!locations || locations.length === 0) {
    locationPrefWrap.innerHTML = `<div class="placeholder">Nenhum endereço cadastrado ainda.</div>`;
  } else {
    const myPrefSet = new Set(myPrefIds);
    locationPrefWrap.innerHTML = locations.map(l => `
      <label style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f8fafc;border:1px solid #e5e9ef;border-radius:8px;margin-bottom:8px;cursor:pointer">
        <input type="checkbox" class="location-pref-check" data-id="${l.id}" ${myPrefSet.has(l.id) ? 'checked' : ''}>
        <div>
          <strong>${escapeHtml(l.name)}</strong>
          ${l.address ? `<div class="muted" style="font-size:12px">${escapeHtml(l.address)}</div>` : ''}
        </div>
      </label>`).join('');
  }

  const saveLocationPrefBtn = document.getElementById('saveLocationPrefBtn');
  if (saveLocationPrefBtn) {
    saveLocationPrefBtn.addEventListener('click', async () => {
      saveLocationPrefBtn.disabled = true; saveLocationPrefBtn.textContent = 'Salvando...';
      locationPrefMsg.style.display = 'none';

      const checkedIds = Array.from(document.querySelectorAll('.location-pref-check:checked')).map(c => c.dataset.id);

      const { error: delErr } = await db.from('intern_location_preferences').delete().eq('intern_id', currentIntern.id);
      if (delErr) {
        locationPrefMsg.textContent = 'Erro ao salvar: ' + delErr.message;
        locationPrefMsg.className = 'message error'; locationPrefMsg.style.display = 'block';
        saveLocationPrefBtn.disabled = false; saveLocationPrefBtn.textContent = 'Salvar';
        return;
      }

      if (checkedIds.length > 0) {
        const { error: insErr } = await db.from('intern_location_preferences')
          .insert(checkedIds.map(locationId => ({ intern_id: currentIntern.id, location_id: locationId })));
        if (insErr) {
          locationPrefMsg.textContent = 'Erro ao salvar: ' + insErr.message;
          locationPrefMsg.className = 'message error'; locationPrefMsg.style.display = 'block';
          saveLocationPrefBtn.disabled = false; saveLocationPrefBtn.textContent = 'Salvar';
          return;
        }
      }

      // Recarrega a página inteira para a grade já refletir o novo filtro de endereço.
      await renderMinhaDisponibilidade();
    });
  }
}

// ---------------------------------------------------------------------------
// PÁGINA: GRADE GERAL DE DISPONIBILIDADE (calendário semanal cruzado)
// ---------------------------------------------------------------------------
let pendingQuickSchedule = null; // usado quando clicar num estagiário aqui e for para a Agenda
let pendingEditPatientId = null; // usado quando clicar em "Editar paciente" na Ficha

async function renderGradeGeral() {
  content.innerHTML = `
    <section class="panel">
      <div class="toolbar">
        <div><h2>Grade Geral de Disponibilidade</h2><div class="muted">Veja quais estagiários estão disponíveis em cada dia e horário.</div></div>
      </div>
      <div id="internFilterWrap" style="margin-bottom:16px"></div>
      <div id="gradeGeralWrap" style="overflow:auto"><div class="placeholder">Carregando grade...</div></div>
    </section>`;

  const filterWrap = document.getElementById('internFilterWrap');
  const gridWrap = document.getElementById('gradeGeralWrap');

  const [clinicSlotsAll, { data: interns }] = await Promise.all([
    getEffectiveClinicSlots(),
    db.from('interns').select('*').eq('status', 'ativo')
  ]);
  let clinicSlots = clinicSlotsAll.filter(s => s.enabled);

  const { data: locations } = await db.from('locations').select('*').order('name');

  if (!clinicSlots || clinicSlots.length === 0) {
    gridWrap.innerHTML = `<div class="placeholder">Nenhum horário liberado em nenhuma sala ainda. Configure em "Mapa de Salas".</div>`;
    return;
  }
  if (!interns || interns.length === 0) {
    gridWrap.innerHTML = `<div class="placeholder">Nenhum estagiário ativo cadastrado.</div>`;
    return;
  }

  const internIds = interns.map(i => i.id);
  const [{ data: profiles }, { data: allAvail }, { data: activeSeries }, { data: allLocationPrefs }] = await Promise.all([
    db.from('profiles').select('id, full_name').in('id', internIds),
    db.from('intern_availability').select('*').in('intern_id', internIds),
    db.from('appointment_series').select('intern_id, weekday, start_time').in('intern_id', internIds).eq('status', 'ativa'),
    db.from('intern_location_preferences').select('intern_id, location_id').in('intern_id', internIds)
  ]);

  const occupiedKey = (internId, weekday, startTime) => `${internId}_${weekday}_${startTime}`;
  const occupiedSet = new Set((activeSeries || []).map(s => occupiedKey(s.intern_id, s.weekday, s.start_time)));
  const internIdsWithPatient = new Set((activeSeries || []).map(s => s.intern_id));

  const internsWithAnyLocPref = new Set((allLocationPrefs || []).map(p => p.intern_id));
  function isWillingForLocation(internId, locationId) {
    if (!locationId) return true; // "Todas as localizações" — não filtra por disposição
    if (!internsWithAnyLocPref.has(internId)) return true; // nunca marcou preferência = topa qualquer uma
    return (allLocationPrefs || []).some(p => p.intern_id === internId && p.location_id === locationId);
  }

  const nameById = {};
  (profiles || []).forEach(p => { nameById[p.id] = p.full_name; });
  const internsList = interns.map(i => ({ id: i.id, full_name: nameById[i.id] || '(sem nome)' }))
    .sort((a, b) => a.full_name.localeCompare(b.full_name));

  let selectedInternIds = new Set(internsList.map(i => i.id)); // começa com todos marcados
  let onlyWithoutPatients = false;
  let selectedLocationId = '';

  async function refreshClinicSlotsForLocation() {
    const all = selectedLocationId ? await getEffectiveClinicSlots([selectedLocationId]) : await getEffectiveClinicSlots();
    clinicSlots = all.filter(s => s.enabled);
  }

  function renderFilter() {
    const allSelected = selectedInternIds.size === internsList.length;
    const label = allSelected ? 'Todos os estagiários' : `${selectedInternIds.size} de ${internsList.length} selecionados`;

    filterWrap.innerHTML = `
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <select id="locationFilterSelect" style="padding:10px 14px;border:1px solid #d5dbe4;border-radius:9px;font-size:13px;font-weight:700">
          <option value="">Todas as localizações</option>
          ${(locations || []).map(l => `<option value="${l.id}" ${selectedLocationId === l.id ? 'selected' : ''}>${escapeHtml(l.name)}</option>`).join('')}
        </select>
        <div style="position:relative;display:inline-block">
          <button type="button" id="internFilterToggle" class="action secondary">${label} ▾</button>
          <div id="internFilterPanel" style="display:none;position:absolute;top:110%;left:0;background:#fff;
            border:1px solid #e5e9ef;border-radius:10px;padding:10px;box-shadow:0 8px 24px rgba(23,32,51,.12);
            z-index:20;min-width:240px;max-height:280px;overflow:auto">
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:6px 4px;border-bottom:1px solid #eef0f3;margin-bottom:4px;cursor:pointer">
              <input type="checkbox" id="filterAll" ${allSelected ? 'checked' : ''}> Todos
            </label>
            ${internsList.map(i => `
              <label style="display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 4px;cursor:pointer">
                <input type="checkbox" class="filterIntern" data-id="${i.id}" ${selectedInternIds.has(i.id) ? 'checked' : ''}> ${escapeHtml(i.full_name)}
              </label>`).join('')}
          </div>
        </div>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;background:#f8fafc;border:1px solid #e5e9ef;padding:8px 12px;border-radius:8px;cursor:pointer">
          <input type="checkbox" id="filterWithoutPatients" ${onlyWithoutPatients ? 'checked' : ''}> Só estagiários sem paciente
        </label>
      </div>
      <div style="display:flex;gap:14px;margin-top:10px;font-size:12px" class="muted">
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#e9f7ef;border:1px solid #bce3cc;margin-right:5px"></span>Disponível</span>
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#fff4d6;border:1px solid #f0d38a;margin-right:5px"></span>Já tem atendimento fixo</span>
      </div>`;

    document.getElementById('locationFilterSelect').addEventListener('change', async (e) => {
      selectedLocationId = e.target.value;
      await refreshClinicSlotsForLocation();
      renderGrid();
    });

    document.getElementById('filterWithoutPatients').addEventListener('change', (e) => {
      onlyWithoutPatients = e.target.checked;
      renderGrid();
    });

    const toggleBtn = document.getElementById('internFilterToggle');
    const panel = document.getElementById('internFilterPanel');
    toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    });
    document.addEventListener('click', function closePanel(e) {
      if (!panel.contains(e.target) && e.target !== toggleBtn) panel.style.display = 'none';
    }, { once: true });

    document.getElementById('filterAll').addEventListener('change', (e) => {
      selectedInternIds = e.target.checked ? new Set(internsList.map(i => i.id)) : new Set();
      renderFilter();
      renderGrid();
      document.getElementById('internFilterPanel').style.display = 'block';
    });

    filterWrap.querySelectorAll('.filterIntern').forEach(cb => {
      cb.addEventListener('change', (e) => {
        if (e.target.checked) selectedInternIds.add(e.target.dataset.id);
        else selectedInternIds.delete(e.target.dataset.id);
        renderFilter();
        renderGrid();
        document.getElementById('internFilterPanel').style.display = 'block';
      });
    });
  }

  function renderGrid() {
    const times = [...new Set(clinicSlots.map(s => s.start_time.slice(0, 5)))].sort();

    let html = `<table style="min-width:820px;border-collapse:collapse;width:100%">
      <tr style="text-align:left;font-size:12px;color:#667085">
        <th style="padding:10px 8px">Horário</th>${WEEKDAYS.map(d => `<th>${d.l}</th>`).join('')}
      </tr>`;

    times.forEach(time => {
      const sampleSlot = clinicSlots.find(s => s.start_time.slice(0, 5) === time);
      const timeLabel = sampleSlot ? `${formatHM(sampleSlot.start_time)}–${formatHM(sampleSlot.end_time)}` : time;
      html += `<tr style="border-top:1px solid #eef0f3"><td style="padding:8px;font-weight:700;white-space:nowrap">${timeLabel}</td>`;

      WEEKDAYS.forEach(d => {
        const clinicOpen = clinicSlots.some(s => s.weekday === d.n && s.start_time.slice(0, 5) === time);
        if (!clinicOpen) { html += `<td style="padding:8px;color:#d0d5dd;font-size:11px">Fechado</td>`; return; }

        const matches = (allAvail || []).filter(a =>
          a.weekday === d.n && a.start_time.slice(0, 5) === time && selectedInternIds.has(a.intern_id) &&
          (!onlyWithoutPatients || !internIdsWithPatient.has(a.intern_id)) &&
          isWillingForLocation(a.intern_id, selectedLocationId)
        );

        if (matches.length === 0) {
          html += `<td style="padding:8px;color:#98a2b3;font-size:11px">—</td>`;
          return;
        }

        html += `<td style="padding:6px">` + matches.map(a => {
          const iName = internsList.find(i => i.id === a.intern_id)?.full_name || '?';
          const isOccupied = occupiedSet.has(occupiedKey(a.intern_id, d.n, a.start_time));
          const bg = isOccupied ? '#fff4d6' : '#fff';
          const border = isOccupied ? '#f0d38a' : '#bce3cc';
          const fg = isOccupied ? '#8a5b00' : '#176b36';
          const icon = isOccupied ? '📌' : '⚡';
          return `<button type="button" class="action secondary quick-sched"
            data-intern-id="${a.intern_id}" data-weekday="${d.n}" data-start="${a.start_time}"
            style="display:block;width:100%;margin-bottom:4px;padding:5px 8px;font-size:11px;text-align:left;
            background:${bg};border:1px solid ${border};color:${fg}">${icon} ${escapeHtml(iName)}</button>`;
        }).join('') + `</td>`;
      });

      html += `</tr>`;
    });

    html += `</table>`;
    gridWrap.innerHTML = html;

    gridWrap.querySelectorAll('.quick-sched').forEach(btn => {
      btn.addEventListener('click', () => {
        pendingQuickSchedule = {
          internId: btn.dataset.internId,
          weekday: parseInt(btn.dataset.weekday),
          startTime: btn.dataset.start
        };
        currentPage = 'agenda';
        render();
      });
    });
  }

  renderFilter();
  renderGrid();
}

      <div class="field"><label>Situação</label>
        <select id="attStatusSelect">
          <option value="presente">Presente</option>

      <div style="display:flex;gap:10px;margin-top:14px">
        <button id="attConfirmBtn" class="action">Salvar</button>
        <button id="attCancelBtn" class="action secondary">Voltar</button>
      </div>
    </div>`;
  document.body.appendChild(div);

  document.getElementById('attStatusSelect').addEventListener('change', (e) => {
    document.getElementById('attCancelWhoField').style.display = e.target.value === 'cancelado' ? 'block' : 'none';
  });
  document.getElementById('attCancelBtn').addEventListener('click', () => { div.style.display = 'none'; });
}

function showAttendanceModal(appointmentId, onDone, initialStatus = 'presente') {
  ensureAttendanceModal();
  const modal = document.getElementById('attendanceModal');
  document.getElementById('attStatusSelect').value = initialStatus;
  document.getElementById('attCancelWhoField').style.display = initialStatus === 'cancelado' ? 'block' : 'none';
  document.getElementById('attModalMsg').style.display = 'none';
  modal.style.display = 'flex';

  document.getElementById('attConfirmBtn').onclick = async () => {
    const status = document.getElementById('attStatusSelect').value;
    const who = status === 'cancelado' ? document.getElementById('attCancelWhoSelect').value : null;
    const { error } = await db.rpc('registrar_atendimento', {
      p_appointment_id: appointmentId, p_status: status, p_cancelado_por: who
    });
    if (error) {
      const msg = document.getElementById('attModalMsg');
      msg.textContent = 'Erro: ' + error.message;
      msg.className = 'message error'; msg.style.display = 'block';
      return;
    }
    modal.style.display = 'none';
    if (onDone) onDone();
  };
}

  async function loadRoomDetail(roomId, detailEl) {
    const [{ data: slots }, { data: interns }, { data: staffing }, { data: roomRow }] = await Promise.all([
      db.from('room_schedule_slots').select('*').eq('room_id', roomId).order('weekday').order('start_time'),
      db.from('interns').select('id').eq('status', 'ativo'),
      db.from('room_staffing').select('*').eq('room_id', roomId),
      db.from('rooms').select('name, location_id').eq('id', roomId).single()
    ]);

    const internIds = (interns || []).map(i => i.id);
    const [{ data: profiles }, { data: allAvail }, { data: allLocationPrefs }] = await Promise.all([
      internIds.length ? db.from('profiles').select('id, full_name').in('id', internIds) : { data: [] },
      internIds.length ? db.from('intern_availability').select('*').in('intern_id', internIds) : { data: [] },
      internIds.length ? db.from('intern_location_preferences').select('intern_id, location_id').in('intern_id', internIds) : { data: [] }
    ]);
    const nameById = {};
    (profiles || []).forEach(p => { nameById[p.id] = p.full_name; });

    const roomLocationId = roomRow ? roomRow.location_id : null;

    // Se o estagiário nunca marcou nenhuma preferência de endereço, ele topa qualquer um.
    const internsWithAnyPref = new Set((allLocationPrefs || []).map(p => p.intern_id));
    const internsWillingHere = new Set(
      (allLocationPrefs || []).filter(p => roomLocationId && p.location_id === roomLocationId).map(p => p.intern_id)
    );
    const isWillingForThisRoom = (internId) => !roomLocationId || !internsWithAnyPref.has(internId) || internsWillingHere.has(internId);

    const roomName = roomRow ? roomRow.name : null;

    detailEl.innerHTML = `
      <div style="font-weight:700;margin-bottom:8px">Adicionar horário nesta sala</div>
      <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px">
        <div class="field" style="margin-bottom:0"><label>Dia</label>
          <select id="newSlotWeekday-${roomId}">${ROOM_WEEKDAYS.map(d => `<option value="${d.n}">${d.l}</option>`).join('')}</select>
        </div>
        <div class="field" style="margin-bottom:0"><label>Início</label><input type="time" id="newSlotStart-${roomId}" value="08:00"></div>
        <div class="field" style="margin-bottom:0"><label>Término</label><input type="time" id="newSlotEnd-${roomId}" value="09:00"></div>
        <button class="action add-room-slot-btn" data-room="${roomId}" style="padding:10px 14px">+ Adicionar horário</button>
      </div>
      <div class="message" id="roomSlotMsg-${roomId}"></div>
      <div style="font-weight:700;margin-bottom:8px">Horários e ensalamento</div>
      <div id="roomDayTabs-${roomId}" style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px"></div>
      <div id="roomSlotsWrap-${roomId}"></div>`;

    let selectedDay = new Date().getDay();

    function renderDayTabs() {
      const tabsWrap = document.getElementById(`roomDayTabs-${roomId}`);
      tabsWrap.innerHTML = ROOM_WEEKDAYS.map(d => {
        const freeCount = slots.filter(s => s.weekday === d.n && s.enabled &&
          !(staffing || []).some(st => st.weekday === d.n && st.start_time.slice(0, 5) === s.start_time.slice(0, 5))
        ).length;
        return `<button class="action secondary room-day-tab" data-day="${d.n}"
          style="padding:6px 12px;font-size:12px;${d.n === selectedDay ? 'background:#315c8c;color:#fff;border-color:#315c8c' : ''}">
          ${d.l.slice(0, 3)}${freeCount > 0 ? ` (${freeCount} livre${freeCount > 1 ? 's' : ''})` : ''}</button>`;
      }).join('');

      tabsWrap.querySelectorAll('.room-day-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedDay = parseInt(btn.dataset.day);
          renderDayTabs();
          renderSlotsList();
        });
      });
    }

    function renderSlotsList() {
      const slotsWrap = document.getElementById(`roomSlotsWrap-${roomId}`);
      const daySlots = slots.filter(s => s.weekday === selectedDay);

      if (daySlots.length === 0) {
        slotsWrap.innerHTML = `<div class="placeholder">Nenhum horário cadastrado neste dia ainda.</div>`;
        return;
      }
      const rows = daySlots.slice().sort((a, b) => a.start_time.localeCompare(b.start_time)).map(s => {
        const current = (staffing || []).find(st => st.weekday === s.weekday && st.start_time.slice(0, 5) === s.start_time.slice(0, 5));
        // Domingo não tem disponibilidade pessoal cadastrável pelo estagiário ainda,
        // então nesse caso mostramos todos os ativos que topam esta sala.
        const eligibleInterns = (s.weekday === 0
          ? (interns || []).map(i => i.id)
          : (allAvail || [])
              .filter(a => a.weekday === s.weekday && a.start_time.slice(0, 5) === s.start_time.slice(0, 5))
              .map(a => a.intern_id)
        ).filter(isWillingForThisRoom);

        const staffingCell = !s.enabled ? '<span class="muted">Sala fechada neste horário</span>' : `
          <select class="staffing-select" data-room="${roomId}" data-weekday="${s.weekday}" data-start="${s.start_time}" data-end="${s.end_time}" data-current="${current ? current.intern_id : ''}">
            <option value="">Ninguém ensalado</option>
            ${eligibleInterns.map(iid => `<option value="${iid}" ${current && current.intern_id === iid ? 'selected' : ''}>${escapeHtml(nameById[iid] || '?')}</option>`).join('')}
          </select>
          ${s.weekday === 0 ? '<div class="muted" style="font-size:11px;margin-top:2px">Domingo: sem filtro de disponibilidade, só de sala</div>' : ''}
          ${eligibleInterns.length === 0 ? '<div class="muted" style="font-size:11px;margin-top:2px">Nenhum estagiário disponível e disposto a atender aqui</div>' : ''}`;

        return `<tr>
          <td>${formatHM(s.start_time)}–${formatHM(s.end_time)}</td>
          <td><button class="toggle-room-slot" data-id="${s.id}" data-current="${s.enabled}"
            style="padding:5px 10px;font-size:12px;border-radius:8px;cursor:pointer;font-weight:700;
            background:${s.enabled ? '#e9f7ef' : '#f3f4f6'};color:${s.enabled ? '#176b36' : '#475467'};border:1px solid ${s.enabled ? '#bce3cc' : '#e5e7eb'}">
            ${s.enabled ? '🟢 Liberado' : '⚪ Fechado'}</button></td>
          <td>${staffingCell}</td>
        </tr>`;
      }).join('');

      slotsWrap.innerHTML = `<div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">
        <tr style="text-align:left;font-size:12px;color:#667085"><th style="padding:6px 8px">Horário</th><th>Status</th><th>Ensalamento</th></tr>
        ${rows}</table></div>`;

      slotsWrap.querySelectorAll('.toggle-room-slot').forEach(btn => {
        btn.addEventListener('click', async () => {
          const next = btn.dataset.current !== 'true';
          await db.from('room_schedule_slots').update({ enabled: next }).eq('id', btn.dataset.id);
          const s = slots.find(x => x.id === btn.dataset.id);
          if (s) s.enabled = next;
          renderDayTabs();
          renderSlotsList();
        });
      });

      slotsWrap.querySelectorAll('.staffing-select').forEach(sel => {
        sel.addEventListener('change', async () => {
          const { room, weekday, start, end } = sel.dataset;
          const newInternId = sel.value || null;

          await db.from('room_staffing').delete().eq('room_id', room).eq('weekday', weekday).eq('start_time', start);
          if (newInternId) {
            await db.from('room_staffing').insert([{ room_id: room, intern_id: newInternId, weekday: parseInt(weekday), start_time: start, end_time: end }]);
          }
          const idx = (staffing || []).findIndex(st => st.weekday === parseInt(weekday) && st.start_time.slice(0, 5) === start.slice(0, 5));
          if (idx >= 0) staffing.splice(idx, 1);
          if (newInternId) staffing.push({ room_id: room, intern_id: newInternId, weekday: parseInt(weekday), start_time: start, end_time: end });
          renderDayTabs();

          // Se já existirem agendamentos ativos nesta sala/horário com outro estagiário, oferece atualizar
          if (newInternId && roomName) {
            const { data: matchingSeries } = await db.from('appointment_series')
              .select('id, intern_id')
              .eq('room', roomName).eq('weekday', parseInt(weekday)).eq('start_time', start).eq('status', 'ativa');

            const toUpdate = (matchingSeries || []).filter(s => s.intern_id !== newInternId);
            if (toUpdate.length > 0) {
              const internLabel = nameById[newInternId] || 'o novo estagiário';
              const doUpdate = confirm(`Há ${toUpdate.length} agendamento(s) ativo(s) nesta sala/horário com outro estagiário. Deseja atualizá-los para ${internLabel}?`);
              if (doUpdate) {
                for (const s of toUpdate) {
                  await db.from('appointment_series').update({ intern_id: newInternId }).eq('id', s.id);
                  await db.from('appointments').update({ intern_id: newInternId })
                    .eq('series_id', s.id).eq('status', 'agendado').eq('attendance_status', 'pendente')
                    .gte('appointment_date', toDateStr(new Date()));
                }
                alert('Agendamentos atualizados.');
              }
            }
          }
        });
      });
    }

    renderDayTabs();
    renderSlotsList();

    detailEl.querySelector('.add-room-slot-btn').addEventListener('click', async () => {
      const weekday = parseInt(document.getElementById(`newSlotWeekday-${roomId}`).value);
      const start = document.getElementById(`newSlotStart-${roomId}`).value;

    let rooms = mapaSelectedLocationId ? (allRooms || []).filter(r => r.location_id === mapaSelectedLocationId) : (allRooms || []);

    if (mapaOnlyWithAppts) {
      const roomNamesWithAppts = new Set((appts || []).filter(a => a.room).map(a => a.room));

    }

    const internIds = [...new Set([...(allStaffing || []).map(s => s.intern_id), ...(appts || []).map(a => a.intern_id)])];

    const nameById = {};
    (profiles || []).forEach(p => { nameById[p.id] = p.full_name; });

    function buildRoomDaySection(room, dateStr) {
      const weekday = new Date(dateStr + 'T00:00:00').getDay();
      const roomSlots = (allSlots || []).filter(s => s.room_id === room.id && s.weekday === weekday).sort((a, b) => a.start_time.localeCompare(b.start_time));
      if (roomSlots.length === 0) return `<div class="placeholder" style="text-align:left;padding:8px 0">Sala fechada neste dia.</div>`;

      const rows = roomSlots.map(s => {
        const staffed = (allStaffing || []).find(st => st.room_id === room.id && st.weekday === weekday && st.start_time.slice(0, 5) === s.start_time.slice(0, 5));
        const internName = staffed ? (nameById[staffed.intern_id] || '?') : null;
        const appt = (appts || []).find(a => a.room === room.name && a.appointment_date === dateStr && a.start_time.slice(0, 5) === s.start_time.slice(0, 5));
        const patLabel = appt && appt.patients ? `#${appt.patients.registration_number} ${appt.patients.full_name || ''}` : null;

        return `<tr>
          <td style="padding:6px 8px;white-space:nowrap">${formatHM(s.start_time)}–${formatHM(s.end_time)}</td>
          <td>${internName ? escapeHtml(internName) : '<span class="muted">Sem ensalamento</span>'}</td>
          <td>${patLabel ? escapeHtml(patLabel) : (internName ? '<span class="muted">Livre</span>' : '—')}</td>
        </tr>`;
      }).join('');

      return `<table style="width:100%;border-collapse:collapse;font-size:13px">
        <tr style="text-align:left;font-size:12px;color:#667085"><th style="padding:6px 8px">Horário</th><th>Estagiário</th><th>Paciente</th></tr>
        ${rows}</table>`;
    }

    let html = '';
    if (mapaView === 'dia') {
      html = `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px">` +
        rooms.map(room => `<div class="panel" style="margin-bottom:0;padding:16px">
          <div style="font-weight:700;margin-bottom:8px">${escapeHtml(room.name)}</div>
          ${buildRoomDaySection(room, startStr)}
        </div>`).join('') + `</div>`;
    } else {
      html = rooms.map(room => {
        let dayBlocks = '';
        let curr = new Date(rangeStart);
        while (curr <= rangeEnd) {
          const dStr = toDateStr(curr);
          dayBlocks += `<div style="margin:10px 0 4px;font-weight:700;font-size:13px;text-transform:capitalize">${dateWithWeekday(dStr)}</div>${buildRoomDaySection(room, dStr)}`;
          curr.setDate(curr.getDate() + 1);
        }
        return `<div class="panel"><h3 style="margin-top:0">${escapeHtml(room.name)}</h3>${dayBlocks}</div>`;
      }).join('');
    }

    const unassigned = (appts || []).filter(a => !a.room);
    if (unassigned.length > 0) {
      html += `<div style="margin-top:16px;padding:12px;background:#fff5d8;border-radius:8px;font-size:13px">
        <strong>${unassigned.length} atendimento(s) sem sala definida no período.</strong> Edite o agendamento na Agenda para atribuir uma sala.
      </div>`;
    }

    gridWrap.innerHTML = html;

    const printBtn = document.getElementById('printEnsalamentoBtn');
    if (printBtn) {
      printBtn.onclick = () => {
        const dayStr = toDateStr(mapaAnchorDate);
        const dayHtml = rooms.map(room => `
          <h3 style="margin:20px 0 8px">${escapeHtml(room.name)}</h3>
          ${buildRoomDaySection(room, dayStr)}`).join('');
        exportReportPdf(`Ensalamento — ${dateWithWeekday(dayStr)}`, dayHtml);
      };
    }
  }

  await loadLocations();
  await loadRooms();
  await loadMapaGrid();
}

let agendaView = 'semana';    // 'dia' | 'semana' | 'mes'
let agendaAnchor = new Date();
let agendaInternFilter = 'todos';
let agendaPatientFilter = 'todos';

function getDateRange(view, anchor) {
  const a = new Date(anchor.getFullYear(), anchor.getMonth(), anchor.getDate());
  if (view === 'dia') return { start: new Date(a), end: new Date(a) };
  if (view === 'semana') {
    const day = a.getDay();
    const diffToMonday = day === 0 ? -6 : 1 - day;
    const monday = new Date(a); monday.setDate(a.getDate() + diffToMonday);
    const saturday = new Date(monday); saturday.setDate(monday.getDate() + 5);
    return { start: monday, end: saturday };
  }
  const first = new Date(a.getFullYear(), a.getMonth(), 1);
  const last = new Date(a.getFullYear(), a.getMonth() + 1, 0);
  return { start: first, end: last };
}

// Igual à de cima, mas incluindo domingo — só para o Mapa, já que salas podem abrir nesse dia.
function getMapaWeekRange(anchor) {
  const a = new Date(anchor.getFullYear(), anchor.getMonth(), anchor.getDate());
  const day = a.getDay();
  const diffToMonday = day === 0 ? -6 : 1 - day;
  const monday = new Date(a); monday.setDate(a.getDate() + diffToMonday);
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  return { start: monday, end: sunday };
}

function toDateStr(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function fmtBr(dateStr) { return dateStr.split('-').reverse().join('/'); }

function periodLabel(view, range) {
  if (view === 'dia') return fmtBr(toDateStr(range.start));
  if (view === 'semana') return `${fmtBr(toDateStr(range.start))} a ${fmtBr(toDateStr(range.end))}`;
  return range.start.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
}
