<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Projeto Escuta Comunitária">
<title>Projeto Escuta Comunitária</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:min(420px,100%);background:#fff;border:1px solid #e5e9ef;border-radius:16px;padding:34px;box-shadow:0 12px 35px rgba(23,32,51,.07)}
.brand{text-align:center;margin-bottom:28px}.brand h1{margin:0;color:#315c8c;font-size:25px}.brand p{color:#667085;font-size:13px;margin:8px 0 0}
.field{margin-bottom:16px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #d5dbe4;border-radius:9px;font-size:14px;outline:none}.field input:focus{border-color:#315c8c}
.btn{width:100%;border:0;background:#315c8c;color:#fff;padding:12px 14px;border-radius:9px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.6;cursor:not-allowed}
.message{display:none;margin-top:14px;padding:11px 12px;border-radius:8px;font-size:13px}.message.error{display:block;background:#fdecec;color:#b42318}.message.success{display:block;background:#e8f5ee;color:#2f855a}
.app{display:none;min-height:100vh}.side{width:240px;background:#fff;border-right:1px solid #e5e9ef;padding:24px 14px}.logo{font-weight:800;font-size:18px;margin:0 12px 28px}.logo span{color:#315c8c}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;border-radius:9px;margin:4px 0;color:#475467;font-size:14px;cursor:pointer}.nav button.active{background:#e8f0f8;color:#315c8c;font-weight:700}
.main{flex:1;padding:28px 36px;max-width:1550px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:26px}.profile{display:flex;align-items:center;gap:10px}.profile select,.context-select{padding:10px 14px;border:1px solid #d5dbe4;border-radius:9px;background:#fff;font-weight:700}.user{background:#fff;border:1px solid #e5e9ef;padding:10px 14px;border-radius:9px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.card,.panel,.hero{background:#fff;border:1px solid #e5e9ef;border-radius:12px}.card{padding:18px}.card small{color:#667085}.card strong{display:block;font-size:26px;margin-top:8px}.panel{padding:20px;margin-bottom:20px}.panel h2{font-size:17px;margin:0 0 16px}.hero{padding:22px;margin-bottom:20px}.hero h2{margin:0 0 6px}.hero p{margin:0;color:#667085}.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}.toolbar .right{margin-left:auto;display:flex;gap:8px}.action{border:0;background:#315c8c;color:#fff;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer}.secondary{background:#fff;color:#315c8c;border:1px solid #cbd6e2}.notice{padding:12px 14px;border-radius:8px;background:#fff5d8;color:#6b4b00;font-size:13px;margin-bottom:14px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.green{background:#e8f5ee;color:#2f855a}.yellow{background:#fff5d8;color:#9a6700}.red{background:#fdecec;color:#b42318}.gray{background:#f1f3f6;color:#667085}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid #e9edf2;font-size:13px}th{font-size:11px;color:#667085;background:#fafbfc}.hidden{display:none}
@media(max-width:850px){.side{display:none}.main{padding:20px}.cards{grid-template-columns:repeat(2,1fr)}}

.availability-table th,.availability-table td{min-width:145px}
.slot{padding:10px;border-radius:10px;text-align:center;font-size:13px}
.slot.free{background:#f3f4f6;color:#6b7280}
.slot.selected{background:#e6f4ea;color:#176b36;font-weight:700}
.slot.blocked{background:#f9e6e6;color:#9b2c2c;font-weight:700;cursor:not-allowed}
.slot.selectable{display:block;cursor:pointer}
.slot.selectable input{display:none}
.slot.selectable.selected{outline:2px solid #2f855a}
.subtle{font-size:13px;color:#6b7280;margin-top:4px}

.coordinator-simple-menu{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:12px;margin-bottom:18px}
.coordinator-simple-menu .menu-card{padding:16px;border:1px solid #e5e7eb;border-radius:14px;background:#fff;cursor:pointer}
.coordinator-simple-menu .menu-card strong{display:block;margin-top:6px}
.coordinator-simple-menu .menu-card span{font-size:12px;color:#6b7280}

.agenda-controls{display:flex;align-items:center;gap:10px;margin:12px 0 18px}
.agenda-controls strong{margin:0 8px}
.agenda-grid{display:grid;grid-template-columns:80px repeat(5,1fr);border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}
.agenda-grid>div{min-height:74px;border-right:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;padding:10px}
.agenda-head{background:#f8fafc;font-weight:700;text-align:center;min-height:52px!important}
.agenda-head small{font-weight:400;color:#667085}
.agenda-time{font-size:12px;color:#667085;background:#fafafa}
.appt{border-radius:10px!important;margin:6px!important;min-height:58px!important}
.appt strong,.appt span,.appt small{display:block}
.appt span{font-size:12px;margin-top:4px}
.appt small{font-size:11px;color:#667085;margin-top:2px}
.appt.confirmed{background:#e8f6ee}
.appt.waiting{background:#fff4d6}
.appt.notconfirmed{background:#fbe8e8}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);align-items:center;justify-content:center;z-index:1000}
.modal{background:#fff;border-radius:16px;padding:24px;width:min(760px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.preview-box{padding:14px;border-radius:10px;background:#f4f7fb;margin-top:12px}

.ec-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ec-card{background:#fff;border:1px solid #e6e8ec;border-radius:14px;padding:16px}
.ec-card h3{margin:0 0 6px}.ec-muted{font-size:12px;color:#667085}
.ec-calendar{display:grid;grid-template-columns:80px repeat(6,1fr);border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}
.ec-calendar>div{padding:10px;border-right:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;min-height:68px}
.ec-head{background:#f8fafc;font-weight:700;text-align:center;min-height:48px!important}
.ec-open{background:#e9f7ef;border-radius:9px;font-weight:700;cursor:pointer}
.ec-closed{background:#f3f4f6;color:#98a2b3;border-radius:9px;cursor:pointer}
.ec-appt{border-radius:9px;padding:9px!important;min-height:58px!important}
.ec-confirmed{background:#e9f7ef}.ec-wait{background:#fff4d6}.ec-no{background:#fdecec}
.ec-appt strong,.ec-appt span,.ec-appt small{display:block}
.ec-appt span{font-size:12px;margin-top:3px}.ec-appt small{font-size:11px;color:#667085;margin-top:2px}
.ec-pills{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.ec-pill{padding:7px 10px;border-radius:999px;background:#f2f4f7;font-size:12px}
.ec-pill.active{background:#e7f3ec;color:#176b36;font-weight:700}
.ec-status{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700}
.ec-green{background:#e7f3ec;color:#176b36}.ec-yellow{background:#fff4d6;color:#8a5b00}.ec-red{background:#fdecec;color:#a12b2b}.ec-gray{background:#eef0f2;color:#475467}
.ec-modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:1000}
.ec-modal-box{background:white;border-radius:16px;padding:24px;width:min(820px,94vw);max-height:90vh;overflow:auto}
.ec-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
@media(max-width:900px){.ec-grid{grid-template-columns:1fr}.ec-calendar{grid-template-columns:65px repeat(6,minmax(120px,1fr))}}

.ec-toggle-slot{
  width:100%;
  min-height:48px;
  border:0;
  font:inherit;
  text-align:center;
  cursor:pointer;
  padding:10px;
  border-radius:9px;
}
.ec-toggle-slot:hover{filter:brightness(.97);transform:translateY(-1px)}
.ec-toggle-slot:active{transform:translateY(0)}

button,.action,select,input{cursor:pointer}.ec-toggle-slot{pointer-events:auto!important}

#loadingScreen { display: flex; flex-direction: column; gap: 12px; }
.spinner { border: 3px solid #f3f3f3; border-top: 3px solid #315c8c; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loadingScreen" class="login-wrap">
  <div class="brand">
    <div class="spinner"></div>
    <p>Conectando ao sistema...</p>
  </div>
</div>

<div id="loginScreen" class="login-wrap" style="display: none;">
  <div class="login-card">
    <div class="brand">
      <h1>Projeto Escuta Comunitária</h1>
      <p>Gestão de atendimentos psicológicos</p>
    </div>
    <form id="loginForm">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button id="loginButton" class="btn" type="submit">Entrar</button>
      <div id="loginMessage" class="message"></div>
    </form>
  </div>
</div>

<div id="app" class="app">
  <aside class="side">
    <div class="logo">Projeto <span>Escuta Comunitária</span></div>
    <nav id="nav" class="nav"></nav>
  </aside>
  <main class="main">
    <div class="top">
      <div>
        <h1 id="title">Dashboard</h1>
        <div style="font-size:12px;color:#667085;margin-top:5px">Projeto Escuta Comunitária</div>
      </div>
      <div class="profile">
        <div class="user" id="userName">Carregando...</div>
        <select id="contextSelect" class="context-select" aria-label="Visualizar como">
          <option value="coordenacao">Coordenação da agenda</option>
          <option value="estagiario">Meu perfil de estagiário</option>
        </select>
        <button id="logoutButton" class="action secondary">Sair</button>
      </div>
    </div>
    <div id="content"></div>
  </main>
</div>

<script>
// =========================================================================
// CHAVES DO SUPABASE
// =========================================================================
const SUPABASE_URL = 'https://bhgwzqkdhbgfrlhcveqg.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_l8XeXHqjK6yRwFHjquGadg_e0PpDNXn';
// =========================================================================

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const loadingScreen = document.getElementById('loadingScreen');
const loginScreen = document.getElementById('loginScreen');
const app = document.getElementById('app');
const loginForm = document.getElementById('loginForm');
const loginButton = document.getElementById('loginButton');
const loginMessage = document.getElementById('loginMessage');
const logoutButton = document.getElementById('logoutButton');
const contextSelect = document.getElementById('contextSelect');
const userName = document.getElementById('userName');
const content = document.getElementById('content');
const nav = document.getElementById('nav');
const title = document.getElementById('title');

let currentProfile = null;
let currentIntern = null;
let currentPage = 'dashboard';
let currentContext = 'coordenacao';

const internListPage = async () => {
  content.innerHTML = `
    <section class="panel">
      <div class="toolbar"><h2>Estagiários</h2>
        <div class="right"><button id="newInternBtn" class="action">+ Novo estagiário</button></div>
      </div>
      <div id="internLoading" class="notice">Carregando estagiários do Supabase...</div>
      <div id="internTableWrap"></div>
    </section>
    <section id="internFormPanel" class="panel hidden">
      <div class="toolbar"><h2 id="internFormTitle">Novo estagiário</h2></div>
      <div class="formgrid">
        <div class="field"><label>Nome</label><input id="newInternName" placeholder="Nome completo"></div>
        <div class="field"><label>Matrícula</label><input id="newInternRegistration" placeholder="Matrícula"></div>
        <div class="field"><label>WhatsApp</label><input id="newInternWhatsapp" placeholder="(85) 99999-9999"></div>
        <div class="field"><label>Período / semestre</label><input id="newInternSemester" type="number" min="1" max="20" placeholder="8"></div>
        <div class="field"><label>Abordagens de preferência</label><input id="newInternApproaches" placeholder="Opcional"></div>
        <div class="field"><label>Público de preferência</label><input id="newInternAudience" placeholder="Opcional"></div>
        <div class="field"><label>Status</label><select id="newInternStatus"><option value="ativo">Ativo</option><option value="inativo">Inativo</option></select></div>
      </div>
      <div style="margin-top:14px"><button id="saveInternBtn" class="action">Salvar</button> <button id="cancelInternBtn" class="action secondary">Cancelar</button></div>
      <div id="internFormMessage" class="message"></div>
    </section>`;

  const loading = document.getElementById('internLoading');
  const wrap = document.getElementById('internTableWrap');

  const { data, error } = await db.from('interns')
    .select('id, full_name, registration_number, current_semester, status, user_id')
    .order('full_name');

  if (error) {
    loading.className='message error'; loading.style.display='block';
    loading.textContent='Não foi possível carregar os estagiários: '+error.message; return;
  }
  loading.remove();

  const rows=(data||[]).map(i=>{
    const status=i.status==='ativo'?'<span class="badge green">Ativo</span>':'<span class="badge red">Inativo</span>';
    const access=i.user_id?'<span class="badge green">Conta vinculada</span>':'<span class="badge yellow">Sem acesso</span>';
    return `<tr><td><strong>${escapeHtml(i.full_name)}</strong></td><td>${escapeHtml(i.registration_number)}</td><td>${i.current_semester}º semestre</td><td>${access}</td><td>${status}</td><td><button class="action secondary edit-intern" data-id="${i.id}" style="padding:7px 10px">Editar</button></td></tr>`;
  }).join('');

  wrap.innerHTML=`<div style="overflow:auto"><table><tr><th>Nome</th><th>Matrícula</th><th>Período</th><th>Acesso</th><th>Status</th><th>Ações</th></tr>${rows||'<tr><td colspan="6">Nenhum estagiário cadastrado.</td></tr>'}</table></div>`;

  const panel=document.getElementById('internFormPanel'), titleForm=document.getElementById('internFormTitle');
  let editingId=null;
  const reset=()=>{editingId=null;titleForm.textContent='Novo estagiário';['Name','Registration','Whatsapp','Semester','Approaches','Audience'].forEach(x=>{const e=document.getElementById('newIntern'+x);if(e)e.value=''});document.getElementById('newInternStatus').value='ativo';document.getElementById('internFormMessage').style.display='none'};

  document.getElementById('newInternBtn').onclick=()=>{reset();panel.classList.remove('hidden');panel.scrollIntoView({behavior:'smooth'})};
  document.getElementById('cancelInternBtn').onclick=()=>{panel.classList.add('hidden');reset()};
};

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

const availabilityPage = async () => {
  const isIntern = currentContext === 'estagiario';
  content.innerHTML = `
    <section class="panel">
      <div class="toolbar">
        <div>
          <h2>${isIntern ? 'Minha disponibilidade' : 'Disponibilidade dos estagiários'}</h2>
          <div class="subtle">Funcionalidade será conectada ao Supabase nas próximas fases.</div>
        </div>
      </div>
    </section>`;
};

const availabilitySettingsPage = async () => {
  content.innerHTML=`
    <section class="panel">
      <div class="toolbar">
        <div>
          <h2>Quadro de horários da clínica</h2>
          <div class="subtle">A coordenação define quais intervalos ficam liberados.</div>
        </div>
      </div>
      <div class="notice">
        Funcionalidade será conectada ao Supabase nas próximas fases. Por favor retorne para visualizar o protótipo local clicando em Dashboard e depois em Configurações novamente.
      </div>
    </section>`;
};

const agendaMockPage = () => {
  content.innerHTML = `
    <section class="panel">
      <div class="toolbar">
        <div>
          <h2>Agenda</h2>
          <div class="subtle">Visualização semanal dos atendimentos. (Conexão Supabase em breve)</div>
        </div>
      </div>
    </section>`;
};

const ecPrototypeAgenda = () => {
  content.innerHTML=`
  <section class="panel">
    <div class="toolbar">
      <div><h2>Agenda</h2><div class="ec-muted">Visualize os atendimentos por dia, semana ou mês.</div></div>
      <button class="action" id="ecNewAppointment">+ Novo agendamento</button>
    </div>
    <div class="ec-pills">
      <button class="action secondary ec-view active" data-view="dia">Dia</button>
      <button class="action secondary ec-view" data-view="semana">Semana</button>
      <button class="action secondary ec-view" data-view="mes">Mês</button>
      <button class="action secondary ec-filter">Todos os estagiários</button>
      <button class="action secondary ec-filter">Todos os pacientes</button>
    </div>
    <div class="ec-calendar">
      <div class="ec-head">Horário</div><div class="ec-head">Seg</div><div class="ec-head">Ter</div><div class="ec-head">Qua</div><div class="ec-head">Qui</div><div class="ec-head">Sex</div><div class="ec-head">Sáb</div>
      <div>13:00</div><div></div><div class="ec-appt ec-confirmed"><strong>13–14h</strong><span>#00342</span><small>João • Confirmado</small></div><div></div><div></div><div></div><div></div>
      <div>14:00</div><div class="ec-appt ec-confirmed"><strong>14–15h</strong><span>#00501</span><small>Ana • Confirmado</small></div><div></div><div class="ec-appt ec-wait"><strong>14–15h</strong><span>#00418</span><small>Lucas • Aguardando</small></div><div></div><div></div><div></div>
      <div>15:00</div><div></div><div class="ec-appt ec-no"><strong>15–16h</strong><span>#00277</span><small>João • Não confirmado</small></div><div></div><div></div><div></div><div></div>
      <div>16:00</div><div></div><div></div><div class="ec-appt ec-confirmed"><strong>16–17h</strong><span>#00604</span><small>Ana • Confirmado</small></div><div></div><div></div><div></div>
    </div>
  </section>
  <div class="ec-modal" id="ecAppointmentModal"><div class="ec-modal-box">
    <div class="toolbar"><h2>Novo agendamento</h2><button class="action secondary" id="ecClose">Fechar</button></div>
    <div class="formgrid">
      <div class="field"><label>Paciente</label><select><option>#00342 — Ana Beatriz</option><option>#00418 — Maria Clara</option></select></div>
      <div class="field"><label>Estagiário</label><select><option>João Pedro</option><option>Ana Beatriz</option><option>Lucas Almeida</option><option>Todos</option></select></div>
      <div class="field"><label>Início</label><input type="date" value="2026-08-17"></div>
      <div class="field"><label>Fim</label><input type="date" value="2026-12-18"></div>
      <div class="field"><label>Dia da semana</label><select><option>Segunda-feira</option><option>Terça-feira</option><option>Quarta-feira</option><option>Quinta-feira</option><option>Sexta-feira</option><option>Sábado</option></select></div>
      <div class="field"><label>Horário</label><select><option>13:00–14:00</option><option>14:00–15:00</option><option>15:00–16:00</option><option>16:00–17:00</option></select></div>
    </div>
    <div class="notice" style="margin-top:14px">O sistema verificará automaticamente: horário liberado pela clínica, disponibilidade do estagiário, disponibilidade do paciente e conflitos.</div>
    <div class="ec-actions"><button class="action secondary" id="ecCancel">Cancelar</button><button class="action" id="ecConfirm">Confirmar e gerar atendimentos</button></div>
  </div></div>`;
  
  const modal=document.getElementById('ecAppointmentModal');
  document.getElementById('ecNewAppointment').onclick=()=>modal.style.display='flex';
  document.getElementById('ecClose').onclick=()=>modal.style.display='none';
  document.getElementById('ecCancel').onclick=()=>modal.style.display='none';
  document.getElementById('ecConfirm').onclick=()=>{
    alert('Protótipo validado. A geração real será conectada ao banco depois da auditoria.');
    modal.style.display='none';
  };
};

const ecPrototypePatients = () => {
  content.innerHTML=`
  <section class="panel"><div class="toolbar"><div><h2>Pacientes</h2><div class="ec-muted">Cadastro e disponibilidade dos pacientes.</div></div><button class="action" id="ecNewPatient">+ Novo paciente</button></div>
  <table><tr><th>Inscrição</th><th>Nome</th><th>Idade</th><th>Gênero</th><th>Disponibilidade</th><th>Status</th></tr>
  <tr><td>#00342</td><td>Ana Beatriz</td><td>24</td><td>Mulher cisgênero</td><td>Seg–Qua, 13h–17h</td><td><span class="ec-status ec-green">Ativo</span></td></tr>
  <tr><td>#00418</td><td>Maria Clara</td><td>31</td><td>Mulher transgênero</td><td>Ter, 14h–17h</td><td><span class="ec-status ec-green">Ativo</span></td></tr>
  <tr><td>#00501</td><td>Não informado</td><td>19</td><td>Prefiro não informar</td><td>Qui, 13h–15h</td><td><span class="ec-status ec-gray">Inativo</span></td></tr></table></section>
  <div class="ec-modal" id="ecPatientModal"><div class="ec-modal-box"><div class="toolbar"><h2>Novo paciente</h2><button class="action secondary" id="ecPatientClose">Fechar</button></div>
  <div class="formgrid">
    <div class="field"><label>Número de inscrição *</label><input placeholder="Ex.: 00342"></div>
    <div class="field"><label>Nome</label><input placeholder="Opcional"></div>
    <div class="field"><label>Idade</label><input type="number" min="0"></div>

function showMessage(text, type='error') {
  loginMessage.textContent = text;
  loginMessage.className = 'message ' + type;
}

async function loadProfile(user) {
  const { data: profile, error: profileError } = await db
    .from('profiles')
    .select('id, full_name, role')
    .eq('id', user.id)
    .single();

  if (profileError) {
    throw new Error('Conta validada, mas o perfil no banco não foi encontrado. Execute o script SQL e cadastre o perfil.');
  }

  currentProfile = profile;

  const { data: intern } = await db
    .from('interns')
    .select('id, full_name, registration_number, current_semester, status')
    .eq('user_id', user.id)
    .maybeSingle();

  currentIntern = intern;
  userName.textContent = `${profile.full_name} • ${profile.role === 'coordenador_agenda' ? 'Coordenação da agenda' : 'Estagiário'}`;

  const canCoordinate = profile.role === 'coordenador_agenda' || profile.role === 'coordenador_projeto';
  const canIntern = !!intern;

  contextSelect.style.display = (canCoordinate && canIntern) ? 'block' : 'none';
  currentContext = canCoordinate ? 'coordenacao' : 'estagiario';
  contextSelect.value = currentContext;
  currentPage = 'dashboard';
  
  loadingScreen.style.display = 'none';
  loginScreen.style.display = 'none';
  app.style.display = 'flex';
  
  updateContextNavigation();
  render();
}

function updateContextNavigation() {
  const pages = currentContext === 'coordenacao' 
    ? ['dashboard', 'agenda', 'estagiarios', 'pacientes', 'relatorio', 'regras_horario'] 
    : ['dashboard', 'meus', 'disponibilidade'];
  buildNav(pages);
}

function buildNav(pages) {
  const labels = {
    dashboard:'Dashboard', agenda:'Agenda', estagiarios:'Estagiários',
    pacientes:'Pacientes', relatorio:'Relatórios', regras_horario:'Configurações',
    disponibilidade:'Minha disponibilidade', meus:'Meus agendamentos'
  };
  nav.innerHTML = pages.map(p => `<button data-page="${p}">${labels[p] || p}</button>`).join('');
  nav.querySelectorAll('button').forEach(button => {
    button.addEventListener('click', () => {
      currentPage = button.dataset.page;
      render();
    });
  });
}

function render() {
  if (currentContext === 'coordenacao') {
    if (currentPage === 'agenda') { ecPrototypeAgenda(); return; }
    if (currentPage === 'pacientes') { ecPrototypePatients(); return; }
    if (currentPage === 'relatorio' || currentPage === 'relatorios') { ecPrototypeReports(); return; }
    if (currentPage === 'regras_horario' || currentPage === 'configuracoes') { ecPrototypeSettings(); return; }
    if (currentPage === 'estagiarios') { internListPage(); return; }
  }
  
  const pages = currentContext === 'coordenacao' ? coordinatorPages : internPages;
  content.innerHTML = pages[currentPage] || pages.dashboard;
  title.textContent = ({
    dashboard:'Dashboard',agenda:'Agenda',estagiarios:'Estagiários',
    pacientes:'Pacientes',relatorio:'Relatórios',
    disponibilidade:'Minha disponibilidade',
    regras_horario:'Configurações',meus:'Meus agendamentos'
  })[currentPage] || 'Dashboard';
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.page === currentPage));
  bindSimplePageActions();
}

function bindSimplePageActions(){
  document.querySelectorAll('.confirmMock').forEach(b=>b.onclick=()=>{b.outerHTML='<span class="badge green">Confirmado</span>';});
  document.getElementById('dashboardAgendaBtn')?.addEventListener('click',()=>{currentPage='agenda';render();});
  document.getElementById('internAppointmentsBtn')?.addEventListener('click',()=>{currentPage='meus';render();});
}

loginForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  loginButton.disabled = true;
  loginButton.textContent = 'Entrando...';
  loginMessage.className = 'message';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const { data, error } = await db.auth.signInWithPassword({ email, password });

  if (error) {
    showMessage('Não foi possível entrar. Confira o e-mail e a senha.');
    loginButton.disabled = false;
    loginButton.textContent = 'Entrar';
    return;
  }

  try {
    await loadProfile(data.user);
  } catch (e) {
    await db.auth.signOut();
    showMessage(e.message || 'Não foi possível carregar seu perfil.');
  }

  loginButton.disabled = false;
  loginButton.textContent = 'Entrar';
});

contextSelect.addEventListener('change', () => {
  currentContext = contextSelect.value;
  currentPage = 'dashboard';
  updateContextNavigation();
  render();
  userName.textContent = currentContext === 'coordenacao'
    ? `${currentProfile.full_name} • Coordenação da agenda`
    : `${currentProfile.full_name} • Estagiário`;
});

logoutButton.addEventListener('click', async () => {
  await db.auth.signOut();
  app.style.display = 'none';
  loadingScreen.style.display = 'none';
  loginScreen.style.display = 'flex';
  loginForm.reset();
  showMessage('Você saiu do sistema.', 'success');
});

document.addEventListener('click', (event) => {
  const toggle = event.target.closest('.ec-toggle-slot');
  if(toggle){
    const open = toggle.classList.contains('ec-open');
    toggle.classList.toggle('ec-open', !open);
    toggle.classList.toggle('ec-closed', open);
    toggle.textContent = open ? '⚪ Fechado' : '🟢 Liberado';
    return;
  }
  const view = event.target.closest('.ec-view');
  if(view){
    document.querySelectorAll('.ec-view').forEach(b=>b.classList.remove('active'));
    view.classList.add('active');
    return;
  }
});

(async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (session?.user) {
    try {
      await loadProfile(session.user);
    } catch (e) {
      await db.auth.signOut();
      loadingScreen.style.display = 'none';
      loginScreen.style.display = 'flex';
      showMessage(e.message || 'Não foi possível carregar seu perfil.');
    }
  } else {
    loadingScreen.style.display = 'none';
    loginScreen.style.display = 'flex';
  }
})();
</script>
