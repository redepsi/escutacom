<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Projeto Escuta Comunitária">
<title>Projeto Escuta Comunitária</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:min(420px,100%);background:#fff;border:1px solid #e5e9ef;border-radius:16px;padding:34px;box-shadow:0 12px 35px rgba(23,32,51,.07)}
.brand{text-align:center;margin-bottom:28px}
.brand h1{margin:0;color:#315c8c;font-size:23px}
.brand p{color:#667085;font-size:13px;margin:8px 0 0}

.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
.field input,.field select{width:100%;padding:12px;border:1px solid #d5dbe4;border-radius:9px;font-size:14px;outline:none;background:#fff}
.field input:focus,.field select:focus{border-color:#315c8c}

.btn{width:100%;border:0;background:#315c8c;color:#fff;padding:12px 14px;border-radius:9px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6;cursor:not-allowed}

.message{display:none;margin-top:14px;padding:11px 12px;border-radius:8px;font-size:13px}
.message.error{display:block;background:#fdecec;color:#b42318}
.message.success{display:block;background:#e8f5ee;color:#2f855a}

.app{display:none;min-height:100vh}
.side{width:240px;background:#fff;border-right:1px solid #e5e9ef;padding:24px 14px;flex-shrink:0}
.logo{font-weight:800;font-size:17px;margin:0 12px 28px}
.logo span{color:#315c8c}
.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;border-radius:9px;margin:4px 0;color:#475467;font-size:14px;cursor:pointer}
.nav button.active{background:#e8f0f8;color:#315c8c;font-weight:700}

.main{flex:1;padding:28px 36px;max-width:1400px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.top h1{margin:0;font-size:24px}
.profile{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.context-select{padding:10px 14px;border:1px solid #d5dbe4;border-radius:9px;background:#fff;font-weight:700;cursor:pointer}
.user{background:#fff;border:1px solid #e5e9ef;padding:10px 14px;border-radius:9px;font-size:13px}
.action{border:0;background:#315c8c;color:#fff;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer}
.action.active{background:#315c8c;color:#fff}
.secondary{background:#fff;color:#315c8c;border:1px solid #cbd6e2}
.secondary.active{background:#315c8c;color:#fff;border-color:#315c8c}

.panel{background:#fff;border:1px solid #e5e9ef;border-radius:12px;padding:20px;margin-bottom:20px}
.panel h2{font-size:17px;margin:0 0 6px}
.muted{color:#667085;font-size:13px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.notice{padding:12px 14px;border-radius:8px;background:#fff5d8;color:#6b4b00;font-size:13px;margin-bottom:14px}

.schedule-grid{display:grid;grid-template-columns:90px repeat(6,1fr);border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;background:#fff;gap:1px;background-color:#e5e7eb}
.schedule-grid>div{background:#fff;padding:10px;min-height:56px;display:flex;align-items:center;justify-content:center;text-align:center}
.schedule-head{background:#f8fafc!important;font-weight:700}
.slot-btn{width:100%;height:100%;min-height:48px;font:inherit;font-weight:700;font-size:12px;text-align:center;cursor:pointer;border-radius:8px;border:1px solid transparent;transition:.1s}
.slot-btn:hover{filter:brightness(.96)}
.slot-open{background:#e9f7ef;color:#176b36;border-color:#bce3cc}
.slot-closed{background:#f3f4f6;color:#98a2b3;border-color:#e5e7eb}

.placeholder{padding:40px 20px;text-align:center;color:#98a2b3}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-box{background:#fff;border-radius:16px;padding:24px;width:min(480px,100%);max-height:90vh;overflow:auto}

#loadingScreen{display:flex;flex-direction:column;gap:12px}
.spinner{border:3px solid #f3f3f3;border-top:3px solid #315c8c;border-radius:50%;width:30px;height:30px;animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

@media(max-width:850px){.side{display:none}.main{padding:20px}.schedule-grid{grid-template-columns:60px repeat(6,minmax(90px,1fr));font-size:11px}}
</style>
</head>
<body>

<div id="loadingScreen" class="login-wrap">
  <div class="brand">
    <div class="spinner"></div>
    <p>Conectando ao sistema...</p>
  </div>
</div>

<div id="loginScreen" class="login-wrap" style="display:none">
  <div class="login-card">
    <div class="brand">
      <h1>Projeto Escuta Comunitária</h1>
      <p>Gestão de atendimentos psicológicos</p>
    </div>
    <form id="loginForm">
      <div class="field">
        <label for="email">E-mail (coordenação) ou matrícula (estagiário)</label>
        <input id="email" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button id="loginButton" class="btn" type="submit">Entrar</button>
      <div id="loginMessage" class="message"></div>
      <div style="text-align:center;margin-top:14px">
        <a href="#" id="forgotPasswordLink" style="font-size:13px;color:#315c8c">Esqueci minha senha</a>
      </div>
    </form>

    <form id="forgotPasswordForm" style="display:none">
      <div class="field">
        <label for="forgotIdentifier">E-mail (coordenação) ou matrícula (estagiário)</label>
        <input id="forgotIdentifier" type="text" autocomplete="username" required>
      </div>
      <button id="forgotPasswordButton" class="btn" type="submit">Enviar link de redefinição</button>
      <div id="forgotPasswordMessage" class="message"></div>
      <div style="text-align:center;margin-top:14px">
        <a href="#" id="backToLoginLink" style="font-size:13px;color:#315c8c">Voltar para o login</a>
      </div>
    </form>
  </div>
</div>

<div id="newPasswordScreen" class="login-wrap" style="display:none">
  <div class="login-card">
    <div class="brand">
      <h1>Definir nova senha</h1>
      <p>Escolha uma nova senha de acesso</p>
    </div>
    <form id="newPasswordForm">
      <div class="field">
        <label for="newPassword1">Nova senha</label>
        <input id="newPassword1" type="password" autocomplete="new-password" required minlength="6">
      </div>
      <div class="field">
        <label for="newPassword2">Confirmar nova senha</label>
        <input id="newPassword2" type="password" autocomplete="new-password" required minlength="6">
      </div>
      <button id="newPasswordButton" class="btn" type="submit">Salvar nova senha</button>
      <div id="newPasswordMessage" class="message"></div>
    </form>
  </div>
</div>

<div id="app" class="app" style="display:none">
  <aside class="side">
    <div class="logo">Escuta <span>Comunitária</span></div>
    <nav id="nav" class="nav"></nav>
  </aside>
  <main class="main">
    <div class="top">
      <div>
        <h1 id="pageTitle">Início</h1>
      </div>
      <div class="profile">
        <div class="user" id="userName">Carregando...</div>
        <select id="contextSelect" class="context-select" style="display:none">
          <option value="coordenacao">Coordenação</option>
          <option value="estagiario">Meu perfil de estagiário</option>
        </select>
        <button id="changePasswordButton" class="action secondary">Alterar senha</button>
        <button id="logoutButton" class="action secondary">Sair</button>
      </div>
    </div>
    <div id="content"></div>
  </main>
</div>

<div id="changePasswordModal" class="modal-overlay">
  <div class="modal-box">
    <h3 style="margin-top:0">Alterar minha senha</h3>
    <div class="field"><label>Nova senha</label><input id="cpNewPassword1" type="password" autocomplete="new-password" minlength="6"></div>
    <div class="field"><label>Confirmar nova senha</label><input id="cpNewPassword2" type="password" autocomplete="new-password" minlength="6"></div>
    <div id="changePasswordMsg" class="message"></div>
    <div style="display:flex;gap:10px;margin-top:10px">
      <button id="cpSaveBtn" class="action">Salvar nova senha</button>
      <button id="cpCloseBtn" class="action secondary">Cancelar</button>
    </div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// CONFIGURAÇÃO DO SUPABASE
// ---------------------------------------------------------------------------
const SUPABASE_URL = 'https://qphcrtpngwgsszhtuctf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yo7cUtMbnflkSERbocknig_ZwYXw-B6';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// ---------------------------------------------------------------------------
// ELEMENTOS DA TELA
// ---------------------------------------------------------------------------
const loadingScreen = document.getElementById('loadingScreen');
const loginScreen = document.getElementById('loginScreen');
const app = document.getElementById('app');
const loginForm = document.getElementById('loginForm');
const loginButton = document.getElementById('loginButton');
const loginMessage = document.getElementById('loginMessage');
const logoutButton = document.getElementById('logoutButton');
const contextSelect = document.getElementById('contextSelect');
const userName = document.getElementById('userName');
const content = document.getElementById('content');
const nav = document.getElementById('nav');
const pageTitle = document.getElementById('pageTitle');

// ---------------------------------------------------------------------------
// ESTADO GLOBAL
// ---------------------------------------------------------------------------
let currentProfile = null;   // linha de profiles
let currentIntern = null;    // linha de interns, se existir para este usuário
let currentContext = 'coordenacao'; // 'coordenacao' ou 'estagiario'
let currentPage = 'inicio';

const WEEKDAYS = [
  { n: 1, l: 'Segunda' }, { n: 2, l: 'Terça' }, { n: 3, l: 'Quarta' },
  { n: 4, l: 'Quinta' }, { n: 5, l: 'Sexta' }, { n: 6, l: 'Sábado' }
];

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

function showMessage(text, type = 'error') {
  loginMessage.textContent = text;
  loginMessage.className = 'message ' + type;
}

// ---------------------------------------------------------------------------
// LOGIN / LOGOUT
// ---------------------------------------------------------------------------
loginForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  loginButton.disabled = true;
  loginButton.textContent = 'Entrando...';
  loginMessage.className = 'message';

  const identifier = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  let emailToUse = identifier;
  if (!identifier.includes('@')) {
    const { data: resolvedEmail, error: lookupError } = await db.rpc('get_email_by_registration', { p_registration: identifier });
    if (lookupError || !resolvedEmail) {
      showMessage('Matrícula não encontrada. Confira o número digitado.');
      loginButton.disabled = false;
      loginButton.textContent = 'Entrar';
      return;
    }
    emailToUse = resolvedEmail;
  }

  const { data, error } = await db.auth.signInWithPassword({ email: emailToUse, password });

  if (error) {
    showMessage('Erro ao entrar. Confira os dados e a senha.');
    loginButton.disabled = false;
    loginButton.textContent = 'Entrar';
    return;
  }

  try {
    await loadProfile(data.user);
  } catch (e) {
    await db.auth.signOut();
    showMessage(e.message || 'Erro ao carregar perfil.');
  }
  loginButton.disabled = false;
  loginButton.textContent = 'Entrar';
});

// ---------------------------------------------------------------------------
// ESQUECI MINHA SENHA (a partir da tela de login)
// ---------------------------------------------------------------------------
const forgotPasswordForm = document.getElementById('forgotPasswordForm');
const forgotPasswordButton = document.getElementById('forgotPasswordButton');
const forgotPasswordMessage = document.getElementById('forgotPasswordMessage');

document.getElementById('forgotPasswordLink').addEventListener('click', (e) => {
  e.preventDefault();
  loginForm.style.display = 'none';
  forgotPasswordForm.style.display = 'block';
  forgotPasswordMessage.style.display = 'none';
  document.getElementById('forgotIdentifier').value = document.getElementById('email').value;
});

document.getElementById('backToLoginLink').addEventListener('click', (e) => {
  e.preventDefault();
  forgotPasswordForm.style.display = 'none';
  loginForm.style.display = 'block';
});

forgotPasswordForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  forgotPasswordButton.disabled = true;
  forgotPasswordButton.textContent = 'Enviando...';
  forgotPasswordMessage.style.display = 'none';

  const identifier = document.getElementById('forgotIdentifier').value.trim();
  let emailToUse = identifier;

  if (!identifier.includes('@')) {
    const { data: resolvedEmail, error: lookupError } = await db.rpc('get_email_by_registration', { p_registration: identifier });
    if (lookupError || !resolvedEmail) {
      forgotPasswordMessage.textContent = 'Matrícula não encontrada. Confira o número digitado.';
      forgotPasswordMessage.className = 'message error'; forgotPasswordMessage.style.display = 'block';
      forgotPasswordButton.disabled = false;
      forgotPasswordButton.textContent = 'Enviar link de redefinição';
      return;
    }
    emailToUse = resolvedEmail;
  }

  const { error } = await db.auth.resetPasswordForEmail(emailToUse, {
    redirectTo: window.location.origin + window.location.pathname
  });

  forgotPasswordButton.disabled = false;
  forgotPasswordButton.textContent = 'Enviar link de redefinição';

  if (error) {
    forgotPasswordMessage.textContent = 'Erro ao enviar: ' + error.message;
    forgotPasswordMessage.className = 'message error';
  } else {
    forgotPasswordMessage.textContent = `Se o cadastro existir, um link foi enviado para ${emailToUse}. Confira sua caixa de entrada.`;
    forgotPasswordMessage.className = 'message success';
  }
  forgotPasswordMessage.style.display = 'block';
});

logoutButton.addEventListener('click', async () => {
  await db.auth.signOut();
  app.style.display = 'none';
  loadingScreen.style.display = 'none';
  loginScreen.style.display = 'flex';
  loginForm.style.display = 'block';
  forgotPasswordForm.style.display = 'none';
  loginForm.reset();
  showMessage('Você saiu do sistema.', 'success');
});

// ---------------------------------------------------------------------------
// ALTERAR MINHA SENHA (qualquer usuário logado)
// ---------------------------------------------------------------------------
const changePasswordModal = document.getElementById('changePasswordModal');
const changePasswordMsg = document.getElementById('changePasswordMsg');

document.getElementById('changePasswordButton').addEventListener('click', () => {
  document.getElementById('cpNewPassword1').value = '';
  document.getElementById('cpNewPassword2').value = '';
  changePasswordMsg.style.display = 'none';
  changePasswordModal.style.display = 'flex';
});

document.getElementById('cpCloseBtn').addEventListener('click', () => {
  changePasswordModal.style.display = 'none';
});

document.getElementById('cpSaveBtn').addEventListener('click', async () => {
  const p1 = document.getElementById('cpNewPassword1').value;
  const p2 = document.getElementById('cpNewPassword2').value;
  changePasswordMsg.style.display = 'none';

  if (p1.length < 6) {
    changePasswordMsg.textContent = 'A senha deve ter no mínimo 6 caracteres.';
    changePasswordMsg.className = 'message error'; changePasswordMsg.style.display = 'block';
    return;
  }
  if (p1 !== p2) {
    changePasswordMsg.textContent = 'As senhas não coincidem.';
    changePasswordMsg.className = 'message error'; changePasswordMsg.style.display = 'block';
    return;
  }

  const btn = document.getElementById('cpSaveBtn');
  btn.disabled = true; btn.textContent = 'Salvando...';
  const { error } = await db.auth.updateUser({ password: p1 });
  btn.disabled = false; btn.textContent = 'Salvar nova senha';

  if (error) {
    changePasswordMsg.textContent = 'Erro ao salvar: ' + error.message;
    changePasswordMsg.className = 'message error'; changePasswordMsg.style.display = 'block';
    return;
  }

  changePasswordModal.style.display = 'none';
  alert('Senha alterada com sucesso.');
});

// ---------------------------------------------------------------------------
// CARREGAMENTO DO PERFIL LOGADO
// ---------------------------------------------------------------------------
function defaultPageForContext(context) {
  return context === 'coordenacao' ? 'inicio' : 'minha_agenda';
}

async function loadProfile(user) {
  const { data: profile, error: profileError } = await db
    .from('profiles').select('id, full_name, role').eq('id', user.id).single();
  if (profileError) throw new Error('Este usuário não possui um perfil cadastrado no sistema.');

  currentProfile = profile;

  const { data: intern } = await db
    .from('interns').select('*').eq('id', user.id).maybeSingle();
  currentIntern = intern || null;

  const isCoord = profile.role === 'coordenador_agenda' || profile.role === 'coordenador_projeto';

  // Se a pessoa é coordenação E também tem perfil de estagiário, mostra o seletor
  if (isCoord && currentIntern) {
    contextSelect.style.display = 'block';
    contextSelect.value = 'coordenacao';
    currentContext = 'coordenacao';
  } else {
    contextSelect.style.display = 'none';
    currentContext = isCoord ? 'coordenacao' : 'estagiario';
  }

  updateUserLabel();
  currentPage = defaultPageForContext(currentContext);
  loadingScreen.style.display = 'none';
  loginScreen.style.display = 'none';
  app.style.display = 'flex';

  buildNav();
  render();
}

function updateUserLabel() {
  const label = currentContext === 'coordenacao' ? 'Coordenação' : 'Estagiário';
  userName.textContent = `${currentProfile.full_name} • ${label}`;
}

contextSelect.addEventListener('change', () => {
  currentContext = contextSelect.value;
  currentPage = defaultPageForContext(currentContext);
  updateUserLabel();
  buildNav();
  render();
});

// ---------------------------------------------------------------------------
// MENU
// ---------------------------------------------------------------------------
const COORD_PAGES = [
  { id: 'inicio', label: 'Início' },
  { id: 'agenda', label: 'Agenda' },
  { id: 'grade_geral', label: 'Grade Geral' },
  { id: 'pacientes', label: 'Pacientes' },
  { id: 'estagiarios', label: 'Estagiários' },
  { id: 'relatorios', label: 'Relatórios' },
  { id: 'configuracoes', label: 'Horários' }
];

const INTERN_PAGES = [
  { id: 'minha_agenda', label: 'Minha agenda' },
  { id: 'minha_disponibilidade', label: 'Minha disponibilidade' },
  { id: 'meu_perfil', label: 'Meu perfil' }
];

function buildNav() {
  const pages = currentContext === 'coordenacao' ? COORD_PAGES : INTERN_PAGES;
  nav.innerHTML = pages.map(p => `<button data-page="${p.id}">${p.label}</button>`).join('');
  nav.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      currentPage = btn.dataset.page;
      render();
    });
  });
}

function updateActiveNav() {
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.page === currentPage));
}

// ---------------------------------------------------------------------------
// ROTEAMENTO DE PÁGINAS
// ---------------------------------------------------------------------------
const PAGE_TITLES = {
  inicio: 'Início', agenda: 'Agenda', grade_geral: 'Grade Geral de Disponibilidade',
  pacientes: 'Pacientes', estagiarios: 'Estagiários', relatorios: 'Relatórios',
  configuracoes: 'Horários', minha_agenda: 'Minha agenda',
  minha_disponibilidade: 'Minha disponibilidade', meu_perfil: 'Meu perfil'
};

function render() {
  pageTitle.textContent = PAGE_TITLES[currentPage] || 'Início';
  updateActiveNav();

  if (currentPage === 'configuracoes') { renderConfiguracoes(); return; }
  if (currentPage === 'estagiarios') { renderEstagiarios(); return; }
  if (currentPage === 'pacientes') { renderPacientes(); return; }
  if (currentPage === 'minha_disponibilidade') { renderMinhaDisponibilidade(); return; }
  if (currentPage === 'grade_geral') { renderGradeGeral(); return; }
  if (currentPage === 'agenda') { renderAgenda(); return; }
  if (currentPage === 'minha_agenda') { renderMinhaAgenda(); return; }
  if (currentPage === 'meu_perfil') { renderMeuPerfil(); return; }
  if (currentPage === 'relatorios') { renderRelatorios(); return; }
  if (currentPage === 'inicio') { renderInicioCoordenacao(); return; }

  // Páginas ainda não construídas
  content.innerHTML = `
    <section class="panel">
      <div class="placeholder">Este módulo será construído na próxima etapa.</div>
    </section>`;
}

// ---------------------------------------------------------------------------
// PÁGINA: INÍCIO (coordenação e estagiário)
// ---------------------------------------------------------------------------
function dateWithWeekday(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const wd = WEEKDAYS.find(w => w.n === d.getDay());
  return `${wd ? wd.l.slice(0, 3) : ''} ${fmtBr(dateStr)}`;
}

function miniApptTable(list, nameById, showEstagiario) {
  if (!list || list.length === 0) return `<div class="placeholder">Nada por aqui.</div>`;
  const rows = list.map(a => {
    const patLabel = a.patients ? `#${a.patients.registration_number} ${a.patients.full_name || ''}` : '—';
    const internCell = showEstagiario ? `<td style="text-align:left">${escapeHtml(nameById[a.intern_id] || '?')}</td>` : '';
    return `<tr>
      <td style="text-align:left">${dateWithWeekday(a.appointment_date)}</td>
      <td style="text-align:left">${a.start_time.slice(0,5)}–${a.end_time.slice(0,5)}</td>
      <td style="text-align:left">${escapeHtml(patLabel)}</td>
      ${internCell}
    </tr>`;
  }).join('');
  const internHead = showEstagiario ? '<th style="text-align:left">Estagiário</th>' : '';
  return `<table style="width:100%;border-collapse:collapse;font-size:13px">
    <tr style="font-size:12px;color:#667085"><th style="text-align:left">Data</th><th style="text-align:left">Horário</th><th style="text-align:left">Paciente</th>${internHead}</tr>
    ${rows}</table>`;
}

function hoursSinceEnd(dateStr, endTime) {
  const end = new Date(`${dateStr}T${endTime}`);
  return (new Date() - end) / 36e5;
}

function daysUntil(dateStr) {
  const target = new Date(dateStr + 'T00:00:00');
  const today = new Date(toDateStr(new Date()) + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}

function statCard(label, value, color) {
  return `<div class="panel" style="margin-bottom:0;padding:18px">
    <small class="muted">${label}</small>
    <div style="font-size:26px;font-weight:700;margin-top:8px;color:${color || '#172033'}">${value}</div>
  </div>`;
}

async function renderInicioCoordenacao() {
  content.innerHTML = `
    <div id="inicioCards" style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px">
      <div class="placeholder">Carregando...</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <section class="panel" style="margin-bottom:0"><h2>Próximos atendimentos</h2><div id="proximosWrap" class="placeholder">Carregando...</div></section>
      <section class="panel" style="margin-bottom:0"><h2>Ações necessárias</h2><div id="acoesWrap" class="placeholder">Carregando...</div></section>
    </div>`;

  const todayStr = toDateStr(new Date());
  const weekRange = getDateRange('semana', new Date());
  const weekStartStr = toDateStr(weekRange.start);
  const weekEndStr = toDateStr(weekRange.end);
  const monthRange = getDateRange('mes', new Date());
  const monthStartStr = toDateStr(monthRange.start);
  const monthEndStr = toDateStr(monthRange.end);

  const [{ data: weekAppts }, { data: upcoming }, { data: pendingConf }, { data: pendingAtt }] = await Promise.all([
    db.from('appointments').select('id, appointment_date, start_time, end_time, intern_confirmation, intern_id, patients(registration_number, full_name)')
      .gte('appointment_date', weekStartStr).lte('appointment_date', weekEndStr).eq('status', 'agendado').order('start_time'),
    db.from('appointments').select('id, appointment_date, start_time, end_time, intern_id, patients(registration_number, full_name)')
      .gt('appointment_date', todayStr).eq('status', 'agendado').order('appointment_date').order('start_time').limit(5),
    db.from('appointments').select('id, appointment_date, start_time, end_time, intern_id, intern_confirmation, patient_confirmation, patients(registration_number, full_name)')
      .gte('appointment_date', todayStr).lte('appointment_date', monthEndStr).eq('status', 'agendado')
      .or('intern_confirmation.eq.aguardando,patient_confirmation.eq.aguardando')
      .order('appointment_date').order('start_time'),
    db.from('appointments').select('id, appointment_date, start_time, end_time, intern_id, patients(registration_number, full_name)')
      .gte('appointment_date', monthStartStr).lte('appointment_date', todayStr).eq('status', 'agendado').eq('attendance_status', 'pendente')
      .order('appointment_date')
  ]);

  const allInternIds = [...new Set([...(weekAppts || []), ...(upcoming || []), ...(pendingConf || []), ...(pendingAtt || [])].map(a => a.intern_id))];
  const { data: profiles } = allInternIds.length ? await db.from('profiles').select('id, full_name').in('id', allInternIds) : { data: [] };
  const nameById = {};
  (profiles || []).forEach(p => { nameById[p.id] = p.full_name; });

  const total = (weekAppts || []).length;
  const confirmados = (weekAppts || []).filter(a => a.intern_confirmation === 'confirmado').length;
  const aguardando = (weekAppts || []).filter(a => a.intern_confirmation === 'aguardando').length;
  const naoConfirmados = (weekAppts || []).filter(a => a.intern_confirmation === 'nao_confirmado').length;

  document.getElementById('inicioCards').innerHTML =
    statCard('Atendimentos esta semana', total) +
    statCard('Confirmados', confirmados, '#2f855a') +
    statCard('Aguardando confirmação', aguardando, '#9a6700') +
    statCard('Não confirmados', naoConfirmados, '#b42318');

  document.getElementById('proximosWrap').innerHTML = miniApptTable(upcoming, nameById, true);

  // ---- Ações necessárias ----
  const confRows = (pendingConf || []).map(a => {
    const urgent = daysUntil(a.appointment_date) <= 1;
    const patLabel = a.patients ? `#${a.patients.registration_number} ${a.patients.full_name || ''}` : '—';
    const quem = [];
    if (a.intern_confirmation === 'aguardando') quem.push('estagiário');
    if (a.patient_confirmation === 'aguardando') quem.push('paciente');
    return `<tr>
      <td style="text-align:left">${fmtBr(a.appointment_date)}</td>
      <td style="text-align:left">${a.start_time.slice(0,5)}</td>
      <td style="text-align:left">${escapeHtml(patLabel)}</td>
      <td style="text-align:left">${escapeHtml(nameById[a.intern_id] || '?')}</td>
      <td style="text-align:left"><span style="color:${urgent ? '#b42318' : '#9a6700'};font-weight:700;font-size:12px">Confirmação de ${quem.join(' e ')} pendente</span></td>
    </tr>`;
  }).join('');

  const attRows = (pendingAtt || []).map(a => {
    const overdue = hoursSinceEnd(a.appointment_date, a.end_time) > 48;
    const patLabel = a.patients ? `#${a.patients.registration_number} ${a.patients.full_name || ''}` : '—';
    return `<tr>
      <td style="text-align:left">${fmtBr(a.appointment_date)}</td>
      <td style="text-align:left">${a.start_time.slice(0,5)}</td>
      <td style="text-align:left">${escapeHtml(patLabel)}</td>
      <td style="text-align:left">${escapeHtml(nameById[a.intern_id] || '?')}</td>
      <td style="text-align:left"><span style="color:${overdue ? '#b42318' : '#9a6700'};font-weight:700;font-size:12px">${overdue ? 'Presença atrasada (+48h)' : 'Presença ainda não registrada'}</span></td>
    </tr>`;
  }).join('');

  const acoesRows = confRows + attRows;
  document.getElementById('acoesWrap').innerHTML = acoesRows
    ? `<table style="width:100%;border-collapse:collapse;font-size:13px">
        <tr style="font-size:12px;color:#667085"><th style="text-align:left">Data</th><th style="text-align:left">Horário</th><th style="text-align:left">Paciente</th><th style="text-align:left">Estagiário</th><th style="text-align:left">Pendência</th></tr>
        ${acoesRows}</table>`
    : `<div class="placeholder">Nenhuma ação pendente no momento.</div>`;
}

async function loadInternStatsAndActions() {

      .eq('intern_id', currentIntern.id).gte('appointment_date', todayStr).eq('status', 'agendado').eq('intern_confirmation', 'aguardando')
      .order('appointment_date').order('start_time'),
    db.from('appointments').select('id, appointment_date, start_time, end_time, patients(registration_number, full_name)')
      .eq('intern_id', currentIntern.id).lte('appointment_date', todayStr).eq('status', 'agendado').eq('attendance_status', 'pendente')
      .order('appointment_date')
  ]);

  const total = (weekAppts || []).length;
  const confirmados = (weekAppts || []).filter(a => a.intern_confirmation === 'confirmado').length;
  const aguardando = (weekAppts || []).filter(a => a.intern_confirmation === 'aguardando').length;

  document.getElementById('inicioCards').innerHTML =
    statCard('Atendimentos esta semana', total) +
    statCard('Confirmados', confirmados, '#2f855a') +
    statCard('Horas realizadas', `${horasRealizadas || 0}h`);

  // Só urgente: confirmação para hoje/amanhã, ou presença atrasada (48h+)
  const urgentConf = (pendingConf || []).filter(a => daysUntil(a.appointment_date) <= 1);
  const urgentAtt = (pendingAtt || []).filter(a => hoursSinceEnd(a.appointment_date, a.end_time) >= 24);

  const confRows = urgentConf.map(a => {
    const patLabel = a.patients ? `#${a.patients.registration_number} ${a.patients.full_name || ''}` : '—';
    return `<tr>
      <td style="text-align:left">${fmtBr(a.appointment_date)}</td>
      <td style="text-align:left">${a.start_time.slice(0,5)}</td>
      <td style="text-align:left">${escapeHtml(patLabel)}</td>
      <td style="text-align:left"><span style="color:#b42318;font-weight:700;font-size:12px">Confirme urgente</span></td>
      <td><button class="action secondary action-confirm" data-id="${a.id}" style="padding:4px 8px;font-size:12px">Confirmar</button></td>
    </tr>`;
  }).join('');

  const attRows = urgentAtt.map(a => {
    const overdue = hoursSinceEnd(a.appointment_date, a.end_time) > 48;
    const patLabel = a.patients ? `#${a.patients.registration_number} ${a.patients.full_name || ''}` : '—';
    return `<tr>
      <td style="text-align:left">${fmtBr(a.appointment_date)}</td>
      <td style="text-align:left">${a.start_time.slice(0,5)}</td>
      <td style="text-align:left">${escapeHtml(patLabel)}</td>
      <td style="text-align:left"><span style="color:#b42318;font-weight:700;font-size:12px">${overdue ? 'Atrasado (+48h)' : 'Registre logo (perto de 48h)'}</span></td>
      <td><button class="action secondary toggle-presence-inline" data-id="${a.id}" data-current="pendente"
        style="padding:5px 10px;font-size:12px;background:#f3f4f6;color:#475467;border:1px solid #e5e7eb">Presença pendente</button></td>
    </tr>`;
  }).join('');

  const acoesRows = confRows + attRows;
  document.getElementById('acoesWrap').innerHTML = acoesRows
    ? `<table style="width:100%;border-collapse:collapse;font-size:13px">
        <tr style="font-size:12px;color:#667085"><th style="text-align:left">Data</th><th style="text-align:left">Horário</th><th style="text-align:left">Paciente</th><th style="text-align:left">Pendência</th><th style="text-align:left">Ação</th></tr>
        ${acoesRows}</table>`
    : `<div class="placeholder">Nenhum alerta urgente. Tudo em dia!</div>`;

  document.querySelectorAll('.action-confirm').forEach(btn => {
    btn.addEventListener('click', async () => {
      const { error } = await db.rpc('confirmar_atendimento', { p_appointment_id: btn.dataset.id, p_confirmacao: 'confirmado' });
      if (error) alert('Erro: ' + error.message); else renderMinhaAgenda();
    });
  });
  document.querySelectorAll('.toggle-presence-inline').forEach(btn => {
    btn.addEventListener('click', async () => {
      const current = btn.dataset.current;
      const next = current === 'presente' ? 'ausente' : 'presente';
      const { error } = await db.rpc('registrar_atendimento', { p_appointment_id: btn.dataset.id, p_status: next, p_cancelado_por: null });
      if (error) { alert('Erro: ' + error.message); return; }
      btn.dataset.current = next;
      if (next === 'presente') {
        btn.textContent = '✓ Compareceu';
        btn.style.background = '#e9f7ef'; btn.style.color = '#176b36'; btn.style.borderColor = '#bce3cc';
      } else {
        btn.textContent = '✗ Não compareceu';
        btn.style.background = '#fdecec'; btn.style.color = '#b42318'; btn.style.borderColor = '#f3c6c6';
      }
    });
  });
}

async function renderConfiguracoes() {
  content.innerHTML = `
    <section class="panel">
      <div class="toolbar">
        <div>
          <h2>Quadro de horários da clínica</h2>
          <div class="muted">Clique em um horário para alternar entre Liberado e Fechado.</div>
        </div>
        <button id="saveScheduleBtn" class="action">Salvar quadro</button>
      </div>
      <div id="scheduleMsg" class="message"></div>
      <div id="scheduleGrid" class="schedule-grid">
        <div style="grid-column:1/-1;padding:20px;text-align:center">Carregando horários...</div>
      </div>
    </section>`;

  const grid = document.getElementById('scheduleGrid');
  const msg = document.getElementById('scheduleMsg');

  const { data: slots, error } = await db
    .from('clinic_schedule_slots').select('*').order('start_time');

  if (error) {
    grid.innerHTML = `<div style="grid-column:1/-1;padding:20px;color:#b42318">Erro ao carregar: ${escapeHtml(error.message)}</div>`;
    return;
  }

  const times = [...new Set(slots.map(s => s.start_time.slice(0, 5)))].sort();

  let html = `<div class="schedule-head">Horário</div>` + WEEKDAYS.map(d => `<div class="schedule-head">${d.l}</div>`).join('');

  times.forEach(time => {
    const hour = parseInt(time.split(':')[0]);
    const endHour = String(hour + 1).padStart(2, '0') + 'h';
    html += `<div><strong>${time.slice(0,2)}h – ${endHour}</strong></div>`;
    WEEKDAYS.forEach(d => {
      const slot = slots.find(s => s.weekday === d.n && s.start_time.slice(0, 5) === time);
      if (!slot) { html += `<div></div>`; return; }
      const cls = slot.enabled ? 'slot-open' : 'slot-closed';
      const label = slot.enabled ? '🟢 Liberado' : '⚪ Fechado';
      html += `<div><button type="button" class="slot-btn ${cls}"
        data-id="${slot.id}" data-weekday="${slot.weekday}"
        data-start="${slot.start_time}" data-end="${slot.end_time}">${label}</button></div>`;
    });
  });

  grid.innerHTML = html;

  grid.querySelectorAll('.slot-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const open = btn.classList.contains('slot-open');
      btn.classList.toggle('slot-open', !open);
      btn.classList.toggle('slot-closed', open);
      btn.textContent = open ? '⚪ Fechado' : '🟢 Liberado';
    });
  });

  document.getElementById('saveScheduleBtn').addEventListener('click', async () => {
    const btn = document.getElementById('saveScheduleBtn');
    btn.disabled = true;
    btn.textContent = 'Salvando...';
    msg.style.display = 'none';

    const updates = Array.from(grid.querySelectorAll('.slot-btn')).map(b => ({
      id: b.dataset.id,
      weekday: parseInt(b.dataset.weekday),
      start_time: b.dataset.start,
      end_time: b.dataset.end,
      enabled: b.classList.contains('slot-open')
    }));

    const { error: saveError } = await db.from('clinic_schedule_slots').upsert(updates);

    if (saveError) {
      msg.textContent = 'Erro ao salvar: ' + saveError.message;
      msg.className = 'message error';
    } else {
      msg.textContent = 'Quadro de horários atualizado com sucesso.';
      msg.className = 'message success';
    }
    msg.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Salvar quadro';
  });
}

function exportReportPdf(title, bodyHtml) {
  const win = window.open('', '_blank');
  win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${title}</title>
    <style>
      body{font-family:Arial,sans-serif;padding:32px;color:#172033}
      h1{font-size:20px;margin-bottom:4px}
      .meta{color:#667085;font-size:13px;margin-bottom:20px}
      table{width:100%;border-collapse:collapse;margin-top:12px}
      th,td{border:1px solid #ddd;padding:8px;font-size:13px;text-align:left}
      th{background:#f5f7fb}
      .totals td{font-weight:700;background:#fafbfc}
    </style></head><body>
    <h1>${title}</h1>${bodyHtml}
    </body></html>`);
  win.document.close();
  win.focus();
  setTimeout(() => win.print(), 300);
}

async function computeInternMetrics(internId, startDate, endDate) {
  const { data: appts } = await db.from('appointments').select('id, patient_id, status, attendance_status')
    .eq('intern_id', internId).gte('appointment_date', startDate).lte('appointment_date', endDate);
  const all = appts || [];
  const ativos = all.filter(a => a.status === 'agendado');
  const presentes = ativos.filter(a => a.attendance_status === 'presente').length;
  const ausentes = ativos.filter(a => a.attendance_status === 'ausente').length;
  const cancelados = all.filter(a => a.status === 'cancelado').length;
  const pacientes = new Set(ativos.map(a => a.patient_id)).size;
  return {
    atendimentos: ativos.length, horasPrevistas: ativos.length, horasRealizadas: presentes,
    pacientes, presentes, ausentes, cancelados
  };
}

async function renderRelatorios() {
  content.innerHTML = `
    <section class="panel">
      <div class="toolbar"><h2>Relatórios</h2></div>
      <div style="display:flex;gap:6px;margin-bottom:18px">
        <button class="action secondary report-tab" data-v="individual">Individual</button>
        <button class="action secondary report-tab" data-v="geral">Geral</button>
      </div>
      <div id="reportFormWrap"></div>
      <div id="reportResultWrap" style="margin-top:20px"></div>
    </section>`;

  let reportView = 'individual';

  const { data: interns } = await db.from('interns').select('id');
  const internIds = (interns || []).map(i => i.id);
  const { data: profiles } = internIds.length ? await db.from('profiles').select('id, full_name').in('id', internIds) : { data: [] };
  const nameById = {};
  (profiles || []).forEach(p => { nameById[p.id] = p.full_name; });
  const internsList = internIds.map(id => ({ id, full_name: nameById[id] || '(sem nome)' })).sort((a, b) => a.full_name.localeCompare(b.full_name));

  function defaultDates() {
    const range = getDateRange('mes', new Date());
    return { start: toDateStr(range.start), end: toDateStr(range.end) };
  }

  function renderForm() {
    document.querySelectorAll('.report-tab').forEach(b => b.classList.toggle('active', b.dataset.v === reportView));
    const d = defaultDates();
    const formWrap = document.getElementById('reportFormWrap');

    if (reportView === 'individual') {
      formWrap.innerHTML = `
        <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end">
          <div class="field" style="margin-bottom:0"><label>Estagiário</label>
            <select id="repIntern">${internsList.map(i => `<option value="${i.id}">${escapeHtml(i.full_name)}</option>`).join('')}</select>
          </div>
          <div class="field" style="margin-bottom:0"><label>De</label><input type="date" id="repStart" value="${d.start}"></div>
          <div class="field" style="margin-bottom:0"><label>Até</label><input type="date" id="repEnd" value="${d.end}"></div>
          <button id="genReportBtn" class="action">Gerar relatório</button>
        </div>`;
    } else {
      formWrap.innerHTML = `
        <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end">
          <div class="field" style="margin-bottom:0"><label>De</label><input type="date" id="repStart" value="${d.start}"></div>
          <div class="field" style="margin-bottom:0"><label>Até</label><input type="date" id="repEnd" value="${d.end}"></div>
          <button id="genReportBtn" class="action">Gerar relatório</button>
        </div>`;
    }

    document.getElementById('genReportBtn').addEventListener('click', reportView === 'individual' ? generateIndividual : generateGeral);
    document.getElementById('reportResultWrap').innerHTML = '';
  }

  document.querySelectorAll('.report-tab').forEach(btn => {
    btn.addEventListener('click', () => { reportView = btn.dataset.v; renderForm(); });
  });

  async function generateIndividual() {
    const internId = document.getElementById('repIntern').value;
    const start = document.getElementById('repStart').value;
    const end = document.getElementById('repEnd').value;
    const resultWrap = document.getElementById('reportResultWrap');
    if (!internId || !start || !end || start > end) { resultWrap.innerHTML = `<div class="message error" style="display:block">Verifique o período.</div>`; return; }

    resultWrap.innerHTML = `<div class="placeholder">Gerando...</div>`;
    const internName = nameById[internId] || '?';
    const m = await computeInternMetrics(internId, start, end);

    const bodyHtml = `
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0">
        ${statCard('Atendimentos', m.atendimentos)}
        ${statCard('Horas previstas', m.horasPrevistas + 'h')}
        ${statCard('Horas realizadas', m.horasRealizadas + 'h')}
        ${statCard('Pacientes atendidos', m.pacientes)}
        ${statCard('Presenças', m.presentes, '#2f855a')}
        ${statCard('Ausências', m.ausentes, '#b42318')}
      </div>
      <div class="muted">Cancelamentos no período: <strong>${m.cancelados}</strong></div>`;

    resultWrap.innerHTML = `<div style="margin-bottom:12px"><button id="exportPdfBtn" class="action">Exportar PDF</button></div>${bodyHtml}`;

    document.getElementById('exportPdfBtn').addEventListener('click', () => {
      const pdfBody = `
        <div class="meta">${escapeHtml(internName)} · ${fmtBr(start)} a ${fmtBr(end)}</div>
        <table>
          <tr><th>Atendimentos</th><td>${m.atendimentos}</td></tr>
          <tr><th>Horas previstas</th><td>${m.horasPrevistas}h</td></tr>
          <tr><th>Horas realizadas</th><td>${m.horasRealizadas}h</td></tr>
          <tr><th>Pacientes atendidos</th><td>${m.pacientes}</td></tr>
          <tr><th>Presenças</th><td>${m.presentes}</td></tr>
          <tr><th>Ausências</th><td>${m.ausentes}</td></tr>
          <tr><th>Cancelamentos</th><td>${m.cancelados}</td></tr>
        </table>`;
      exportReportPdf(`Relatório individual — ${internName}`, pdfBody);
    });
  }

  async function generateGeral() {
    const start = document.getElementById('repStart').value;
    const end = document.getElementById('repEnd').value;
    const resultWrap = document.getElementById('reportResultWrap');
    if (!start || !end || start > end) { resultWrap.innerHTML = `<div class="message error" style="display:block">Verifique o período.</div>`; return; }

    resultWrap.innerHTML = `<div class="placeholder">Gerando...</div>`;
    const metricsList = await Promise.all(internsList.map(async i => ({ ...i, m: await computeInternMetrics(i.id, start, end) })));

    const totals = metricsList.reduce((acc, r) => ({
      atendimentos: acc.atendimentos + r.m.atendimentos,
      horasRealizadas: acc.horasRealizadas + r.m.horasRealizadas,
      presentes: acc.presentes + r.m.presentes,
      ausentes: acc.ausentes + r.m.ausentes,
      cancelados: acc.cancelados + r.m.cancelados
    }), { atendimentos: 0, horasRealizadas: 0, presentes: 0, ausentes: 0, cancelados: 0 });

    const rowsHtml = metricsList.map(r => `<tr>
      <td style="text-align:left">${escapeHtml(r.full_name)}</td>
      <td>${r.m.atendimentos}</td><td>${r.m.horasRealizadas}h</td><td>${r.m.pacientes}</td>
      <td>${r.m.presentes}</td><td>${r.m.ausentes}</td><td>${r.m.cancelados}</td>
    </tr>`).join('');

    const tableHtml = `<table style="width:100%;border-collapse:collapse;font-size:13px">
      <tr style="text-align:left;font-size:12px;color:#667085">
        <th style="text-align:left">Estagiário</th><th>Atend.</th><th>Horas realiz.</th><th>Pacientes</th><th>Presenças</th><th>Ausências</th><th>Cancelamentos</th>
      </tr>${rowsHtml}
      <tr style="font-weight:700;background:#fafbfc">
        <td style="text-align:left">Total</td><td>${totals.atendimentos}</td><td>${totals.horasRealizadas}h</td><td>—</td>
        <td>${totals.presentes}</td><td>${totals.ausentes}</td><td>${totals.cancelados}</td>
      </tr></table>`;

    resultWrap.innerHTML = `<div style="margin-bottom:12px"><button id="exportPdfBtn" class="action">Exportar PDF</button></div>${tableHtml}`;

    document.getElementById('exportPdfBtn').addEventListener('click', () => {
      const pdfRows = metricsList.map(r => `<tr>
        <td>${escapeHtml(r.full_name)}</td><td>${r.m.atendimentos}</td><td>${r.m.horasRealizadas}h</td>
        <td>${r.m.pacientes}</td><td>${r.m.presentes}</td><td>${r.m.ausentes}</td><td>${r.m.cancelados}</td>
      </tr>`).join('');
      const pdfBody = `
        <div class="meta">${fmtBr(start)} a ${fmtBr(end)}</div>
        <table>
          <tr><th>Estagiário</th><th>Atendimentos</th><th>Horas realizadas</th><th>Pacientes</th><th>Presenças</th><th>Ausências</th><th>Cancelamentos</th></tr>
          ${pdfRows}
          <tr class="totals"><td>Total</td><td>${totals.atendimentos}</td><td>${totals.horasRealizadas}h</td><td>—</td><td>${totals.presentes}</td><td>${totals.ausentes}</td><td>${totals.cancelados}</td></tr>
        </table>`;
      exportReportPdf('Relatório geral', pdfBody);
    });
  }

  renderForm();
}

function whatsappLink(whatsapp) {
  let digits = String(whatsapp || '').replace(/\D/g, '');
  if (!digits) return null;
  if (!digits.startsWith('55')) digits = '55' + digits;
  return `https://wa.me/${digits}`;
}

// Cliente temporário, separado do cliente principal, usado apenas para criar
// o login do estagiário sem afetar a sessão da coordenação que está logada.
function createTempAuthClient() {
  return createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
  });
}

      .or(`last_advanced_period_id.is.null,last_advanced_period_id.neq.${latestPeriod.id}`);

      return;
    }

    const rows = internsCache.map(i => {
      const wa = whatsappLink(i.whatsapp);
      const waHtml = wa ? `<a href="${wa}" target="_blank" rel="noopener">${escapeHtml(i.whatsapp)}</a>` : (escapeHtml(i.whatsapp) || '—');

        : `${i.current_semester}º`;

        <td><strong>${escapeHtml(i.full_name)}</strong><br><small class="muted">${escapeHtml(i.email)}</small></td>

        <td>${waHtml}</td>
        <td>${semestreCell}</td>
        <td>${statusBadge}</td>

    document.getElementById('fApproaches').value = '';
    document.getElementById('fAudience').value = '';
    document.getElementById('fStatus').value = 'ativo';
  }

  function openForm(intern) {
    resetForm();
    if (intern) {
      editingId = intern.id;
      formTitle.textContent = 'Editar estagiário';
      loginFields.style.display = 'none'; // login não é editado aqui
      document.getElementById('resetPasswordField').style.display = 'block';

      document.getElementById('fName').value = intern.full_name;
      document.getElementById('fRegistration').value = intern.registration_number || '';
      document.getElementById('fWhatsapp').value = intern.whatsapp || '';

      document.getElementById('fApproaches').value = intern.preferred_approaches || '';
      document.getElementById('fAudience').value = intern.preferred_audience || '';
      document.getElementById('fStatus').value = intern.status || 'ativo';

  document.getElementById('newInternBtn').addEventListener('click', () => openForm(null));

  document.getElementById('sendResetPasswordBtn').addEventListener('click', async () => {
    const email = document.getElementById('sendResetPasswordBtn').dataset.email;
    if (!email) return;
    const btn = document.getElementById('sendResetPasswordBtn');
    btn.disabled = true; btn.textContent = 'Enviando...';
    const { error } = await db.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname
    });
    btn.disabled = false; btn.textContent = 'Enviar link de redefinição de senha';
    if (error) {
      msg.textContent = 'Erro ao enviar: ' + error.message;
      msg.className = 'message error'; msg.style.display = 'block';
    } else {
      msg.textContent = `Link de redefinição enviado para ${email}.`;
      msg.className = 'message success'; msg.style.display = 'block';
    }
  });

  document.getElementById('saveInternBtn').addEventListener('click', async () => {
    const btn = document.getElementById('saveInternBtn');
    msg.style.display = 'none';

    const fullName = document.getElementById('fName').value.trim();
    const registration = document.getElementById('fRegistration').value.trim();
    const whatsapp = document.getElementById('fWhatsapp').value.trim();
    const semester = parseInt(document.getElementById('fSemester').value);
    const approaches = document.getElementById('fApproaches').value.trim() || null;
    const audience = document.getElementById('fAudience').value.trim() || null;
    const status = document.getElementById('fStatus').value;

    if (!fullName || !registration || !whatsapp || !semester) {
      msg.textContent = 'Preencha todos os campos obrigatórios.';
      msg.className = 'message error'; msg.style.display = 'block';
      return;
    }

    btn.disabled = true; btn.textContent = 'Salvando...';

    if (editingId) {
      // Edição: não mexe em login/e-mail, só nos dados cadastrais
      const { error: profileErr } = await db.from('profiles').update({ full_name: fullName }).eq('id', editingId);
      const { error: internErr } = await db.from('interns').update({
        registration_number: registration, whatsapp, current_semester: semester,
        preferred_approaches: approaches, preferred_audience: audience, status
      }).eq('id', editingId);

      if (profileErr || internErr) {
        msg.textContent = 'Erro ao salvar: ' + (profileErr || internErr).message;
        msg.className = 'message error'; msg.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Salvar estagiário';
        return;
      }
    } else {
      // Criação: precisa de e-mail e senha para gerar o login
      const email = document.getElementById('fEmail').value.trim();
      const password = document.getElementById('fPassword').value;

      if (!email || !password || password.length < 6) {
        msg.textContent = 'Informe e-mail e uma senha com no mínimo 6 caracteres.';
        msg.className = 'message error'; msg.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Salvar estagiário';
        return;
      }

      const tempClient = createTempAuthClient();
      const { data: signUpData, error: signUpError } = await tempClient.auth.signUp({ email, password });

      if (signUpError || !signUpData.user) {
        msg.textContent = 'Erro ao criar login: ' + (signUpError ? signUpError.message : 'usuário não criado.');
        msg.className = 'message error'; msg.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Salvar estagiário';
        return;
      }

      const newId = signUpData.user.id;

      const { error: profileErr } = await db.from('profiles').insert([{ id: newId, full_name: fullName, role: 'estagiario' }]);
      if (profileErr) {
        msg.textContent = 'Erro ao salvar perfil: ' + profileErr.message;
        msg.className = 'message error'; msg.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Salvar estagiário';
        return;
      }

      const { error: internErr } = await db.from('interns').insert([{
        id: newId, registration_number: registration, whatsapp, current_semester: semester,
        preferred_approaches: approaches, preferred_audience: audience, email, status
      }]);
      if (internErr) {
        msg.textContent = 'Erro ao salvar dados do estagiário: ' + internErr.message;
        msg.className = 'message error'; msg.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Salvar estagiário';
        return;
      }
    }

    panel.style.display = 'none';
    await loadList();
    btn.disabled = false; btn.textContent = 'Salvar estagiário';
  });

  await loadList();
}

function buildAvailabilityGrid(clinicSlots, selectedSlots) {
  const enabledSlots = (clinicSlots || []).filter(s => s.enabled);
  if (enabledSlots.length === 0) {
    return `<div class="placeholder">Nenhum horário liberado pela clínica ainda. Configure em "Horários".</div>`;
  }

  const times = [...new Set(enabledSlots.map(s => s.start_time.slice(0, 5)))].sort();

  let html = `<div class="schedule-grid"><div class="schedule-head">Horário</div>` +
    WEEKDAYS.map(d => `<div class="schedule-head">${d.l}</div>`).join('');

  times.forEach(time => {
    const hour = parseInt(time.split(':')[0]);
    const endHour = String(hour + 1).padStart(2, '0') + 'h';
    html += `<div><strong>${time.slice(0, 2)}h – ${endHour}</strong></div>`;
    WEEKDAYS.forEach(d => {
      const slot = enabledSlots.find(s => s.weekday === d.n && s.start_time.slice(0, 5) === time);
      if (!slot) { html += `<div style="color:#d0d5dd;font-size:11px">Fechado</div>`; return; }
      const isSelected = (selectedSlots || []).some(s => s.weekday === d.n && s.start_time.slice(0, 5) === time);
      const cls = isSelected ? 'slot-open' : 'slot-closed';
      const label = isSelected ? '✓ Disponível' : 'Livre';
      html += `<div><button type="button" class="slot-btn avail-toggle ${cls}"
        data-weekday="${d.n}" data-start="${slot.start_time}" data-end="${slot.end_time}">${label}</button></div>`;
    });
  });

  html += `</div>`;
  return html;
}

function bindAvailabilityToggles(container) {
  container.querySelectorAll('.avail-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const open = btn.classList.contains('slot-open');
      btn.classList.toggle('slot-open', !open);
      btn.classList.toggle('slot-closed', open);
      btn.textContent = open ? 'Livre' : '✓ Disponível';
    });
  });
}

function readSelectedSlots(container) {
  return Array.from(container.querySelectorAll('.avail-toggle.slot-open')).map(b => ({
    weekday: parseInt(b.dataset.weekday), start_time: b.dataset.start, end_time: b.dataset.end
  }));
}

function formatAvailabilityBadges(slots) {
  if (!slots || slots.length === 0) return `<span class="muted">Sem restrição</span>`;
  const byDay = {};
  slots.forEach(s => {
    if (!byDay[s.weekday]) byDay[s.weekday] = [];
    byDay[s.weekday].push(s.start_time.slice(0, 5));
  });
  return `<div style="display:flex;gap:4px">` + WEEKDAYS.map(d => {
    const hours = byDay[d.n];
    const has = !!hours;
    const bg = has ? '#e9f7ef' : '#f3f4f6';
    const fg = has ? '#176b36' : '#c3c9d3';
    const title = has ? hours.sort().join(', ') : 'Sem disponibilidade';
    return `<span title="${escapeHtml(title)}" style="width:28px;height:22px;border-radius:6px;background:${bg};color:${fg};
      font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center">${d.l.slice(0, 3)}</span>`;
  }).join('') + `</div>`;
}

function daysSince(dateStr) {
  const then = new Date(dateStr);
  const now = new Date();
  return Math.max(0, Math.floor((now - then) / (1000 * 60 * 60 * 24)));
}
