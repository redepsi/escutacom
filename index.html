        if (cp === 'confirmado') { cpStyle = 'background:#e9f7ef;color:#176b36;border:1px solid #bce3cc'; cpLabel = '✓ Confirmado'; }
        else if (cp === 'nao_confirmado') { cpStyle = 'background:#fdecec;color:#b42318;border:1px solid #f3c6c6'; cpLabel = '✗ Não confirmado'; }
        else { cpStyle = 'background:#f3f4f6;color:#475467;border:1px solid #e5e7eb'; cpLabel = 'Confirmar'; }
        patCell += `<br><button class="toggle-conf-patient" data-id="${a.id}" data-current="${cp}"
          style="${cpStyle};font-weight:700;padding:4px 9px;border-radius:8px;font-size:11px;cursor:pointer;margin-top:4px">${cpLabel}</button>`;

        const ci = a.intern_confirmation;
        let ciStyle, ciLabel;
        if (ci === 'confirmado') { ciStyle = 'background:#e9f7ef;color:#176b36;border:1px solid #bce3cc'; ciLabel = '✓ Confirmado'; }
        else if (ci === 'nao_confirmado') { ciStyle = 'background:#fdecec;color:#b42318;border:1px solid #f3c6c6'; ciLabel = '✗ Não confirmado'; }
        else { ciStyle = 'background:#f3f4f6;color:#475467;border:1px solid #e5e7eb'; ciLabel = 'Confirmar'; }
        internCell += `<br><button class="toggle-conf-intern" data-id="${a.id}" data-current="${ci}"
          style="${ciStyle};font-weight:700;padding:4px 9px;border-radius:8px;font-size:11px;cursor:pointer;margin-top:4px">${ciLabel}</button>`;
      }

      if (!isPast) {
        presCell = `<span class="muted" style="font-size:12px">Disponível no dia</span>`;
      } else {
        const att = a.attendance_status;
        let attStyle, attLabel2;
        if (att === 'presente') { attStyle = 'background:#e9f7ef;color:#176b36;border:1px solid #bce3cc'; attLabel2 = '✓ Compareceu'; }
        else if (att === 'ausente') { attStyle = 'background:#fdecec;color:#b42318;border:1px solid #f3c6c6'; attLabel2 = '✗ Não compareceu'; }
        else { attStyle = 'background:#f3f4f6;color:#475467;border:1px solid #e5e7eb'; attLabel2 = 'Marcar presença'; }
        presCell = `<button class="toggle-presence" data-id="${a.id}" data-current="${att}"
          style="${attStyle};font-weight:700;padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer">${attLabel2}</button>`;
      }
    }

    const whoCancelledLabel = { paciente: 'Paciente', estagiario: 'Estagiário', coordenacao: 'Coordenação' }[a.cancelled_by] || '';
    const reasonLabel = a.cancellation_reason ? CANCELLATION_REASON_LABELS[a.cancellation_reason] || '' : '';
    const acaoCell = isCancelled
      ? `<span title="${escapeHtml(reasonLabel)}" style="font-size:12px;color:#9a6700;font-weight:700">Cancelado por ${whoCancelledLabel}</span>
         <button class="action secondary open-appt-detail-btn" data-id="${a.id}" style="padding:3px 8px;font-size:11px;margin-left:6px">Editar</button>`
      : `<button class="action secondary open-appt-detail-btn" data-id="${a.id}" style="padding:4px 8px;font-size:12px">Editar</button>`;

    const roomCell = a.room ? escapeHtml(a.room) : '<span class="muted">—</span>';

    return `<tr style="${isCancelled ? 'opacity:.6' : ''}">
      <td style="padding:6px 8px">${a.start_time.slice(0,5)}–${a.end_time.slice(0,5)}</td>
      <td style="text-align:left">${roomCell}</td>
      <td>${patCell}</td>
      <td>${internCell}</td>
      <td>${presCell}</td>
      <td>${acaoCell}</td>
    </tr>`;
  }

  function renderDateGroups(list) {
    if (list.length === 0) return '';
    const byDate = {};
    list.forEach(a => { (byDate[a.appointment_date] = byDate[a.appointment_date] || []).push(a); });

    return Object.keys(byDate).sort().map(date => {
      const d = new Date(date + 'T00:00:00');
      const weekdayLabel = d.toLocaleDateString('pt-BR', { weekday: 'long' });
      const rows = byDate[date].map(renderApptRow).join('');
      return `<div style="margin:16px 0 6px;font-weight:700;text-transform:capitalize">${weekdayLabel}, ${fmtBr(date)}</div>
        <table style="width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed">
        <colgroup>
          <col style="width:10%"><col style="width:14%"><col style="width:24%"><col style="width:24%"><col style="width:14%"><col style="width:14%">
        </colgroup>
        <tr style="text-align:left;font-size:12px;color:#667085">
          <th style="padding:6px 8px">Horário</th><th style="text-align:left">Sala</th><th style="text-align:left">Paciente</th><th style="text-align:left">Estagiário</th><th>Presença</th><th>Ações</th>
        </tr>${rows}</table>`;
    }).join('');
  }

  async function loadAppointments() {
    const range = getDateRange(agendaView, agendaAnchor);
    document.getElementById('periodLabel').textContent = periodLabel(agendaView, range);

    let query = db.from('appointments')
      .select('id, series_id, appointment_date, start_time, end_time, status, intern_confirmation, patient_confirmation, attendance_status, cancelled_by, cancellation_reason, patient_id, intern_id, room, is_first_session, patients(registration_number, full_name)')
      .gte('appointment_date', toDateStr(range.start))
      .lte('appointment_date', toDateStr(range.end))
      .order('appointment_date').order('start_time');

    if (agendaInternFilter !== 'todos') query = query.eq('intern_id', agendaInternFilter);
    if (agendaPatientFilter !== 'todos') query = query.eq('patient_id', agendaPatientFilter);

    const { data: appts, error } = await query;
    if (error) { listWrap.innerHTML = `<div class="message error" style="display:block">Erro: ${escapeHtml(error.message)}</div>`; return; }

    const printBtn = document.getElementById('printSemanaBtn');
    if (printBtn) {
      printBtn.onclick = async () => {
        const weekRange = getDateRange('semana', agendaAnchor);
        const weekStartStr = toDateStr(weekRange.start);
        const weekEndStr = toDateStr(weekRange.end);

        let weekQuery = db.from('appointments')
          .select('appointment_date, start_time, end_time, room, patient_id, intern_id, patient_confirmation, intern_confirmation, is_first_session, patients(registration_number, full_name)')
          .gte('appointment_date', weekStartStr).lte('appointment_date', weekEndStr)
          .eq('status', 'agendado')
          .order('appointment_date').order('start_time');

        if (agendaInternFilter !== 'todos') weekQuery = weekQuery.eq('intern_id', agendaInternFilter);
        if (agendaPatientFilter !== 'todos') weekQuery = weekQuery.eq('patient_id', agendaPatientFilter);

        const { data: agendados } = await weekQuery;

        if (!agendados || agendados.length === 0) { alert('Nenhum atendimento agendado para essa semana.'); return; }

        const internIdsForPrint = [...new Set(agendados.map(a => a.intern_id))];
        const { data: profilesForPrint } = internIdsForPrint.length
          ? await db.from('profiles').select('id, full_name').in('id', internIdsForPrint)
          : { data: [] };
        const nameByIdForPrint = {};
        (profilesForPrint || []).forEach(p => { nameByIdForPrint[p.id] = p.full_name; });

        const confLabels = { aguardando: 'Aguardando', confirmado: 'Confirmado', nao_confirmado: 'Não confirmado' };

        const rows = agendados.map(a => {
          const patLabel = a.patients ? `#${a.patients.registration_number} ${a.patients.full_name || ''}` : '—';
          const patConfCell = a.is_first_session ? confLabels[a.patient_confirmation] : '— (não se aplica)';
          const internConfCell = a.is_first_session ? confLabels[a.intern_confirmation] : '— (não se aplica)';
          return `<tr>
            <td>${dateWithWeekday(a.appointment_date)}</td><td>${a.start_time.slice(0,5)}–${a.end_time.slice(0,5)}</td>
            <td>${escapeHtml(a.room || '—')}</td><td>${escapeHtml(patLabel)}</td>
            <td>${escapeHtml(nameByIdForPrint[a.intern_id] || '?')}</td>
            <td>${patConfCell}</td><td>${internConfCell}</td>
          </tr>`;
        }).join('');

        const body = `
          <div class="meta">${fmtBr(weekStartStr)} a ${fmtBr(weekEndStr)} · ${agendados.length} atendimento(s) agendado(s)</div>
          <table><tr><th>Data</th><th>Horário</th><th>Sala</th><th>Paciente</th><th>Estagiário</th><th>Conf. paciente</th><th>Conf. estagiário</th></tr>${rows}</table>`;
        exportReportPdf('Agendados da semana', body);
      };
    }

    if (!appts || appts.length === 0) {
      listWrap.innerHTML = `<div class="placeholder">Nenhum atendimento neste período.</div>`;
      return;
    }

    const nowDateStr = toDateStr(new Date());
    const nowTimeStr = new Date().toTimeString().slice(0, 8);
    const isUpcoming = a => a.status === 'agendado'
      && (a.appointment_date > nowDateStr || (a.appointment_date === nowDateStr && a.start_time > nowTimeStr));

    const upcoming = appts.filter(isUpcoming);
    const concluded = appts.filter(a => !isUpcoming(a));

    let html = renderDateGroups(upcoming);
    if (concluded.length > 0) {
      html += `<div style="margin:28px 0 8px;font-weight:700;color:#98a2b3">— Já concluídos —</div>`;
      html += renderDateGroups(concluded);
    }
    if (!html) html = `<div class="placeholder">Nenhum atendimento neste período.</div>`;

    listWrap.innerHTML = html;

    listWrap.querySelectorAll('.toggle-conf-intern').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Confirmar o atendimento é tarefa do estagiário. Deseja mesmo alterar isso agora?')) return;
        const next = btn.dataset.current === 'confirmado' ? 'nao_confirmado' : 'confirmado';
        const { error } = await db.rpc('confirmar_atendimento', { p_appointment_id: btn.dataset.id, p_confirmacao: next });
        if (error) alert('Erro: ' + error.message); else loadAppointments();
      });
    });

    listWrap.querySelectorAll('.toggle-conf-patient').forEach(btn => {
      btn.addEventListener('click', async () => {
        const next = btn.dataset.current === 'confirmado' ? 'nao_confirmado' : 'confirmado';
        const { error } = await db.from('appointments').update({ patient_confirmation: next }).eq('id', btn.dataset.id);
        if (error) alert('Erro: ' + error.message); else loadAppointments();
      });
    });

    listWrap.querySelectorAll('.toggle-presence').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Marcar a presença é tarefa do estagiário. Deseja mesmo alterar isso agora?')) return;
        const next = btn.dataset.current === 'presente' ? 'ausente' : 'presente';
        const { error } = await db.rpc('registrar_atendimento', { p_appointment_id: btn.dataset.id, p_status: next, p_cancelado_por: null });
        if (error) alert('Erro: ' + error.message); else loadAppointments();
      });
    });

    listWrap.querySelectorAll('.open-appt-detail-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const found = (appts || []).find(x => x.id === btn.dataset.id);
        if (found) openApptDetailModal(found);
      });
    });
  }

  // ---- Modal único de detalhes/edição do atendimento ----
  const apptDetailModal = document.getElementById('apptDetailModal');
  document.getElementById('closeApptDetailBtn').onclick = () => { apptDetailModal.style.display = 'none'; };

  async function openApptDetailModal(a) {
    const msgEl = document.getElementById('apptDetailMsg');
    const infoEl = document.getElementById('apptDetailInfo');
    const cancelledBox = document.getElementById('apptDetailCancelledBox');
    const reactivateBtn = document.getElementById('apptReactivateBtn');
    const activeSection = document.getElementById('apptDetailActiveSection');
    msgEl.style.display = 'none';
    apptDetailModal.style.display = 'flex';

    const patLabel = a.patients ? `#${a.patients.registration_number} ${a.patients.full_name || ''}` : '—';
    const internName = nameById[a.intern_id] || '?';
    infoEl.innerHTML = `Paciente: <strong>${escapeHtml(patLabel)}</strong> · Estagiário: <strong>${escapeHtml(internName)}</strong>`;

    const isCancelledAppt = a.status === 'cancelado';

    if (isCancelledAppt) {
      const whoCancelledLabel2 = { paciente: 'Paciente', estagiario: 'Estagiário', coordenacao: 'Coordenação' }[a.cancelled_by] || '';
      const reasonLabel2 = a.cancellation_reason ? CANCELLATION_REASON_LABELS[a.cancellation_reason] || '' : '';
      cancelledBox.innerHTML = `Cancelado por <strong>${escapeHtml(whoCancelledLabel2)}</strong>${reasonLabel2 ? ' — ' + escapeHtml(reasonLabel2) : ''}`;
      cancelledBox.style.display = 'block';
      reactivateBtn.style.display = 'block';
      activeSection.style.display = 'none';

      reactivateBtn.onclick = async () => {
        if (!confirm('Reativar este atendimento? Ele voltará para o status agendado.')) return;
        const { error } = await db.from('appointments').update({
          status: 'agendado', cancelled_by: null, cancelled_at: null, cancellation_reason: null
        }).eq('id', a.id);
        if (error) { alert('Erro: ' + error.message); return; }
        apptDetailModal.style.display = 'none';
        loadAppointments();
      };
      return;
    }

    cancelledBox.style.display = 'none';
    reactivateBtn.style.display = 'none';
    activeSection.style.display = 'block';

    // ---- Este atendimento ----
    document.getElementById('detailApptDate').value = a.appointment_date;
    document.getElementById('detailApptStart').value = a.start_time.slice(0, 5);
    document.getElementById('detailApptEnd').value = a.end_time.slice(0, 5);
    const detailRoomSelect = document.getElementById('detailApptRoom');
    detailRoomSelect.innerHTML = '<option value="">Nenhuma</option>' +
      (roomsList || []).map(r => `<option value="${escapeHtml(r.name)}">${escapeHtml(r.name)}</option>`).join('');
    detailRoomSelect.value = a.room || '';

    document.getElementById('saveApptOnlyBtn').onclick = async () => {
      msgEl.style.display = 'none';
      const newDate = document.getElementById('detailApptDate').value;
      const newStart = document.getElementById('detailApptStart').value;
      const newEnd = document.getElementById('detailApptEnd').value;
      const newRoomOnly = detailRoomSelect.value || null;
      if (!newDate || !newStart || !newEnd || newStart >= newEnd) {
        msgEl.textContent = 'Verifique a data e os horários (início antes do término).';
        msgEl.className = 'message error'; msgEl.style.display = 'block';
        return;
      }

      if (newRoomOnly) {
        const roomConflicts = await checkRoomConflicts(newRoomOnly, [newDate], newStart, newEnd, null, a.id);
        if (roomConflicts.length > 0) {
          const proceed = confirm(`Aviso: a sala "${newRoomOnly}" já tem ${roomConflicts.length} atendimento(s) marcado(s) nesse dia/horário (outro paciente/estagiário). Deseja continuar mesmo assim?`);
          if (!proceed) return;
        }
      }

      const btn = document.getElementById('saveApptOnlyBtn');
      btn.disabled = true; btn.textContent = 'Salvando...';
      const { error } = await db.from('appointments').update({
        appointment_date: newDate, start_time: newStart, end_time: newEnd, room: newRoomOnly
      }).eq('id', a.id);
      btn.disabled = false; btn.textContent = 'Salvar este atendimento';
      if (error) {
        msgEl.textContent = 'Erro ao salvar: ' + error.message;
        msgEl.className = 'message error'; msgEl.style.display = 'block';
        return;
      }
      apptDetailModal.style.display = 'none';
      loadAppointments();
    };

    // ---- Cancelar / Excluir ----
    const cancelReasonWrap = document.getElementById('cancelReasonInlineWrap');
    cancelReasonWrap.style.display = 'none';
    document.getElementById('openCancelSectionBtn').onclick = () => {
      cancelReasonWrap.style.display = 'block';
      document.getElementById('detailCancelReason').value = 'paciente_nao_respondeu';
    };
    document.getElementById('cancelCancelInlineBtn').onclick = () => { cancelReasonWrap.style.display = 'none'; };
    document.getElementById('confirmCancelFromDetailBtn').onclick = async () => {
      const reason = document.getElementById('detailCancelReason').value;
      const { error } = await db.from('appointments').update({
        status: 'cancelado', cancelled_by: 'coordenacao', cancelled_at: new Date().toISOString(), cancellation_reason: reason
      }).eq('id', a.id);
      if (error) { alert('Erro: ' + error.message); return; }
      apptDetailModal.style.display = 'none';
      loadAppointments();
    };

    const hardDeleteBtn = document.getElementById('hardDeleteFromDetailBtn');
    if (a.attendance_status === 'pendente') {
      hardDeleteBtn.style.display = 'inline-block';
      hardDeleteBtn.onclick = async () => {
        if (!confirm('Excluir este atendimento de vez? Isso é diferente de cancelar — não fica nenhum registro no histórico. Use só para erros, como duplicatas.')) return;
        const { error } = await db.from('appointments').delete().eq('id', a.id);
        if (error) { alert('Erro ao excluir: ' + error.message); return; }
        apptDetailModal.style.display = 'none';
        loadAppointments();
      };
    } else {
      hardDeleteBtn.style.display = 'none';
    }

    // ---- Série completa ----
    const seriesSlotSelect = document.getElementById('detailSeriesSlot');
    const seriesStartInput = document.getElementById('detailSeriesStart');
    const seriesEndInput = document.getElementById('detailSeriesEnd');
    const seriesRoomSelect = document.getElementById('detailSeriesRoom');
    seriesSlotSelect.innerHTML = '<option value="">Carregando...</option>';

    const { data: series, error: seriesErr } = await db.from('appointment_series').select('*').eq('id', a.series_id).single();
    if (seriesErr || !series) {
      seriesSlotSelect.innerHTML = '<option value="">Erro ao carregar série</option>';
      return;
    }

    const [clinicSlotsAll, { data: internAvail }, { data: patAvail }] = await Promise.all([
      getEffectiveClinicSlots(),
      db.from('intern_availability').select('weekday, start_time').eq('intern_id', series.intern_id),
      db.from('patient_availability').select('weekday, start_time').eq('patient_id', series.patient_id)
    ]);
    const clinicSlots = clinicSlotsAll.filter(s => s.enabled);

    const candidates = (clinicSlots || []).filter(c => {
      const internMatch = (internAvail || []).some(av => av.weekday === c.weekday && av.start_time.slice(0, 5) === c.start_time.slice(0, 5));
      if (!internMatch) return false;
      if (patAvail && patAvail.length > 0) {
        return patAvail.some(p => p.weekday === c.weekday && p.start_time.slice(0, 5) === c.start_time.slice(0, 5));
      }
      return true;
    }).sort((x, y) => x.weekday - y.weekday || x.start_time.localeCompare(y.start_time));

    const isCurrentInCandidates = candidates.some(c => c.weekday === series.weekday && c.start_time.slice(0, 5) === series.start_time.slice(0, 5));
    const allOptions = isCurrentInCandidates
      ? candidates
      : [{ weekday: series.weekday, start_time: series.start_time, end_time: series.end_time, isCurrentOnly: true }, ...candidates];

    if (allOptions.length === 0) {
      seriesSlotSelect.innerHTML = '<option value="">Nenhum horário compatível encontrado</option>';
    } else {
      seriesSlotSelect.innerHTML = allOptions.map(c => {
        const dayLabel = WEEKDAYS.find(d => d.n === c.weekday).l;
        const val = `${c.weekday}|${c.start_time}|${c.end_time}`;
        const isCurrent = c.weekday === series.weekday && c.start_time.slice(0, 5) === series.start_time.slice(0, 5);
        const label = c.isCurrentOnly
          ? `${dayLabel} ${c.start_time.slice(0,5)}–${c.end_time.slice(0,5)} (atual)`
          : `${dayLabel} ${c.start_time.slice(0,5)}–${c.end_time.slice(0,5)}`;
        return `<option value="${val}" ${isCurrent ? 'selected' : ''}>${label}</option>`;
      }).join('');
      if (!isCurrentInCandidates) {
        msgEl.textContent = 'Atenção: o horário atual desta série não bate mais com os critérios calculados (disponibilidade do estagiário/paciente). Ele foi mantido selecionado para não mudar nada sem querer — troque manualmente se quiser um horário diferente.';
        msgEl.className = 'message error'; msgEl.style.display = 'block';
      }
    }

    seriesStartInput.value = series.series_start;
    seriesEndInput.value = series.series_end;
    seriesRoomSelect.innerHTML = '<option value="">Nenhuma</option>' +
      (roomsList || []).map(r => `<option value="${escapeHtml(r.name)}">${escapeHtml(r.name)}</option>`).join('');
    seriesRoomSelect.value = series.room || '';

    document.getElementById('saveSeriesFromDetailBtn').onclick = async () => {
      msgEl.style.display = 'none';
      const slotVal = seriesSlotSelect.value;
      const newStartDate = seriesStartInput.value;
      const newEndDate = seriesEndInput.value;
      const newRoom = seriesRoomSelect.value || null;
      if (!slotVal || !newStartDate || !newEndDate) {
        msgEl.textContent = 'Selecione o horário, a data de início e a data de término.';
        msgEl.className = 'message error'; msgEl.style.display = 'block';
        return;
      }
      if (newStartDate > newEndDate) {
        msgEl.textContent = 'A data de início não pode ser depois da data de término.';
        msgEl.className = 'message error'; msgEl.style.display = 'block';
        return;
      }
      if (newEndDate < toDateStr(new Date())) {
        msgEl.textContent = 'A data de término não pode ser no passado.';
        msgEl.className = 'message error'; msgEl.style.display = 'block';
        return;
      }

      const [weekdayStr, newStart, newEnd] = slotVal.split('|');
      const newWeekday = parseInt(weekdayStr);
      const btn = document.getElementById('saveSeriesFromDetailBtn');
      btn.disabled = true; btn.textContent = 'Salvando...';

      const todayD = new Date(toDateStr(new Date()) + 'T00:00:00');
      let curr = new Date(todayD);
      while (curr.getDay() !== newWeekday) curr.setDate(curr.getDate() + 1);
      const endD = new Date(newEndDate + 'T00:00:00');
      const newDates = [];
      while (curr <= endD) { newDates.push(toDateStr(curr)); curr.setDate(curr.getDate() + 7); }

      if (newDates.length > 0) {
        const { data: conflicts } = await db.from('appointments')
          .select('appointment_date, start_time, end_time, intern_id, patient_id, series_id')
          .in('appointment_date', newDates).eq('status', 'agendado');

        const hasConflict = (conflicts || []).some(c => c.series_id !== series.id &&
          (c.intern_id === series.intern_id || c.patient_id === series.patient_id) &&
          timesOverlap(c.start_time, c.end_time, newStart, newEnd));

        if (hasConflict) {
          msgEl.textContent = 'Conflito: o estagiário ou o paciente já têm atendimento em horário sobreposto em pelo menos uma dessas datas.';
          msgEl.className = 'message error'; msgEl.style.display = 'block';
          btn.disabled = false; btn.textContent = 'Salvar série completa';
          return;
        }

        if (newRoom) {
          const roomConflicts = await checkRoomConflicts(newRoom, newDates, newStart, newEnd, series.id);
          if (roomConflicts.length > 0) {
            const proceed = confirm(`Aviso: a sala "${newRoom}" já tem ${roomConflicts.length} atendimento(s) marcado(s) nesse(s) dia/horário (outro paciente/estagiário). Deseja continuar mesmo assim?`);
            if (!proceed) {
              btn.disabled = false; btn.textContent = 'Salvar série completa';
              return;
            }
          }
        }
      }

      const { error: delErr } = await db.from('appointments').delete()
        .eq('series_id', series.id).eq('status', 'agendado').eq('attendance_status', 'pendente')
        .gte('appointment_date', toDateStr(new Date()));
      if (delErr) {
        msgEl.textContent = 'Erro ao atualizar: ' + delErr.message;
        msgEl.className = 'message error'; msgEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Salvar série completa';
        return;
      }

      await db.from('appointment_series').update({
        weekday: newWeekday, start_time: newStart, end_time: newEnd,
        series_start: newStartDate, series_end: newEndDate, room: newRoom
      }).eq('id', series.id);

      if (newDates.length > 0) {
        const newAppts = newDates.map(d => ({
          series_id: series.id, patient_id: series.patient_id, intern_id: series.intern_id,
          appointment_date: d, start_time: newStart, end_time: newEnd, room: newRoom, is_first_session: false
        }));
        await db.from('appointments').insert(newAppts);
      }

      if (newRoom) {
        await syncRoomStaffing(newRoom, newWeekday, newStart, newEnd, series.intern_id, nameById);
      }

      btn.disabled = false; btn.textContent = 'Salvar série completa';
      apptDetailModal.style.display = 'none';
      loadAppointments();
    };
  }

  // ---- Formulário de novo agendamento ----
  const fPatient = document.getElementById('fPatient');
  const fIntern = document.getElementById('fIntern');
  const fSlot = document.getElementById('fSlot');
  const fSalaRoom = document.getElementById('fSalaRoom');
  const fSalaSlot = document.getElementById('fSalaSlot');
  const fSalaPatient = document.getElementById('fSalaPatient');
  const fStartDate = document.getElementById('fStartDate');
  const fEndDate = document.getElementById('fEndDate');
  const previewText = document.getElementById('apptPreviewText');
  const confirmBtn = document.getElementById('confirmApptBtn');
  let apptMode = 'estagiario';

  fPatient.innerHTML = '<option value="">Selecione...</option>' +
    patientsList.map(p => `<option value="${p.id}">#${escapeHtml(p.registration_number)} — ${escapeHtml(p.full_name || 'Sem nome')}</option>`).join('');

  document.querySelectorAll('.appt-mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === apptMode);
    btn.addEventListener('click', () => {
      apptMode = btn.dataset.mode;
      document.querySelectorAll('.appt-mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === apptMode));
      document.getElementById('apptModeEstagiario').style.display = apptMode === 'estagiario' ? 'block' : 'none';
      document.getElementById('apptModeSala').style.display = apptMode === 'sala' ? 'block' : 'none';
      resetApptForm(false);
    });
  });

  function resetApptForm(resetMode = true) {
    msg.style.display = 'none';
    if (resetMode) {
      apptMode = 'estagiario';
      document.querySelectorAll('.appt-mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === apptMode));
      document.getElementById('apptModeEstagiario').style.display = 'block';
      document.getElementById('apptModeSala').style.display = 'none';
    }
    fPatient.value = ''; fIntern.innerHTML = '<option value="">Escolha o paciente primeiro</option>'; fIntern.disabled = true;
    fSlot.innerHTML = '<option value="">Escolha o estagiário primeiro</option>'; fSlot.disabled = true;
    document.getElementById('fRoom').value = '';
    fSalaRoom.value = '';
    fSalaSlot.innerHTML = '<option value="">Escolha a sala primeiro</option>'; fSalaSlot.disabled = true;
    fSalaPatient.innerHTML = '<option value="">Escolha o dia e horário primeiro</option>'; fSalaPatient.disabled = true;
    fStartDate.value = ''; fEndDate.value = '';
    previewText.textContent = 'Preencha os campos acima.';
    confirmBtn.disabled = true;
  }

  async function updateInternOptions() {
    const patientId = fPatient.value;
    fIntern.innerHTML = '<option value="">Selecione...</option>';
    fSlot.innerHTML = '<option value="">Escolha o estagiário primeiro</option>';
    fSlot.disabled = true;
    confirmBtn.disabled = true;
    previewText.textContent = 'Preencha os campos acima.';

    if (!patientId) { fIntern.disabled = true; fIntern.innerHTML = '<option value="">Escolha o paciente primeiro</option>'; return; }

    const { data: patAvail } = await db.from('patient_availability').select('weekday, start_time').eq('patient_id', patientId);

    const compatible = internsList.filter(intern => {
      const availForIntern = (allInternAvail || []).filter(a => a.intern_id === intern.id);
      const enabledAvail = availForIntern.filter(a => (clinicSlots || []).some(c => c.weekday === a.weekday && c.start_time.slice(0, 5) === a.start_time.slice(0, 5)));
      if (enabledAvail.length === 0) return false;
      if (patAvail && patAvail.length > 0) {
        return enabledAvail.some(a => patAvail.some(p => p.weekday === a.weekday && p.start_time.slice(0, 5) === a.start_time.slice(0, 5)));
      }
      return true;
    });

    if (compatible.length === 0) {
      fIntern.innerHTML = '<option value="">Nenhum estagiário compatível</option>';
      fIntern.disabled = true;
      return;
    }

    fIntern.innerHTML = '<option value="">Selecione...</option>' + compatible.map(i => `<option value="${i.id}">${escapeHtml(i.full_name)}</option>`).join('');
    fIntern.disabled = false;

    if (pendingQuickSchedule && compatible.some(i => i.id === pendingQuickSchedule.internId)) {
      fIntern.value = pendingQuickSchedule.internId;
      await updateSlotOptions();
    }
  }

  async function updateSlotOptions() {
    const patientId = fPatient.value;
    const internId = fIntern.value;
    fSlot.innerHTML = '<option value="">Selecione...</option>';
    confirmBtn.disabled = true;
    previewText.textContent = 'Preencha os campos acima.';

    if (!patientId || !internId) { fSlot.disabled = true; return; }

    const { data: patAvail } = await db.from('patient_availability').select('weekday, start_time').eq('patient_id', patientId);
    const internAvail = (allInternAvail || []).filter(a => a.intern_id === internId);

    const candidates = (clinicSlots || []).filter(c => {
      const internMatch = internAvail.some(a => a.weekday === c.weekday && a.start_time.slice(0, 5) === c.start_time.slice(0, 5));
      if (!internMatch) return false;
      if (patAvail && patAvail.length > 0) {
        return patAvail.some(p => p.weekday === c.weekday && p.start_time.slice(0, 5) === c.start_time.slice(0, 5));
      }
      return true;
    }).sort((a, b) => a.weekday - b.weekday || a.start_time.localeCompare(b.start_time));

    if (candidates.length === 0) {
      fSlot.innerHTML = '<option value="">Nenhum horário compatível</option>';
      fSlot.disabled = true;
      return;
    }

    fSlot.innerHTML = '<option value="">Selecione...</option>' + candidates.map(c => {
      const dayLabel = WEEKDAYS.find(d => d.n === c.weekday).l;
      return `<option value="${c.weekday}|${c.start_time}|${c.end_time}">${dayLabel} ${c.start_time.slice(0,5)}–${c.end_time.slice(0,5)}</option>`;
    }).join('');
    fSlot.disabled = false;

    if (pendingQuickSchedule && pendingQuickSchedule.internId === internId) {
      const match = candidates.find(c => c.weekday === pendingQuickSchedule.weekday && c.start_time.slice(0, 5) === pendingQuickSchedule.startTime.slice(0, 5));
      if (match) fSlot.value = `${match.weekday}|${match.start_time}|${match.end_time}`;
    }
  }

  // ---- Modo "Por sala" ----
  async function updateSalaSlotOptions() {
    const roomId = fSalaRoom.value;
    fSalaSlot.innerHTML = '<option value="">Selecione...</option>';
    fSalaPatient.innerHTML = '<option value="">Escolha o dia e horário primeiro</option>';
    fSalaPatient.disabled = true;
    confirmBtn.disabled = true;
    previewText.textContent = 'Preencha os campos acima.';

    if (!roomId) { fSalaSlot.disabled = true; fSalaSlot.innerHTML = '<option value="">Escolha a sala primeiro</option>'; return; }

    const [{ data: roomSlots }, { data: roomStaffing }] = await Promise.all([
      db.from('room_schedule_slots').select('*').eq('room_id', roomId).eq('enabled', true),
      db.from('room_staffing').select('*').eq('room_id', roomId)
    ]);

    const staffed = (roomSlots || [])
      .map(s => ({ ...s, staffing: (roomStaffing || []).find(st => st.weekday === s.weekday && st.start_time.slice(0, 5) === s.start_time.slice(0, 5)) }))
      .filter(s => s.staffing)
      .sort((a, b) => a.weekday - b.weekday || a.start_time.localeCompare(b.start_time));

    if (staffed.length === 0) {
      fSalaSlot.innerHTML = '<option value="">Nenhum horário ensalado nesta sala</option>';
      fSalaSlot.disabled = true;
      return;
    }

    fSalaSlot.innerHTML = '<option value="">Selecione...</option>' + staffed.map(s => {
      const dayLabel = ROOM_WEEKDAYS.find(d => d.n === s.weekday).l;
      const internName = nameById[s.staffing.intern_id] || '?';
      return `<option value="${s.weekday}|${s.start_time}|${s.end_time}|${s.staffing.intern_id}">${dayLabel} ${s.start_time.slice(0,5)}–${s.end_time.slice(0,5)} — ${escapeHtml(internName)}</option>`;
    }).join('');
    fSalaSlot.disabled = false;
  }

  async function updateSalaPatientOptions() {
    const slotVal = fSalaSlot.value;
    fSalaPatient.innerHTML = '<option value="">Selecione...</option>';
    confirmBtn.disabled = true;
    previewText.textContent = 'Preencha os campos acima.';

    if (!slotVal) { fSalaPatient.disabled = true; fSalaPatient.innerHTML = '<option value="">Escolha o dia e horário primeiro</option>'; return; }

    const [weekdayStr, startTime] = slotVal.split('|');
    const weekday = parseInt(weekdayStr);

    const compatible = patientsList.filter(p => {
      const availForPatient = (allPatientAvail || []).filter(a => a.patient_id === p.id);
      if (availForPatient.length === 0) return true;
      return availForPatient.some(a => a.weekday === weekday && a.start_time.slice(0, 5) === startTime.slice(0, 5));
    });

    if (compatible.length === 0) {
      fSalaPatient.innerHTML = '<option value="">Nenhum paciente compatível com esse horário</option>';
      fSalaPatient.disabled = true;
      return;
    }

    fSalaPatient.innerHTML = '<option value="">Selecione...</option>' +
      compatible.map(p => `<option value="${p.id}">#${escapeHtml(p.registration_number)} — ${escapeHtml(p.full_name || 'Sem nome')}</option>`).join('');
    fSalaPatient.disabled = false;
  }

  function getCurrentSelection() {
    if (apptMode === 'sala') {
      const slotVal = fSalaSlot.value;
      const patientId = fSalaPatient.value;
      if (!slotVal || !patientId) return null;
      const [weekdayStr, startTime, endTime, internId] = slotVal.split('|');
      const roomObj = (roomsList || []).find(r => r.id === fSalaRoom.value);
      return { patientId, internId, weekday: parseInt(weekdayStr), startTime, endTime, room: roomObj ? roomObj.name : null };
    }
    const slotVal = fSlot.value;
    const patientId = fPatient.value;
    const internId = fIntern.value;
    if (!slotVal || !patientId || !internId) return null;
    const [weekdayStr, startTime, endTime] = slotVal.split('|');
    const room = document.getElementById('fRoom').value.trim() || null;
    return { patientId, internId, weekday: parseInt(weekdayStr), startTime, endTime, room };
  }

  async function calculatePreview() {
    msg.style.display = 'none';
    confirmBtn.disabled = true;

    const sel = getCurrentSelection();
    const startDateStr = fStartDate.value;
    const endDateStr = fEndDate.value;

    if (!sel || !startDateStr || !endDateStr) {
      previewText.textContent = 'Preencha todos os campos para calcular a prévia.';
      return;
    }

    const { patientId, internId, weekday, startTime, endTime, room } = sel;
    const start = new Date(startDateStr + 'T00:00:00');
    const end = new Date(endDateStr + 'T00:00:00');

    if (start > end) {
      msg.textContent = 'A data inicial não pode ser posterior à data final.';
      msg.className = 'message error'; msg.style.display = 'block';
      return;
    }

    let curr = new Date(start);
    while (curr.getDay() !== weekday) curr.setDate(curr.getDate() + 1);
    const generatedDates = [];
    while (curr <= end) { generatedDates.push(new Date(curr)); curr.setDate(curr.getDate() + 7); }

    if (generatedDates.length === 0) {
      previewText.textContent = 'Nenhuma data encontrada para este dia da semana no período.';
      return;
    }

    const dateStrings = generatedDates.map(toDateStr);
    const { data: conflicts } = await db.from('appointments')
      .select('appointment_date, start_time, end_time, intern_id, patient_id')
      .in('appointment_date', dateStrings)
      .eq('status', 'agendado');

    const hasConflict = (conflicts || []).some(c =>
      (c.intern_id === internId || c.patient_id === patientId) &&
      timesOverlap(c.start_time, c.end_time, startTime, endTime)
    );

    if (hasConflict) {
      msg.textContent = 'Conflito: o estagiário ou o paciente já possuem atendimento em horário sobreposto em pelo menos uma dessas datas.';
      msg.className = 'message error'; msg.style.display = 'block';
      return;
    }

    previewText.innerHTML = `Serão gerados <strong>${generatedDates.length} atendimentos semanais</strong>
      (${startTime.slice(0,5)}–${endTime.slice(0,5)}).<br>
      <small>Primeira sessão: ${generatedDates[0].toLocaleDateString('pt-BR')} · Última sessão: ${generatedDates[generatedDates.length-1].toLocaleDateString('pt-BR')}</small>`;
    confirmBtn.disabled = false;

    if (room) {
      const roomConflicts = await checkRoomConflicts(room, dateStrings, startTime, endTime);
      if (roomConflicts.length > 0) {
        previewText.innerHTML += roomConflictWarningHtml(roomConflicts, room);
      }
    }

    confirmBtn.onclick = async () => {
      confirmBtn.disabled = true; confirmBtn.textContent = 'Criando...';

      const { data: series, error: seriesErr } = await db.from('appointment_series').insert([{
        patient_id: patientId, intern_id: internId, weekday, start_time: startTime, end_time: endTime,
        series_start: startDateStr, series_end: endDateStr, status: 'ativa', created_by: currentProfile.id, room
      }]).select().single();

      if (seriesErr) {
        msg.textContent = 'Erro ao criar agendamento: ' + seriesErr.message;
        msg.className = 'message error'; msg.style.display = 'block';
        confirmBtn.disabled = false; confirmBtn.textContent = 'Validar e criar atendimentos';
        return;
      }

      const newAppts = generatedDates.map((d, idx) => ({
        series_id: series.id, patient_id: patientId, intern_id: internId,
        appointment_date: toDateStr(d), start_time: startTime, end_time: endTime,
        room, is_first_session: idx === 0
      }));

      const { error: apptsErr } = await db.from('appointments').insert(newAppts);
      if (apptsErr) {
        msg.textContent = 'Erro ao gerar atendimentos: ' + apptsErr.message;
        msg.className = 'message error'; msg.style.display = 'block';
        confirmBtn.disabled = false; confirmBtn.textContent = 'Validar e criar atendimentos';
        return;
      }

      // O paciente só pode ser escolhido aqui se estiver "Em contato"; agora que foi
      // agendado, passa a "Ativo" automaticamente, para a Situação mostrar "Agendado".
      await db.from('patients').update({ status: 'ativo' }).eq('id', patientId).eq('status', 'em_contato');

      if (apptMode === 'estagiario' && room) {
        await syncRoomStaffing(room, weekday, startTime, endTime, internId, nameById);
      }

      pendingQuickSchedule = null;
      panel.style.display = 'none';
      await loadAppointments();
      confirmBtn.disabled = false; confirmBtn.textContent = 'Validar e criar atendimentos';
    };
  }

  fPatient.addEventListener('change', updateInternOptions);
  fIntern.addEventListener('change', updateSlotOptions);
  [fSlot, fStartDate, fEndDate].forEach(el => el.addEventListener('change', calculatePreview));
  fSalaRoom.addEventListener('change', updateSalaSlotOptions);
  fSalaSlot.addEventListener('change', updateSalaPatientOptions);
  fSalaPatient.addEventListener('change', calculatePreview);

  document.getElementById('newApptBtn').addEventListener('click', async () => {
    resetApptForm();
    panel.style.display = 'block';
    panel.scrollIntoView({ behavior: 'smooth' });
    if (pendingQuickSchedule) {
      // Paciente ainda precisa ser escolhido manualmente; estagiário e horário
      // serão pré-marcados assim que o paciente for selecionado.
      msg.textContent = 'Selecione o paciente para concluir o agendamento rápido a partir da Grade Geral.';
      msg.className = 'message success'; msg.style.display = 'block';
    }
  });
  document.getElementById('cancelApptBtn').addEventListener('click', () => { pendingQuickSchedule = null; panel.style.display = 'none'; });

  await loadAppointments();
}

// ---------------------------------------------------------------------------
// INICIALIZAÇÃO
// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------
// REDEFINIÇÃO DE SENHA (link enviado por e-mail)
// ---------------------------------------------------------------------------
const newPasswordScreen = document.getElementById('newPasswordScreen');
const newPasswordForm = document.getElementById('newPasswordForm');
const newPasswordButton = document.getElementById('newPasswordButton');
const newPasswordMessage = document.getElementById('newPasswordMessage');
let inPasswordRecovery = window.location.hash.includes('type=recovery');

db.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') {
    inPasswordRecovery = true;
    loadingScreen.style.display = 'none';
    loginScreen.style.display = 'none';
    app.style.display = 'none';
    newPasswordScreen.style.display = 'flex';
  }
});

newPasswordForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  const p1 = document.getElementById('newPassword1').value;
  const p2 = document.getElementById('newPassword2').value;
  newPasswordMessage.className = 'message';

  if (p1 !== p2) {
    newPasswordMessage.textContent = 'As senhas não coincidem.';
    newPasswordMessage.className = 'message error';
    return;
  }

  newPasswordButton.disabled = true; newPasswordButton.textContent = 'Salvando...';
  const { error } = await db.auth.updateUser({ password: p1 });
  newPasswordButton.disabled = false; newPasswordButton.textContent = 'Salvar nova senha';

  if (error) {
    newPasswordMessage.textContent = 'Erro ao salvar: ' + error.message;
    newPasswordMessage.className = 'message error';
    return;
  }

  inPasswordRecovery = false;
  await db.auth.signOut();
  newPasswordScreen.style.display = 'none';
  loginScreen.style.display = 'flex';
  loginForm.style.display = 'block';
  forgotPasswordForm.style.display = 'none';
  newPasswordForm.reset();
  showMessage('Senha alterada com sucesso. Entre com sua nova senha.', 'success');
});

// ---------------------------------------------------------------------------
// INICIALIZAÇÃO
// ---------------------------------------------------------------------------
(async function init() {
  if (inPasswordRecovery) {
    loadingScreen.style.display = 'none';
    newPasswordScreen.style.display = 'flex';
    return;
  }
  const { data: { session } } = await db.auth.getSession();
  if (inPasswordRecovery) return;
  if (session?.user) {
    try {
      await loadProfile(session.user);
    } catch (e) {
      await db.auth.signOut();
      loadingScreen.style.display = 'none';
      loginScreen.style.display = 'flex';
      showMessage(e.message || 'Erro ao carregar perfil.');
    }
  } else {
    loadingScreen.style.display = 'none';
    loginScreen.style.display = 'flex';
  }
})();
</script>
